<style>

  /* Shared island UX — tap targets, focus, no sideways scroll */

<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about donating and checking a charity…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 48;
/* =====================================================================
   MODULE 48 — GIVING & SHARING  (Money World block, 3 of 4)
   Vocab: donate, charity.
   L1: The flooded village. Ways to give (money, time, things). A
       give/save/spend jar picker for Kai's $20 week: any amount that
       still covers needs is fine, $0 included; all $20 leaves needs
       unpaid. Named: donate.
   L2: Is it real? Sort five donation requests (real vs. suspicious),
       callback to scams (M23). Named: charity.
   L3: Making it count: give what's needed, keep a giving line in the
       budget, it's okay to say no to pressure, time counts.
   Tone: giving is a choice, never measured by size. No real charities,
   religions, or causes named.
===================================================================== */
const VOCAB = {
  donate:{term:"donate", def:"To give money, things, or time to help others, without expecting anything back. How much is your choice. Small gifts count."},
  charity:{term:"charity", def:"A group whose job is to collect donations and use them to help people, animals, or places in need. A real one is open about who it is and what it does with the money."}
};

const QUESTIONS = {
  "q481a":{type:"mc", prompt:"What does it mean to donate?", concept:"donate", opts:[
    {t:"To give money, things, or time to help others, without expecting anything back", ok:true, fb:"Right. A donation is a gift. How much is your choice."},
    {t:"To lend money that people must pay back", ok:false, fb:"That's a loan (Module 25). A donation is given freely, with nothing owed back."},
    {t:"To buy something that helps you", ok:false, fb:"Buying gets you something. Donating is giving, to help others."}]},
  "q481b":{type:"mc", prompt:"Kai has no spare money this week. How can he still help the flooded village?", concept:"donate", opts:[
    {t:"Give time or things: help mend nets, or donate gear he doesn't use", ok:true, fb:"Right. Time and things are donations too. Mending nets might help more than a few dollars."},
    {t:"He can't. Only money counts", ok:false, fb:"Time, skills, and useful things are all ways to give. Money is just one."},
    {t:"Borrow money so he can donate", ok:false, fb:"Going into debt to give isn't wise. He can give time or things instead."}]},
  "q481c":{type:"tf", prompt:"True or false: giving only counts if you give a lot of money.", answer:false, concept:"donate",
    good:"Right. Small gifts, time, and useful things all count. Giving is about helping, not the size.",
    bad:"Look again. A $2 gift, an afternoon of help, or a spare net all count. Giving isn't measured by size."},
  "q482a":{type:"mc", prompt:"What is a charity?", concept:"charity", opts:[
    {t:"A group that collects donations and uses them to help those in need", ok:true, fb:"Right. A real one is open about who it is and what it does with the money."},
    {t:"A business that sells things to make a profit", ok:false, fb:"A business aims for profit (Module 42). A charity collects gifts to help others."},
    {t:"A bank account that earns interest", ok:false, fb:"That's savings. A charity is a group that uses donations to help."}]},
  "q482b":{type:"mc", prompt:"Which donation request is the most SUSPICIOUS?", concept:"charity", opts:[
    {t:"A stranger: “Cash only, right now! I can't tell you exactly where it goes.”", ok:true, fb:"Right. Cash only, a rush, and no clear answers are the same scam signs from Module 23."},
    {t:"The village elders list exactly what they need and give receipts", ok:false, fb:"That's open and clear: a good sign. The stranger asking for cash only, right now, is the suspicious one."},
    {t:"The school asks families to drop off spare blankets at the office", ok:false, fb:"A known place, a clear need, no rush: a good sign. The pushy stranger is the suspicious one."}]},
  "q483a":{type:"mc", prompt:"The flooded village says it needs nets, rope, and food. Kai has some old toys. What's the most helpful?", concept:"donate", opts:[
    {t:"Give what they asked for, like rope or food, or ask if the toys are wanted", ok:true, fb:"Right. The best gift is one that fits the real need. Asking first makes it count."},
    {t:"Send the toys, because any gift is the same", ok:false, fb:"Toys they didn't ask for may just take up space. Give what they need, or ask first."},
    {t:"Send nothing, because toys aren't money", ok:false, fb:"He can still help, with rope, food, or his time. Give what fits the need."}]},
  "q483b":{type:"mc", transfer:true, prompt:"Lena's school runs a winter coat drive. Lena has no spare money, but she has a warm coat she's outgrown. What can she do?", concept:"donate", opts:[
    {t:"Donate the coat she's outgrown. It's exactly what's needed", ok:true, fb:"Exactly. Different place, same idea: a useful thing, given freely, to a known group with a clear need."},
    {t:"Nothing, because she has no money", ok:false, fb:"Things count too. Her outgrown coat is exactly what the drive is collecting."},
    {t:"Buy a new coat with money she needs for lunch", ok:false, fb:"Giving shouldn't leave her without her own needs. Her outgrown coat is a great gift."}]}
};

const CFG = {
  n:48, title:"Giving & Sharing", homeSub:"Four short lessons. Ways to give, how to check a charity is real, and how to make giving count.",
  pool:["q481a","q481b","q481c","q482a","q482b","q483a"], transfer:"q483b",
  quest:"You chose how much of Kai's week to give, sorted real requests from suspicious ones, and learned to make a gift fit the real need.",
  failKeys:"The keys: to donate is to give money, things, or time freely; how much is your choice and small gifts count; a charity is a group that uses donations to help, and a real one is open and never rushes you; and the best gift fits the real need without leaving your own needs unpaid.",
  nextFile:null,
  passStory:'<p><strong>You now own:</strong> donate and charity.</p>'+
    '<p>A week later, the low village’s boats are back on the water. Kai’s afternoon of mending nets is out there somewhere, catching fish.</p>'+
    '<p>Rana walks him back to the market. "Ads, contracts, rights, giving. That’s the money world around you. Ready to see how you’d handle all of it in one busy week?"</p>'+
    '<p class="muted">Module 49: The Money World Challenge. (Coming soon.)</p>'
};

===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

function jars3(g){
  const rest=WEEK-NEEDS-g, save=rest>0?Math.floor(rest/2):0, spend=WEEK-g-save;
  const short=g>WEEK-NEEDS;
  return '<div class="jars3"><div class="j"><div class="e">🎁</div><div class="l">Give</div><div class="a">$'+g+'</div></div>'+
    '<div class="j"><div class="e">🏦</div><div class="l">Save</div><div class="a">$'+save+'</div></div>'+
    '<div class="j'+(short?' warn':'')+'"><div class="e">🍚</div><div class="l">Needs & spend</div><div class="a">$'+spend+'</div></div></div>';
}

function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  q.opts.forEach((o,i)=>html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>');
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+

    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);

}

      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-47-contracts-and-your-rights.html\'">← Module 47</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
