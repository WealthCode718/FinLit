<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is Money? — Module 1</title>
<style>
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}

  /* ---------- app shell ---------- */
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{
    position:sticky; top:0; z-index:20; background:var(--lagoon);
    padding:12px 16px 8px; border-bottom:1px solid #d9e6e1;
  }
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  /* word shelf — signature element */
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{
    font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep);
    border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink);
  }
  .word-chip:focus-visible{outline:3px solid var(--shell)}

  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .scene{
    background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%);
    border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px;
    font-size:44px; line-height:1.2; box-shadow:var(--shadow); transition:filter 1.2s ease;
  }
  .scene.grayed{filter:grayscale(.95) contrast(.92)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px; font-family:inherit}

  button{
    font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px;
    background:var(--ink); color:#fff; font-weight:700; width:100%;
  }
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{
    display:block; width:100%; text-align:left; background:#fff; color:var(--ink);
    border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px;
  }
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.sel{border-color:var(--ink)}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}

  /* sort task */
  .zones{display:flex; gap:10px; margin-bottom:12px}
  .zone{flex:1; min-height:120px; border:2px dashed var(--sand-deep); border-radius:12px; padding:10px; background:#fffdf8}
  .zone h4{font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; color:var(--ink-soft); text-align:center}
  .sort-item{
    background:#fff; border:2px solid #d9e2de; border-radius:10px; padding:9px 12px; font-size:14px;
    font-weight:600; margin-bottom:8px; cursor:pointer; width:100%; text-align:left; color:var(--ink)
  }
  .sort-item.sel{border-color:var(--shell); background:var(--shell-soft)}
  .sort-item.done{border-color:var(--good); background:#eef7f2; cursor:default}

  /* market day */
  .traders{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px}
  .trader{background:#fff; border-radius:12px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); transition:filter 1s}
  .trader .face{font-size:34px}
  .trader .nm{font-size:12px; font-weight:700; margin:4px 0}
  .trader .pr{font-size:12px; color:var(--ink-soft); margin-bottom:8px}
  .trader button{padding:8px 4px; font-size:13px; border-radius:9px}
  .trader.gray{filter:grayscale(1)}
  .bubble{
    background:var(--night); color:#fff; border-radius:12px; padding:12px 14px; font-size:15px;
    margin-bottom:12px; position:relative;
  }
  .hud{display:flex; justify-content:space-between; align-items:center; background:var(--sand); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-weight:700}
  .rumor{background:var(--shell); color:#fff; border-radius:10px; padding:12px 14px; font-weight:700; margin-bottom:12px; text-align:center}

  /* word card modal */
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{
    background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%;
    text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease;
  }
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}

  /* tutor */
  #tutorBtn{
    position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px;
    padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px;
  }
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{
    position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff;
    border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none;
    flex-direction:column;
  }
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}

  textarea{width:100%; font:inherit; padding:13px 14px; border:2px solid #d9e2de; border-radius:12px; min-height:110px; margin-bottom:10px}
  /* night sky mastery */
  .night{
    background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius);
    padding:34px 22px; text-align:center; margin-bottom:16px;
  }
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .chain-beat{font-size:17px; padding:10px 0; border-bottom:1px dashed #d9e2de}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="dots" id="dots"></div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>

<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>

<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain it differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give me an example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask anything about this lesson…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script>
/* =====================================================================
   CONTENT — rendered from structured objects (matches module-01 JSON)
===================================================================== */
const VOCAB = {
  money:{term:"money", def:"A thing almost everyone will take when you want to get something from them."},
  worth:{term:"worth", def:"How much people want something. If lots of people want it, it is worth a lot."},
  agree:{term:"agree", def:"When people all say yes to the same idea. Money works because everyone agrees it does."}
};

const QUESTIONS = {
  "q11b":{type:"tf", prompt:"True or false: money has to be something you can eat or use, or it doesn't count.", answer:false, concept:"money",
    good:"Right — shells aren't useful by themselves. Money works because everyone takes it, not because it's useful.",
    bad:"Think about the shells. Can you eat a shell? No — but everyone on the island takes them. That's what makes them money."},
  "q11c":{type:"mc", prompt:"What made shells become money on the island?", concept:"money", opts:[
    {t:"Shells are pretty", ok:false, fb:"Being pretty helps, but pretty things aren't automatically money. What did the islanders decide?"},
    {t:"Everyone agreed to take them", ok:true, fb:"Exactly. The deal the islanders made is the whole trick. Remember this — it comes back soon."},
    {t:"Shells are good tools", ok:false, fb:"Shells aren't really tools. They became money for a different reason — what did everyone decide together?"}]},
  "q12a":{type:"mc", prompt:"A storm soaks all the firewood except Rana's dry pile. The next morning, what happens to what dry firewood is worth?", concept:"worth", opts:[
    {t:"It's worth more shells than before", ok:true, fb:"Yes. Everyone wants dry firewood now, and only Rana has it. More people wanting something that's hard to get = worth more."},
    {t:"It's worth the same as before", ok:false, fb:"Worth isn't stuck to a thing forever. It changes when how much people want it changes. Who wants dry firewood after a storm? Everyone."},
    {t:"It's worth less than before", ok:false, fb:"Flip it around: there's LESS dry firewood and MORE people who want it. Would Rana take fewer shells for it, or more?"}]},
  "q12c":{type:"mc", prompt:"Where does worth come from?", concept:"worth", opts:[
    {t:"How big something is", ok:false, fb:"A boulder is huge and worth nothing. A tiny pearl can be worth a lot. Size isn't it."},
    {t:"How much people want it", ok:true, fb:"That's it. Worth lives in people's wanting, not inside the thing itself."},
    {t:"Every thing is born with a fixed worth", ok:false, fb:"Remember the firewood after the storm — same firewood, different worth. Worth changes when wanting changes."}]},
  "q13a":{type:"mc", prompt:"In Market Day, why did shells stop working as money?", concept:"agree", opts:[
    {t:"The shells broke", ok:false, fb:"The shells were fine! Look at what the traders stopped doing, not at the shells."},
    {t:"People stopped agreeing to take them", ok:true, fb:"Exactly. Same shells, no agreement, no money."},
    {t:"Kai ran out of shells", ok:false, fb:"Kai still had shells — the problem was nobody would take them anymore. What disappeared wasn't shells, it was the agreement."}]},
  "q13b":{type:"tf", prompt:"True or false: a paper bill is valuable mostly because of what the paper is made of.", answer:false, concept:"agree",
    good:"Right. The paper itself is nearly worthless. The agreement behind it is what you're really holding.",
    bad:"Tear a corner off a notebook — same kind of paper, worth nothing. The bill is different only because everyone agrees to take it."},
  "q13c":{type:"mc", transfer:true, prompt:"Long ago, people used big stones, salt, and even dried tea as money. What did ALL of these have to have, to work as money?", concept:"agree", opts:[
    {t:"They had to taste good", ok:false, fb:"Stones don't taste like anything. Being useful or tasty isn't what makes money work."},
    {t:"Everyone around had to agree to take them", ok:true, fb:"You've got the deep idea: anything can be money — stones, salt, shells, paper — as long as everyone agrees."},
    {t:"They had to be shiny", ok:false, fb:"Salt isn't shiny. Tea isn't shiny. Something else made them all work — a thing people did together."}]}
};

const SORT_ITEMS = [
  {t:"A warm blanket in winter", zone:"more", fb:"It's freezing and everyone wants one. That pushes worth up."},
  {t:"One fish in a fishing village", zone:"less", fb:"Everyone here catches fish every day. Easy to get = worth less."},
  {t:"Fresh water when the well runs low", zone:"more", fb:"When something everyone needs gets hard to find, its worth goes up."},
  {t:"A bucket of sand on the beach", zone:"less", fb:"Anyone can scoop their own sand. Nobody gives up shells for it."}
];

/* =====================================================================
   STATE + PERSISTENCE (window.storage with in-memory fallback)
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false };
let storageOK = true;

async function loadState(){
  try{ 
    const r = await window.storage.get("mod1-state"); 
    if(r && r.value){ S = Object.assign(S, JSON.parse(r.value)); return; }
  } catch(e){ }
  // Fallback: try localStorage
  try{
    const saved = localStorage.getItem("mod1-state");
    if(saved){ S = Object.assign(S, JSON.parse(saved)); }
  } catch(e){ }
}
async function saveState(){
  try{ await window.storage.set("mod1-state", JSON.stringify(S)); }catch(e){
    try{ localStorage.setItem("mod1-state", JSON.stringify(S)); }catch(e2){}
  }
}
function addXP(n){ S.xp+=n; document.getElementById("xpBox").textContent = S.xp+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k];
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE — each lesson is a list of step-render functions
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function dots(n,i){
  const d=document.getElementById("dots"); d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  saveState();
  goHome();
}

/* ---------- reusable renderers ---------- */
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  const html='<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>';
  show(html);
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 1 — The Island Game
===================================================================== */
const L1=[
  ()=>show('<div class="kicker">Lesson 1 · The Island Game</div>'+
    '<div class="scene">🏝️🐟<div class="cap">A small island. No coins. No paper money.</div></div>'+
    '<div class="card"><p><strong>You have extra fish.</strong></p><p><strong>You really want a warm blanket.</strong></p></div>'+
    '<button onclick="next()">What do you do?</button>'),
  ()=>show('<div class="kicker">Lesson 1 · Your choice</div>'+
    '<h2 class="display">You have extra fish. You really want a warm blanket.</h2>'+
    '<p>What do you do?</p>'+
    '<button class="opt" onclick="next()">Find the blanket maker and offer fish</button>'+
    '<button class="opt" onclick="next()">Hope someone gives you a blanket</button>'+
    '<button class="opt" onclick="next()">I\'m not sure</button>'),
  ()=>{
    const beats=[
      ["🧑🏽‍🦱🐟","Kai has extra fish. Kai wants a blanket."],
      ["🧶🙅🏾‍♀️","The blanket maker doesn't want fish today. She wants firewood."],
      ["🪵🙅🏻‍♂️","The firewood collector doesn't want fish either. He wants a cooking pot."],
      ["😩⛓️","Kai is stuck. Getting ONE blanket has turned into a whole day of asking around."]
    ];
    let b=0;
    function draw(){
      show('<div class="kicker">Lesson 1 · Kai\'s problem</div>'+
        '<div class="scene">'+beats[b][0]+'<div class="cap">'+beats[b][1]+'</div></div>'+
        '<p class="muted">Tap to continue ('+(b+1)+'/'+beats.length+')</p>'+
        '<button onclick="window._b()">'+(b<beats.length-1?"Next":"So what happened?")+'</button>');
      window._b=()=>{ b++; if(b<beats.length) draw(); else next(); };
    }
    draw();
  },
  ()=>show('<div class="kicker">Lesson 1 · The deal</div>'+
    '<div class="scene">🐚✨<div class="cap">One day the islanders make a deal.</div></div>'+
    '<div class="card"><p>From now on, <strong>everyone will take shells.</strong></p>'+
    '<p>You don\'t have to want shells. You just have to know that everyone else takes them.</p>'+
    '<p>Now Kai trades fish for shells, and shells for a blanket. Done before lunch.</p></div>'+
    '<div class="feedback"><strong>Money</strong> is a thing almost everyone will take in exchange for other things.</div>'+
    '<button onclick="earnWord(\'money\');next()">New word: money</button>'),
  ()=>{
    const opts=[
      {e:"🐚",t:"Small shells",ok:true,fb:"Right. Shells are easy to carry, they don't rot, and there are enough for everyone — but not so many that they're everywhere."},
      {e:"🐟",t:"Fresh fish",ok:false,fb:"Fish are useful — but they rot in two days. Your money would go bad before you could use it!"},

function explainBack(followup){
  const prompt = followup
    ? "One more thought: what would happen if shops stopped taking that paper?"
    : "A younger kid asks you: \"Why will the shop give you real food for a piece of paper?\" Explain it to them in your own words.";
  show('<div class="kicker">Mastery · the fun one</div>'+
    '<div class="scene">🧒❓💵<div class="cap"></div></div>'+
    '<h2 class="display">'+prompt+'</h2>'+
    '<textarea id="exp" placeholder="Type your answer…"></textarea>'+
    '<button id="sendExp">Send my answer</button><div id="fb" style="margin-top:12px"></div><div id="cont"></div>');
  document.getElementById("sendExp").onclick=async ()=>{
    const txt=document.getElementById("exp").value.trim();
    if(!txt) return;
    const btn=document.getElementById("sendExp");
    btn.innerHTML='<span class="spin"></span> Reading your answer…'; btn.disabled=true;
    let verdict = await scoreExplain(txt, !!followup);
    btn.style.display='none'; // Hide the spinner button after scoring
    const fb=document.getElementById("fb"), cont=document.getElementById("cont");
    if(verdict.result==="pass"){
      addXP(verdict.bonus?5:0);
      fb.innerHTML='<div class="feedback good">'+verdict.reply+'</div>';
      cont.innerHTML='<button onclick="finishMastery(true)">See my result</button>';
    } else if(verdict.result==="borderline" && !followup){
      fb.innerHTML='<div class="feedback">'+verdict.reply+'</div>';
      cont.innerHTML='<button onclick="explainBack(true)">Answer the follow-up</button>';
    } else {
      fb.innerHTML='<div class="feedback bad">'+verdict.reply+'</div>';
      cont.innerHTML='<button onclick="finishMastery(false)">See my result</button>';
    }
  };
}
async function scoreExplain(answer, isFollowup){
  const sys = "You are a warm, honest tutor inside a financial-literacy app for beginners of all ages. "+
   "The learner has just completed Module 1: What Is Money. They know ONLY these terms: money, worth, agree, plus everyday language. "+
   "NEVER use these words: price, cost, buy, sell, earn, spend, save, bank, pay, currency, barter, economy, purchase, afford. "+
   "Score their explanation of why a shop gives real food for a paper bill. "+
   "PASS if they express in any words that money works because people/everyone agrees or trusts it will be accepted, OR that the paper itself is not the valuable part. "+
   "BORDERLINE if partially there but unclear. FAIL if they say the paper itself is valuable or give no relevant reason. "+
   "Award bonus true if they use their own fresh example or mention worth coming from wanting. "+
   "Reply ONLY with JSON, no markdown fences: {\"result\":\"pass|borderline|fail\",\"bonus\":true|false,\"reply\":\"1-3 warm sentences to the learner, honest, using only permitted words\"}";
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000);
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,
        system:sys,
        messages:[{role:"user",content:(isFollowup?"(This is their answer to the follow-up question about shops no longer taking the paper.) ":"")+"Learner's answer: "+answer}]}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    const data=await r.json();
    const txt=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").replace(/```json|```/g,"").trim();
    const v=JSON.parse(txt);
    if(v && v.result) return v;
    throw new Error("bad json");
  }catch(e){
    // offline fallback: simple keyword rubric so testing is never blocked
    const a=answer.toLowerCase();
    const hit=/agree|trust|everyone|accept|take it|takes it|believe|promise|not the paper|paper.*(worthless|nothing)/.test(a);
    return {result: hit?"pass":"borderline", bonus:false,
      reply: hit?"That's the big idea — it works because everyone agrees to take it. Well said."
                :"You're close. Think back to the shells: what did all the traders stop doing at the same time?"};
  }
}

    "Never repeat an explanation that failed — switch to a new analogy from the learner's world (stickers, game tokens, trading cards). Keep answers under 80 words, warm, honest, never marking a wrong idea as right. If asked to 'Quiz me', ask ONE simple question about money/worth/agree and wait.";
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)})});
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "Hmm, I lost my thread — ask me again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't reach my thinking cap right now. Try again in a moment — or re-read the word cards on your shelf up top.");
  }
}
