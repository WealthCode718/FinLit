<script>
const MODULE_N = 47;
/* =====================================================================
   MODULE 47 — CONTRACTS & YOUR RIGHTS  (Money World block, 2 of 4)
   Vocab: contract, consumer rights.
   L1: The blender paper. Tap every line; find the three catches
       (you only rent it; $8 a month for 3 years; $100 to cancel) plus
       "price may go up." Named: contract. Then a game free trial.
   L2: A broken flashlight + receipt (M33). "Is this my right?" sort.
       Named: consumer rights. How to complain calmly.
   L3: Sign or walk away? challenge (pressure to sign now, phone plan
       small print, written agreement with a friend, kids and contracts).
   Honest framing: rules differ from place to place; ask a trusted
   adult; this is not legal advice.
===================================================================== */
const VOCAB = {
  contract:{term:"contract", def:"An agreement, often written and signed, that both sides must follow. Signing means you agree to ALL of it, even the parts you didn't read."},
  rights:{term:"consumer rights", def:"Protections for people who buy things: to get what you paid for, to be told the real price, to get it fixed, replaced, or refunded if it's broken or not as promised, and to complain. The exact rules differ from place to place."}
};

const QUESTIONS = {
  "q471a":{type:"mc", prompt:"What is a contract?", concept:"contract", opts:[
    {t:"An agreement both sides must follow, often written and signed", ok:true, fb:"Right. Signing means you agree to all of it."},
    {t:"A suggestion you can ignore later if you change your mind about the deal", ok:false, fb:"A contract isn't a suggestion. Once you agree, both sides are expected to follow it."},
    {t:"An ad for a product", ok:false, fb:"An ad tries to make you want something. A contract is the agreement you're held to."}]},
  "q471b":{type:"mc", prompt:"Before signing the blender paper, which question matters MOST for Nalu to ask?", concept:"contract", opts:[
    {t:"“How much will I pay in total, and what does it cost to stop?”", ok:true, fb:"Right. $8 a month for 3 years, plus $100 to cancel. The total and the way out are where the catches hide."},
    {t:"“What color is the blender?”", ok:false, fb:"Nice to know, but the big questions are the total cost and how to get out of it."},
    {t:"“Can I sign it really fast?”", ok:false, fb:"Speed helps the seller, not Nalu. Ask about the total cost and how to cancel."}]},
  "q471c":{type:"tf", prompt:"True or false: if you sign a contract, you've agreed to everything in it, even the parts you didn't read.", answer:true, concept:"contract",
    good:"Right. That's why you read it all, especially the small print, before you sign.",
    bad:"Look again. Your signature says you agree to the WHOLE thing. Not reading a part doesn't get you out of it."},
  "q472a":{type:"mc", prompt:"What are consumer rights?", concept:"rights", opts:[
    {t:"Protections for buyers, like a fix or refund when something's broken", ok:true, fb:"Right. The exact rules differ from place to place, but the idea is the same: buyers are protected."},
    {t:"Rules that say a store must take anything back for any reason, even if you just changed your mind", ok:false, fb:"Not quite. If you just change your mind, it depends on the store's rules. Broken or not as promised is different."},
    {t:"Special deals only for loyal customers", ok:false, fb:"Those are deals. Consumer rights are protections every buyer has."}]},
  "q472b":{type:"mc", prompt:"Kai's new $6 flashlight doesn't work, right out of the box. He has the receipt. What should he do?", concept:"rights", opts:[
    {t:"Go back calmly with the receipt and ask the store to make it right", ok:true, fb:"Right. It's broken and he has proof he bought it. That's exactly what consumer rights are for."},
    {t:"Nothing. Once you pay and leave the store, it's yours, broken or not", ok:false, fb:"He paid for a flashlight that works. Broken out of the box means he can ask the store to make it right."},
    {t:"Shout at the seller until they give him two", ok:false, fb:"Calm, clear, with the receipt works better, and he's only owed what he paid for."}]},
  "q473a":{type:"mc", prompt:"Kai's game offers: “7 days FREE! Then $5 every month until you cancel.” What's the smart move if he tries it?", concept:"contract", opts:[
    {t:"Know it's an agreement to pay, and set a reminder to cancel in time", ok:true, fb:"Right. A free trial is a contract. If he forgets, $5 leaves every month."},
    {t:"Tap yes. Free is free", ok:false, fb:"Only the first 7 days are free. After that it's $5 a month until he cancels."},
    {t:"It can't charge him anything, because kids can't agree to pay for things", ok:false, fb:"If a payment card is linked, it can. Ask a parent, and set a reminder."}]},
  "q473b":{type:"mc", transfer:true, prompt:"Lena's brother sees “FREE PHONE TODAY!” The small print says: “With a 24-month plan at $30 a month. $200 fee to cancel early.” What's true?", concept:"contract", opts:[
    {t:"The phone isn't really free. It's a 2-year contract with a big fee to leave early, so he should read it all first", ok:true, fb:"Exactly. Different paper, same catches as Nalu's blender: a long time, monthly payments, and a cost to get out."},
    {t:"The phone is free, so there's nothing to think about", ok:false, fb:"The small print says $30 a month for 24 months, and $200 to quit early. That's a big contract."},
    {t:"He can cancel any time for free", ok:false, fb:"The paper says canceling early costs $200. Always check how to get out."}]}
};

const CFG = {
  n:47, title:"Contracts & Your Rights", homeSub:"Four short lessons. Read before you sign, and know what buyers are owed.",

  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 4 — Mastery (shared shape: 4 random from pool + 1 transfer)
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=CFG.pool.slice().sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,CFG.transfer].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module '+CFG.n+' quest:</strong> '+CFG.quest+'</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module '+CFG.n+' is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-46-ads-and-real-value.html\'">← Module 46</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
