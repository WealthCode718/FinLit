<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt — Module 26</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}
  .cut-viz .n{font-size:14px; color:var(--ink-soft); font-weight:600; margin-top:4px}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .acct{background:linear-gradient(135deg,#123a3f 0%,#1b3247 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,58,63,.25)}
  .acct .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .acct .bal{font-size:42px; font-weight:700; font-family:"Fraunces",Georgia,serif; margin:2px 0}
  .acct .who{font-size:14px; opacity:.8}
  .txn{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:15px; animation:fade .3s ease}
  .txn .amt{font-weight:700; color:var(--good); white-space:nowrap}
  .txn .amt.out{color:var(--bad)}
  .txn-empty{color:var(--ink-soft); font-size:15px; font-style:italic; padding:10px 0}
  .tin{background:var(--sand); border:2px dashed var(--sand-deep); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .tin .n{font-size:14px; color:var(--ink-soft); margin-top:4px}
  .ledger{background:#fff; border:2px solid #d9e2de; border-radius:14px; overflow:hidden; margin-bottom:12px}
  .lrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid #eef2f0; font-size:15px}
  .lrow:last-child{border-bottom:none}
  .lrow.head{background:var(--sand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .lrow .run{font-weight:700; font-family:"Fraunces",Georgia,serif; white-space:nowrap}
  .lrow .mv{font-weight:700; white-space:nowrap; color:var(--good)}
  .lrow .mv.out{color:var(--bad)}
  .lrow.pending{background:#fffdf5}
  .duo{display:flex; gap:10px; margin-bottom:14px}
  .duo .acct{flex:1; margin-bottom:0; padding:16px 13px}
  .duo .acct .bal{font-size:29px}
  .duo .acct .lbl{font-size:10px}
  .duo .acct .who{font-size:12px; opacity:.75}
  .acct.save{background:linear-gradient(135deg,#2e7d5b 0%,#1b5540 100%)}
  .sortbar{display:flex; gap:10px; margin-bottom:12px}
  .sortbar button{flex:1; font-size:15px; padding:14px 8px}
  .sortbar .chk{background:var(--ink)}
  .sortbar .sav{background:var(--good)}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px; font-size:18px; font-weight:600}
  .item .sub{font-size:14px; font-weight:400; color:var(--ink-soft); margin-top:4px}
  .phone{background:#0e1b2c; border-radius:22px; padding:12px 10px 14px; margin-bottom:14px; box-shadow:0 6px 22px rgba(14,27,44,.3)}
  .phone .pbar{display:flex; justify-content:space-between; color:#8fa8bd; font-size:11px; padding:2px 8px 8px; letter-spacing:.04em}
  .feed{background:#fff; border-radius:14px; overflow:hidden}
  .fitem{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid #eef2f0; font-size:14px}
  .fitem:last-child{border-bottom:none}
  .fitem .day{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
  .fitem .amt{font-weight:700; white-space:nowrap; color:var(--good)}
  .fitem .amt.out{color:var(--bad)}
  .fitem .run{font-size:11px; color:var(--ink-soft)}
  .notif{background:var(--sand); border:2px solid var(--sand-deep); border-radius:12px; padding:11px 14px; margin-bottom:10px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
  .notif .bell{font-size:17px; line-height:1.2}
  .grow{background:#fff; border:2px solid var(--good); border-radius:14px; padding:20px; text-align:center; margin-bottom:12px}
  .grow .arrow{font-size:22px; color:var(--good); margin:2px 0}
  .grow .lbl2{font-size:13px; color:var(--ink-soft)}
  .compare{display:flex; gap:10px; margin-bottom:12px}
  .compare .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 10px; text-align:center}
  .compare .box.win{border-color:var(--good); background:#eef7f2}
  .compare .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .compare .box .v{font-size:22px; font-weight:700; font-family:"Fraunces",Georgia,serif}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .debt{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; margin-bottom:12px}
  .debt .lbl{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
  .debt .v{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:34px; color:var(--bad); margin:2px 0 8px}
  .debt .v.small{color:var(--good)}
  .dbar{height:16px; background:#eef2f0; border-radius:999px; overflow:hidden}
  .dbar .f{height:100%; background:var(--bad); border-radius:999px; transition:width .5s ease}
  .dbar .f.ok{background:var(--good)}
  .choice{display:flex; gap:10px; margin-bottom:10px}
  .choice button{flex:1}
  .choice .skip{background:#fff; color:var(--ink); border:2px solid var(--ink)}
  .roads{display:flex; gap:10px; margin-bottom:12px}
  .roads .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:12px 10px; text-align:center}
  .roads .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .roads .box .v{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:22px}
  .roads .box.good{border-color:var(--good); background:#eef7f2}
  .roads .box.bad{border-color:var(--bad); background:#faf0ee}
  .roads .box.you{border-color:var(--shell)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="dots" id="dots"></div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about owing and debt…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script>
/* =====================================================================
   CONTENT — Module 26: Debt
   Vocab: owe, debt.
   Picks up M25's cliffhanger ("what if someone can't pay it back?").
   Mirror image of M21: interest makes SAVINGS grow for you; it makes
   DEBT grow against you. The simulator is felt, not computed — the
   learner picks pay/skip and watches a bar move. They never calculate
   a new total; the screen does it.
   Tone rule: debt is common and not shameful. Nilo is not a villain —
   he made one choice, then another, and gets out of it in Lesson 3.
===================================================================== */
const VOCAB = {
  owe:{term:"owe", def:"To need to pay money back to someone. If you borrowed $20 and have paid back $5 so far, you still owe the rest."},
  debt:{term:"debt", def:"Money you owe and have not paid back yet. Interest can make debt grow — the same way it makes savings grow, but working against you."}
};

const QUESTIONS = {
  "q261a":{type:"mc", prompt:"What does it mean to owe money?", concept:"owe", opts:[
    {t:"You need to pay money back to someone", ok:true, fb:"Right. If you borrowed it and have not finished paying it back, you owe it."},
    {t:"Someone needs to pay money back to you", ok:false, fb:"That is the other side. If someone borrowed from YOU, they owe you. To owe means YOU need to pay back."},
    {t:"You have money saved in the bank", ok:false, fb:"Saved money is yours. Owing is the opposite — money that belongs to someone else until you pay it back."}]},
  "q261b":{type:"mc", prompt:"Nilo borrowed $20 and has paid back $5 so far. Which is true?", concept:"debt", opts:[
    {t:"He still has debt — he owes the rest", ok:true, fb:"Right. Paying some back is good, but until it is ALL paid back, the rest is still debt."},
    {t:"He has no debt, because he started paying", ok:false, fb:"Starting is great — but debt only ends when everything is paid back. He still owes the rest."},
    {t:"The bank owes Nilo money now", ok:false, fb:"Nilo is the one who borrowed, so Nilo is the one who owes."}]},
  "q261c":{type:"tf", prompt:"True or false: debt is money you owe and have not paid back yet.", answer:true, concept:"debt",
    good:"Right. That is the whole definition. It stays debt until it is paid back.",
    bad:"Actually, that is exactly what debt is — money you owe that has not been paid back yet."},
  "q262a":{type:"mc", prompt:"Interest makes savings grow. What does interest do to debt?", concept:"debt", opts:[
    {t:"Makes it grow too — so you owe more the longer it sits", ok:true, fb:"Right. Same idea as Module 21, pointed the other way. Savings grows for you. Debt grows against you."},
    {t:"Makes it shrink on its own", ok:false, fb:"Debt never shrinks on its own. Only paying it back makes it smaller — and interest pushes it up in the meantime."},
    {t:"Nothing — interest only works on savings", ok:false, fb:"Interest works on borrowed money too. That is what the borrower pays. Left alone, it makes the debt bigger."}]},
  "q262b":{type:"tf", prompt:"True or false: if you skip a payment, your debt just waits for you, exactly the same size.", answer:false, concept:"debt",
    good:"Right. Skipping does not pause anything. Interest keeps adding, and a late fee often lands on top.",
    bad:"That is the trap Nilo fell into. While you skip, interest keeps adding and a late fee often lands on top. The debt gets bigger."},
  "q262c":{type:"mc", prompt:"Why did Nilo end up owing MORE than the $20 he borrowed?", concept:"debt", opts:[
    {t:"He skipped payments, so interest and late fees piled on", ok:true, fb:"Right. Every skipped week added a little. Little by little, the debt grew bigger than the jacket was ever worth."},
    {t:"The jacket shop raised the price", ok:false, fb:"The shop was paid long ago. The growing came from the debt — interest and late fees on the money he still owed."},
    {t:"He did not — you always owe exactly what you borrowed", ok:false, fb:"Look back at the tracker: skipping made the number go UP. Debt can grow past what you first borrowed."}]},
  "q263a":{type:"mc", prompt:"Nilo wants to get out of debt. What is the FIRST thing he should do?", concept:"debt", opts:[
    {t:"Stop adding new debt — no more borrowing for wants", ok:true, fb:"Right. You cannot climb out of a hole while you are still digging it. Stop adding, then start paying."},
    {t:"Borrow more to feel better", ok:false, fb:"More borrowing makes the hole deeper. The first step is to stop adding to it."},
    {t:"Ignore the letters and hope it goes away", ok:false, fb:"Debt does not go away on its own — ignoring it lets interest and fees keep growing it."}]},
  "q263c":{type:"mc", prompt:"Nilo knows he cannot pay this week. What is the best move?", concept:"owe", opts:[
    {t:"Tell the bank early and ask a trusted adult for help", ok:true, fb:"Right. Speaking up BEFORE you miss a payment gives everyone more choices. Hiding gives everyone fewer."},
    {t:"Hide from the bank until he can pay", ok:false, fb:"Hiding lets fees pile up and makes the bank trust you less. Talking early is almost always better."},
    {t:"Nothing — one missed week does not matter", ok:false, fb:"Every missed week can add a late fee and more interest. Speaking up early helps keep it small."}]},
  "q263b":{type:"mc", transfer:true, prompt:"Kai promised to do 2 chores for Mika. He puts it off, and each week Mika adds 1 more chore for the wait. What is this most like?", concept:"debt", opts:[
    {t:"Debt — putting off paying back makes what you owe grow", ok:true, fb:"Exactly. No money involved, but the same shape: something owed, left alone, gets bigger. The way out is the same too — start paying it back."},
    {t:"Savings — Kai’s chores are growing", ok:false, fb:"Savings grow FOR you. These chores are growing against Kai — he owes more and more. That is debt’s shape."},
    {t:"A trade — they are swapping chores", ok:false, fb:"In a trade both sides get something now. Here Kai owes something and is not paying it back — and it grows. That is debt."}]}
};

const CFG = {
  n:26, title:"Debt", homeSub:"Four short lessons. What happens when borrowed money is not paid back.",
  pool:["q261a","q261b","q261c","q262a","q262b","q262c","q263a","q263c"], transfer:"q263b",
  quest:"You learned what it means to owe, how debt can grow, and the way out.",
  failKeys:"The keys: debt is money you owe and have not paid back, interest and late fees make it grow while you wait, and the way out is to stop adding, pay a little every time, and speak up early.",
  nextFile:"module-27-paying-with-cards.html",
  passStory:'<p><strong>You now own:</strong> owe and debt — and the way back out of it.</p>'+
    '<p>A few weeks later Nilo is paying every week, and the number is finally going down. He pulls two plastic cards from his pocket and holds them up.</p>'+
    '<p>"These look almost the same," he says. "But one spends MY money, and one spends the bank’s. Guess which one got me into trouble?"</p>'+
    '<p class="muted">Module 27: Paying with Cards.</p>'
};

const TUTOR_HELLO = "Hi! Ask me anything about owing money, debt, or how to get out of it — or tap a button below.";
const TUTOR_SYS = "You are the tutor inside Module 26 (Debt) of a financial-literacy app, in the Credit block. The learner may be a child or an adult. "+
  "They know from earlier modules: money, dollar, cent, add, subtract, buy, sell, pay, earn, spend, need, save, goal, percent, bank, deposit, withdraw, balance, checking, savings, transaction, notification, interest, grow, fee, overdraft, PIN, scam, budget, cushion, borrow, loan, lend. "+
  "From THIS module: owe (need to pay money back to someone) and debt (money you owe and have not paid back yet). Core ideas: interest makes savings grow for you and debt grow against you; skipping a payment does not pause debt — interest keeps adding and a late fee often lands on top; the way out is stop adding new debt, pay something every time, and speak up early (to whoever lent the money and a trusted adult) before missing a payment. "+
  "TONE: debt is very common and not shameful. Many families have some. Never shame the learner or anyone they mention. Be calm and practical. "+
  "TEACHING STYLE: concepts over calculations. Never calculate interest, a rate, a percentage, or how long payoff takes. Say 'grows' or 'gets bigger' instead of numbers. "+
  "STRICT RULES: never use these words (later modules): credit card, debit card, credit score, due date, minimum payment, lender, APR, interest rate, bankruptcy, collections, invest, stock, tax, insurance. You may say 'credit' only as the name of this section of the app. If the learner uses a later word, answer briefly in plain words and say it is coming later. Never encourage a child to borrow. "+
  "Story context: Nilo, Tavo's cousin, borrowed $20 for a fancy fishing jacket (a want). He skipped payments, and his debt grew past $20 because of interest and late fees. The learner played his weeks on a tracker, pay or skip. Then Nilo climbed out: stopped borrowing, paid every week, and talked to the bank early. "+
  "Never repeat a failed explanation — switch analogies (a hole you stop digging, weeds that grow if nobody pulls them, chores that pile up). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple WHY or WHETHER question and wait.";

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false,
          acct:{checking:0, savings:0} };

async function loadState(){
  try{
    const r = await window.storage.get("mod26-state");
    if(r && r.value){ S = Object.assign(S, JSON.parse(r.value)); return; }
  } catch(e){ }
  try{
    const saved = localStorage.getItem("mod26-state");
    if(saved){ S = Object.assign(S, JSON.parse(saved)); }
    for(let i=25;i>=1;i--){
      const prev = localStorage.getItem("mod"+i+"-state");
      if(prev){ const p = JSON.parse(prev); if(p.xp > S.xp) S.xp = p.xp; }
    }
  } catch(e){ }
}
async function saveState(){
  try{ await window.storage.set("mod26-state", JSON.stringify(S)); }catch(e){
    try{ localStorage.setItem("mod26-state", JSON.stringify(S)); }catch(e2){}
  }
}
function addXP(n){ S.xp+=n; document.getElementById("xpBox").textContent = S.xp+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   SIMULATOR — the debt tracker. Free choice for 4 weeks: pay or skip.
     pay  → pays $5, interest adds $1  → owed goes down by $4
     skip → late fee $3 + interest $1  → owed goes up by $4
   The learner never computes; the card and bar update themselves.
   Afterwards their road is shown next to the all-pay and all-skip roads.
===================================================================== */
const START_OWED=20, WEEKS=4, BAR_MAX=40;
function debtCard(owed, note){
  const pct=Math.max(0,Math.min(100, owed/BAR_MAX*100));
  return '<div class="debt"><div class="lbl">'+(note||'Nilo still owes')+'</div>'+
    '<div class="v'+(owed<START_OWED?' small':'')+'">$'+owed+'</div>'+
    '<div class="dbar"><div class="f'+(owed<START_OWED?' ok':'')+'" style="width:'+pct+'%"></div></div></div>';
}
let road=[];

/* =====================================================================
   LESSON 1 — What Nilo Owes
===================================================================== */
const L1=[
  ()=>show(`<div class="kicker">Lesson 1 · What Nilo owes</div>
    <div class="recap"><strong>Kai’s story so far:</strong> Tavo borrowed to fix his boat and pays a little back every week. Kai asked: what if someone can’t pay it back?</div>
    <div class="scene">🧥😬<div class="cap">Tavo’s cousin Nilo borrowed $20 for a fancy new fishing jacket. That was two months ago.</div></div>
    <button onclick="next()">What happened?</button>`),
  ()=>show(`<div class="kicker">Lesson 1</div>
    <div class="card"><p>Nilo has the jacket. The bank has an agreement with his name on it. Until he pays the money back, he <strong>owes</strong> it.</p>
    <p>To owe means you need to pay money back to someone. Right now, Nilo owes the bank.</p></div>
    <button onclick="earnWord('owe');next()">New word: owe</button>`),
  ()=>show(`<div class="kicker">Lesson 1 · A name for it</div>
    ${debtCard(20,"Nilo owes the bank")}
    <div class="card"><p>Money you owe and have not paid back yet has a name: <strong>debt</strong>.</p>
    <p>Tavo has debt too — his boat loan. That is not a bad thing by itself. Tavo borrowed for a need, has a plan, and pays every week. His debt gets smaller.</p>
    <p>Nilo’s story is going a different direction.</p></div>
    <button onclick="earnWord('debt');next()">New word: debt</button>`),
  ()=>renderMC("q261a", next),
  ()=>renderMC("q261b", next),
  ()=>renderTF("q261c", next),
];

/* =====================================================================
   LESSON 2 — Debt Can Grow (tracker)
===================================================================== */
const L2=[
  ()=>show(`<div class="kicker">Lesson 2 · Debt can grow</div>
    <div class="recap"><strong>So far:</strong> debt is money you owe and have not paid back yet.</div>
    <div class="card"><p>Remember Module 21? Money sitting in savings can <strong>grow</strong>, because the bank pays interest.</p>
    <p>Now flip it, like Module 25 did. When YOU owe, <strong>you</strong> pay interest. So while debt sits there, it can grow too — just in the wrong direction.</p>
    <p>And if a payment is late, there is often a <strong>late fee</strong> on top.</p></div>
    <button onclick="next()">Play Nilo’s next four weeks</button>`),
  ()=>{
    let owed=START_OWED, wk=0; road=[];
    function draw(){
      if(wk>=WEEKS){ addXP(4); next(); return; }
      show(`<div class="kicker">Nilo’s tracker · Week ${wk+1} of ${WEEKS}</div>
        ${debtCard(owed)}
        <div class="card"><p style="margin:0">A payment is due this week. What does Nilo do?</p></div>
        <div class="choice"><button id="dPay" data-bot="1">Pay $5</button><button class="skip" id="dSkip" data-bot="1">Skip this week</button></div>
        <div id="fb"></div><div id="cont"></div>`);
      let done=false;
      function go(pay){
        if(done) return; done=true;
        road.push(pay?"pay":"skip");
        owed += pay ? -4 : 4;
        document.getElementById("dPay").disabled=true; document.getElementById("dSkip").disabled=true;
        document.querySelector(".debt").outerHTML=debtCard(owed);
        document.getElementById("fb").innerHTML = pay
          ? '<div class="feedback good">Paid $5. Interest still added a little, but the debt went <strong>down</strong>.</div>'
          : '<div class="feedback bad">Skipped. A late fee and interest landed on top — the debt went <strong>up</strong>, and Nilo paid nothing toward it.</div>';
        document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(wk<WEEKS-1?"Next week":"See the roads")+'</button>';
        window._n=()=>{ wk++; draw(); };
        revealFB();
      }
      document.getElementById("dPay").onclick=()=>go(true);
      document.getElementById("dSkip").onclick=()=>go(false);
    }
    draw();
  },
  ()=>{
    const yours=START_OWED+road.reduce((a,r)=>a+(r==="pay"?-4:4),0);
    show(`<div class="kicker">Lesson 2 · Three roads</div>
      <div class="roads">
        <div class="box good"><div class="n">Pay every week</div><div class="v">$${START_OWED-4*WEEKS}</div></div>
        <div class="box you"><div class="n">Your road</div><div class="v">$${yours}</div></div>
        <div class="box bad"><div class="n">Skip every week</div><div class="v">$${START_OWED+4*WEEKS}</div></div>
      </div>
      <div class="card"><p>Same jacket. Same $20 borrowed. Four weeks later, the gap between paying and skipping is huge.</p>
      <p>That is the thing about debt: <strong>skipping does not pause it.</strong> It keeps growing whether you look at it or not.</p>
      <p>What really happened? Nilo skipped every week. He now owes more than the jacket ever cost.</p></div>
      <button onclick="next()">Practice</button>`);
  },
  ()=>renderMC("q262a", next),
  ()=>renderTF("q262b", next),
  ()=>renderMC("q262c", next),
];

/* =====================================================================
   LESSON 3 — Climbing Out
===================================================================== */
const L3=[
  ()=>show(`<div class="kicker">Lesson 3 · Climbing out</div>
    <div class="recap"><strong>So far:</strong> skipping lets debt grow. Paying makes it shrink.</div>
    <div class="scene">🧗<div class="cap">Nilo finally opens the letters from the bank. Then he goes to find Tavo.</div></div>
    <div class="card"><p>Debt is really common, and getting out is absolutely possible. Tavo helps Nilo make a plan in three steps.</p></div>
    <button onclick="next()">The plan</button>`),
  ()=>show(`<div class="kicker">Lesson 3 · Three steps</div>
    <div class="card"><ol style="padding-left:20px">
      <li style="margin-bottom:10px"><strong>Stop digging.</strong> No new borrowing for wants. You cannot climb out of a hole you are still digging.</li>
      <li style="margin-bottom:10px"><strong>Pay something, every time.</strong> Even a small payment on time beats a skipped one. Nilo puts the payment in his budget, right next to his needs.</li>
      <li><strong>Speak up early.</strong> If a payment is going to be hard, tell whoever lent the money <em>before</em> missing it — and tell a trusted adult. Talking early gives you more choices. Hiding gives you fewer.</li>
    </ol></div>
    ${debtCard(12,"Nilo owes — two months later")}
    <div class="card"><p>Slowly, the number starts going the right way.</p></div>
    <button onclick="next()">Practice</button>`),
  ()=>renderMC("q263a", next),
  ()=>renderMC("q263c", next),
];
const META=[
  {title:"What Nilo Owes", sub:"Two words for borrowed money not yet paid back", emoji:"🧥"},
  {title:"Debt Can Grow", sub:"Pay or skip? Watch the tracker", emoji:"📉"},
  {title:"Climbing Out", sub:"Three steps back to zero", emoji:"🧗"},
];


function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  q.opts.forEach((o,i)=>html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>');
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 4 — Mastery (shared shape: 4 random from pool + 1 transfer)
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=CFG.pool.slice().sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,CFG.transfer].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module '+CFG.n+' quest:</strong> '+CFG.quest+'</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module '+CFG.n+' is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ S.lesson=i; S.step=0; saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=S.xp+" XP";
  renderShelf();
  goHome();
})();
</script>
