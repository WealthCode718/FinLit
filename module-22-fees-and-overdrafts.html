<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fees & Overdrafts — Module 22</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}

  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}

  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}

  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .acct{background:linear-gradient(135deg,#123a3f 0%,#1b3247 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,58,63,.25)}
  .acct .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .acct .bal{font-size:42px; font-weight:700; font-family:"Fraunces",Georgia,serif; margin:2px 0}
  .acct .who{font-size:14px; opacity:.8}
  .txn{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:15px; animation:fade .3s ease}
  .txn .amt{font-weight:700; color:var(--good); white-space:nowrap}
  .txn .amt.out{color:var(--bad)}
  .txn-empty{color:var(--ink-soft); font-size:15px; font-style:italic; padding:10px 0}
  .tin{background:var(--sand); border:2px dashed var(--sand-deep); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .tin .n{font-size:14px; color:var(--ink-soft); margin-top:4px}
  .ledger{background:#fff; border:2px solid #d9e2de; border-radius:14px; overflow:hidden; margin-bottom:12px}
  .lrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid #eef2f0; font-size:15px}
  .lrow:last-child{border-bottom:none}
  .lrow.head{background:var(--sand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .lrow .run{font-weight:700; font-family:"Fraunces",Georgia,serif; white-space:nowrap}
  .lrow .mv{font-weight:700; white-space:nowrap; color:var(--good)}
  .lrow .mv.out{color:var(--bad)}
  .lrow.pending{background:#fffdf5}
  .duo{display:flex; gap:10px; margin-bottom:14px}
  .duo .acct{flex:1; margin-bottom:0; padding:16px 13px}
  .duo .acct .bal{font-size:29px}
  .duo .acct .lbl{font-size:10px}
  .duo .acct .who{font-size:12px; opacity:.75}
  .acct.save{background:linear-gradient(135deg,#2e7d5b 0%,#1b5540 100%)}
  .sortbar{display:flex; gap:10px; margin-bottom:12px}
  .sortbar button{flex:1; font-size:15px; padding:14px 8px}
  .sortbar .chk{background:var(--ink)}
  .sortbar .sav{background:var(--good)}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px; font-size:18px; font-weight:600}
  .item .sub{font-size:14px; font-weight:400; color:var(--ink-soft); margin-top:4px}
  .phone{background:#0e1b2c; border-radius:22px; padding:12px 10px 14px; margin-bottom:14px; box-shadow:0 6px 22px rgba(14,27,44,.3)}
  .phone .pbar{display:flex; justify-content:space-between; color:#8fa8bd; font-size:11px; padding:2px 8px 8px; letter-spacing:.04em}
  .feed{background:#fff; border-radius:14px; overflow:hidden}
  .fitem{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid #eef2f0; font-size:14px}
  .fitem:last-child{border-bottom:none}
  .fitem .day{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
  .fitem .amt{font-weight:700; white-space:nowrap; color:var(--good)}
  .fitem .amt.out{color:var(--bad)}
  .fitem .run{font-size:11px; color:var(--ink-soft)}
  .notif{background:var(--sand); border:2px solid var(--sand-deep); border-radius:12px; padding:11px 14px; margin-bottom:10px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
  .notif .bell{font-size:17px; line-height:1.2}
  .grow{background:#fff; border:2px solid var(--good); border-radius:14px; padding:20px; text-align:center; margin-bottom:12px}
  .grow .arrow{font-size:22px; color:var(--good); margin:2px 0}
  .grow .lbl2{font-size:13px; color:var(--ink-soft)}
  .compare{display:flex; gap:10px; margin-bottom:12px}
  .compare .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 10px; text-align:center}
  .compare .box.win{border-color:var(--good); background:#eef7f2}
  .compare .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .compare .box .v{font-size:22px; font-weight:700; font-family:"Fraunces",Georgia,serif}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .acct.neg{background:linear-gradient(135deg,#a94436 0%,#7a2e25 100%)}
  .acct .zero{display:inline-block; margin-top:6px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:rgba(255,255,255,.18); border-radius:6px; padding:2px 8px}
  .buyrow{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .buyrow .it{font-size:40px; line-height:1.1}
  .buyrow .nm{font-size:18px; font-weight:700; margin-top:4px}
  .buyrow .pr{font-size:15px; color:var(--ink-soft)}
  .choice{display:flex; gap:10px; margin-bottom:10px}
  .choice button{flex:1}
  .choice .wait{background:#fff; color:var(--ink); border:2px solid var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="dots" id="dots"></div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about fees and overdrafts…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script>
/* =====================================================================
   CONTENT — Module 22: Fees & Overdrafts
   Vocab: fee, overdraft.
   Concept over computation (continues M21's principle): the learner
   never calculates a fee. The skill tested is WHETHER a payment fits
   the balance, and WHY going below zero costs more than the price.
   Numbers stay whole and small so the only question is "enough or not?"
===================================================================== */
const VOCAB = {
  fee:{term:"fee", def:"Money a bank takes out of your account — for a service, or for breaking one of its rules. Interest adds money. A fee takes it away. Many fees can be avoided if you know the rules."},
  overdraft:{term:"overdraft", def:"When you spend or take out more than your balance, so it goes below zero. The bank covers the gap for a moment — and usually charges a fee for it."}
};

const QUESTIONS = {
  "q221a":{type:"mc", prompt:"What is a fee?", concept:"fee", opts:[
    {t:"Money a bank takes out of your account for a service or for breaking a rule", ok:true, fb:"Right. A fee is a charge. It makes your balance smaller, even though you did not buy anything."},
    {t:"A little extra the bank adds for keeping your money there", ok:false, fb:"That is interest — the opposite! Interest adds money. A fee takes money away."},
    {t:"Money you earn by working", ok:false, fb:"Earning brings money in. A fee sends money out — to the bank."}]},
  "q221b":{type:"mc", prompt:"Kai is charged $1 every month for a paper statement in the mail. What is the best way to stop that fee?", concept:"fee", opts:[
    {t:"Read his transactions on his phone instead, and turn off the paper statement", ok:true, fb:"Exactly. He already reads everything on his phone. Same information, no fee. Knowing the rule is what saved him."},
    {t:"Close his savings account", ok:false, fb:"That would not touch the paper fee at all — and he would lose his interest. Fix the rule that causes the fee instead."},
    {t:"Nothing — fees can never be avoided", ok:false, fb:"Many fees CAN be avoided once you know why they happen. This one ends the day Kai switches to reading on his phone."}]},
  "q221c":{type:"tf", prompt:"True or false: interest and fees both add money to your account.", answer:false, concept:"fee",
    good:"Right — they point in opposite directions. Interest adds a little. A fee takes some away.",
    bad:"Only interest adds. A fee is money the bank takes OUT. They point in opposite directions."},
  "q222a":{type:"mc", prompt:"What is an overdraft?", concept:"overdraft", opts:[
    {t:"Spending more than your balance, so it goes below zero", ok:true, fb:"Right. The balance does not just hit zero — it goes past it, and the bank has to cover the gap."},
    {t:"Having a lot of money in savings", ok:false, fb:"That is a great thing to have, but it is not an overdraft. An overdraft means your balance went below zero."},
    {t:"Any deposit bigger than $10", ok:false, fb:"Deposits make your balance bigger. An overdraft is when it goes the other way — all the way below zero."}]},
  "q222b":{type:"mc", prompt:"Why does an overdraft cost more than just the price of what you bought?", concept:"overdraft", opts:[
    {t:"The bank adds a fee on top — and your next deposit has to fill the gap first", ok:true, fb:"Right. You pay the price, then a fee, and then part of your next money is already used up before you even see it."},
    {t:"It doesn't — you only ever pay the price", ok:false, fb:"Look back at Kai's net. The price was $9, but going below zero added a $5 fee on top. The overdraft itself costs money."},
    {t:"Because the shop charges extra", ok:false, fb:"The shop charged the normal price. The extra came from the BANK, as an overdraft fee."}]},
  "q222c":{type:"tf", prompt:"True or false: if the bank lets a payment go through, that means you had enough money.", answer:false, concept:"overdraft",
    good:"Right — that is the trap. Some banks let a payment go through anyway, then charge a fee because you did NOT have enough.",
    bad:"That is the trap Kai fell into. Some banks let a payment go through even when the balance is too small — and then charge a fee for it."},
  "q223a":{type:"mc", prompt:"What is the best habit for never having an overdraft?", concept:"overdraft", opts:[
    {t:"Look at your balance before you pay for something", ok:true, fb:"Exactly. One look answers the only question that matters: is there enough? Kai’s phone makes that look take two seconds."},
    {t:"Pay first, check the balance at the end of the month", ok:false, fb:"By the end of the month the fee has already happened. The look has to come BEFORE the payment."},
    {t:"Only shop on weekends", ok:false, fb:"The day does not matter. What matters is looking at the balance before paying."}]},
  "q223c":{type:"mc", prompt:"Kai has $4 in checking. The sandals he wants cost $6. What should he do?", concept:"overdraft", opts:[
    {t:"Wait — save up until his balance covers the sandals", ok:true, fb:"Right. $4 is less than $6, so paying now would go below zero. Waiting costs nothing. An overdraft costs a fee."},
    {t:"Pay now and hope the bank lets it through", ok:false, fb:"Even if the bank lets it through, the balance goes below zero and a fee lands on top. Waiting is free."},
    {t:"Pay now — it is only $2 more than he has", ok:false, fb:"Being a little short is still being short. Below zero is below zero, and the fee does not care how small the gap was."}]},
  "q223b":{type:"mc", transfer:true, prompt:"The island library lets you take a book home for one week. If you bring it back late, you pay $1. What is that $1?", concept:"fee", opts:[
    {t:"A fee — a charge for breaking a rule, and you can avoid it by returning the book on time", ok:true, fb:"Exactly. Same shape as a bank fee: a rule, a charge for breaking it, and an easy way to never pay it."},
    {t:"Interest — the library is thanking you", ok:false, fb:"Interest adds money to YOU. This $1 goes from you to the library. That makes it a fee."},
    {t:"The price of the book", ok:false, fb:"You are not buying the book — you bring it back. The $1 is only charged for being late. That is a fee."}]}
};

const CFG = {
  n:22, title:"Fees & Overdrafts", homeSub:"Four short lessons. Why going below zero costs more than the price.",
  pool:["q221a","q221b","q221c","q222a","q222b","q222c","q223a","q223c"], transfer:"q223b",
  quest:"You learned what a fee is, why an overdraft costs extra, and the one habit that prevents it.",
  failKeys:"The keys: a fee takes money away (interest adds it), an overdraft means going below zero, and one look at your balance before paying prevents it.",
  nextFile:"module-23-protecting-your-money.html",
  passStory:'<p><strong>You now own:</strong> fee and overdraft — and the habit that keeps both away: look before you pay.</p>'+
    '<p>That night Kai’s phone buzzes again. But this message is different. It does not say money in or money out.</p>'+
    '<p style="text-align:center"><strong>"FinLit Bank: Your account is LOCKED. Reply with your secret number in the next 10 minutes or lose everything!"</strong></p>'+
    '<p>Kai’s thumb hovers over the screen.</p>'+
    '<p class="muted">Module 23: Protecting Your Money.</p>'
};

const TUTOR_HELLO = "Hi! Ask me anything about fees, overdrafts, or staying above zero — or tap a button below.";
const TUTOR_SYS = "You are the tutor inside Module 22 (Fees & Overdrafts) of a financial-literacy app, in the Banking block. The learner may be a child or an adult. "+
  "They know from earlier modules: money, dollar, cent, add, subtract, buy, sell, pay, earn, spend, need, save, goal, percent, bank, deposit, withdraw, balance, checking, savings, transaction, notification, interest, grow. "+
  "From THIS module: fee (money a bank takes out of your account for a service or for breaking a rule; the opposite direction from interest; many fees can be avoided by knowing the rules) and overdraft (spending more than your balance so it goes below zero; the bank covers the gap for a moment and usually charges a fee; the next deposit has to fill the gap first). "+
  "Core habit: look at your balance BEFORE you pay. If the balance is smaller than the price, wait. "+
  "TEACHING STYLE: concepts over calculations. Never compute a fee, a percentage, or a rate. You may compare two whole-dollar amounts to decide if there is enough (for example $4 is less than $6, so there is not enough). Keep answers about WHY and WHETHER. Do not teach negative-number arithmetic; say 'below zero' or 'short by'. "+
  "STRICT RULES: never use these words (later modules): borrow, loan, lend, credit, debt, owe, APR, rate, PIN, scam, password, cushion, budget, invest, tax, insurance. If the learner uses one, answer briefly in plain words and say it is coming later. "+
  "Story context: a $1 paper statement fee appeared in Kai's feed; he stopped it by reading on his phone instead. Later he had $6 in checking, paid $9 for a net without looking, went $3 below zero, and got a $5 overdraft fee on top. Then he practiced deciding pay-or-wait by looking at his balance first. "+
  "Never repeat a failed explanation — switch analogies (a cup that overflows, a late library book, a line you should not step past). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple WHY or WHETHER question and wait.";

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false,
          acct:{checking:0, savings:0} };

async function loadState(){
  try{
    const r = await window.storage.get("mod22-state");
    if(r && r.value){ S = Object.assign(S, JSON.parse(r.value)); return; }
  } catch(e){ }
  try{
    const saved = localStorage.getItem("mod22-state");
    if(saved){ S = Object.assign(S, JSON.parse(saved)); }
    for(let i=21;i>=1;i--){
      const prev = localStorage.getItem("mod"+i+"-state");
      if(prev){ const p = JSON.parse(prev); if(p.xp > S.xp) S.xp = p.xp; }
    }
  } catch(e){ }
}
async function saveState(){
  try{ await window.storage.set("mod22-state", JSON.stringify(S)); }catch(e){
    try{ localStorage.setItem("mod22-state", JSON.stringify(S)); }catch(e2){}
  }
}
function addXP(n){ S.xp+=n; document.getElementById("xpBox").textContent = S.xp+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   SIMULATOR — M22 lets the balance go BELOW ZERO for the first time.
   A red account card is the whole visual for "overdraft". No negative-
   number arithmetic is asked of the learner; the words "below zero"
   carry the idea.
===================================================================== */
function money(n){ return (n<0?"−":"") + "$" + Math.abs(n).toFixed(2); }
function acctCard(bal, note){
  return '<div class="acct'+(bal<0?' neg':'')+'"><div class="lbl">Checking</div>'+
    '<div class="bal">'+money(bal)+'</div>'+
    '<div class="who">'+(note||'Kai')+'</div>'+
    (bal<0?'<div class="zero">below zero</div>':'')+'</div>';
}
function feed(rows){
  let h='<div class="phone"><div class="pbar"><span>FinLit Bank</span><span>Checking</span></div><div class="feed">';
  rows.forEach(r=>{
    h+='<div class="fitem"><span><span class="day">'+r.day+'</span><br>'+r.label+'</span>'+
       '<span class="amt'+(r.amt<0?' out':'')+'">'+(r.amt<0?'−':'+')+'$'+Math.abs(r.amt).toFixed(2)+'</span></div>';
  });
  return h+'</div></div>';
}

/* =====================================================================
   LESSON 1 — The Line Nobody Bought
===================================================================== */
const L1=[
  ()=>show(`<div class="kicker">Lesson 1 · The line nobody bought</div>
    <div class="recap"><strong>Kai’s story so far:</strong> His savings grew on its own. Interest — a thank-you from the bank. So why is there a line in his feed that went the other way?</div>
    ${feed([{day:"Mon",label:"Market morning",amt:5},{day:"Tue",label:"Paper statement",amt:-1},{day:"Wed",label:"Bread",amt:-2}])}

    <button onclick="next()">Ask Rana</button>`),
  ()=>show(`<div class="kicker">Lesson 1</div>
    <div class="scene">📄✉️<div class="cap">"Every month the bank mails you a paper list of your transactions," Rana says. "And this bank charges for it."</div></div>
    <div class="card"><p>That $1 is called a <strong>fee</strong> — money a bank takes out of your account for a service, or for breaking one of its rules.</p>

/* =====================================================================
   LESSON 2 — Below Zero
===================================================================== */
const L2=[
  ()=>show(`<div class="kicker">Lesson 2 · Below zero</div>
    <div class="recap"><strong>So far:</strong> a fee takes money away, and many fees can be dodged by knowing the rules.</div>
    ${acctCard(6,"Kai · end of a busy week")}

/* =====================================================================
   LESSON 3 — Look Before You Pay (pay-or-wait simulator)
   Correct choice = Pay if balance covers price, else Wait. A wrong
   "Pay" shows what WOULD happen but is not applied; the learner picks
   again. The only skill is comparing two whole numbers.
===================================================================== */
const SHOP=[
  {em:"🍞", nm:"Bread and fruit", pr:3},
  {em:"🪝", nm:"Fish hooks", pr:4},
  {em:"🪁", nm:"A bright red kite", pr:7},
  {em:"💧", nm:"Water jug", pr:2},
  {em:"🩴", nm:"New sandals", pr:6}
];
const L3=[
  ()=>show(`<div class="kicker">Lesson 3 · Look before you pay</div>
    <div class="recap"><strong>So far:</strong> an overdraft costs the price, plus a fee, plus a hole in your next deposit.</div>
    <div class="card"><p>Kai makes himself one rule. Before paying for anything, he opens his phone and asks a single question:</p>
    <p style="text-align:center; font-size:19px"><strong>Is my balance at least as big as the price?</strong></p>
    <p>Yes → pay. No → wait. That is the whole rule. Now you try it with Kai’s next trip to the market.</p></div>
    <button onclick="next()">Start with $12</button>`),
  ()=>{
    let bal=12, i=0;
    function draw(){
      if(i>=SHOP.length){ addXP(6); next(); return; }
      const it=SHOP[i];
      show(`<div class="kicker">Pay or wait · ${i+1} of ${SHOP.length}</div>
        ${acctCard(bal,"Kai · checking right now")}
        <div class="buyrow"><div class="it">${it.em}</div><div class="nm">${it.nm}</div><div class="pr">costs $${it.pr}</div></div>
        <div class="choice"><button id="pPay">Pay now</button><button class="wait" id="pWait">Wait</button></div>
        <div id="fb"></div><div id="cont"></div>`);
      const enough = bal>=it.pr;
      let done=false;
      function finish(msg){
        done=true;
        document.getElementById("pPay").disabled=true; document.getElementById("pWait").disabled=true;
        document.getElementById("fb").innerHTML='<div class="feedback good">'+msg+'</div>';
        document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(i<SHOP.length-1?"Next item":"Done")+'</button>';
        window._n=()=>{ i++; draw(); };
        revealFB();
      }
      document.getElementById("pPay").onclick=()=>{
        if(done) return;
        if(enough){ bal-=it.pr; addXP(1);
          finish(`Right — $${bal+it.pr} covers $${it.pr}. Paid, and the balance stays above zero.`);
          document.querySelector(".acct").outerHTML=acctCard(bal,"Kai · checking right now");
        } else {
          document.getElementById("fb").innerHTML='<div class="feedback bad">Look again: the balance is $'+bal+' and the price is $'+it.pr+'. Paying would go below zero — and an overdraft fee would land on top. Try the other choice.</div>';
          revealFB();
        }
      };
      document.getElementById("pWait").onclick=()=>{
        if(done) return;
        if(!enough){ addXP(1);
          finish(`Right — $${bal} is less than $${it.pr}. Waiting costs nothing. Kai can save up and come back for it.`);
        } else {
          document.getElementById("fb").innerHTML='<div class="feedback bad">You can wait if you like — but there is enough here: $'+bal+' covers $'+it.pr+'. The rule says this one is safe to pay. Try again.</div>';
          revealFB();
        }
      };
    }
    draw();
  },
  ()=>show(`<div class="kicker">Lesson 3 · Rana’s extra trick</div>
    <div class="card"><p>Kai finished the market with money left and <strong>zero</strong> fees. One look, every time.</p>
    <p>Rana shares one more trick: "I keep a few dollars in checking that I pretend are not there. If I ever forget to look, those few dollars catch me before I go below zero."</p>
    <p>And the goal money? It stays in savings, where Kai does not spend it by accident — and where it keeps growing.</p></div>
    <button onclick="next()">Practice</button>`),
  ()=>renderMC("q223a", next),
  ()=>renderMC("q223c", next),
];
const META=[
  {title:"The Line Nobody Bought", sub:"A charge Kai never agreed to", emoji:"📄"},
  {title:"Below Zero", sub:"What happens when you pay without looking", emoji:"🕳️"},
  {title:"Look Before You Pay", sub:"Pay or wait? One rule decides", emoji:"👀"},
];


function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  q.opts.forEach((o,i)=>html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>');
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+

}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},

   HOME

function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';

    const locked = i>0 && !S.done[i-1];

      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ S.lesson=i; S.step=0; saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=S.xp+" XP";
  renderShelf();
  goHome();
})();
