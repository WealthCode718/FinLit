<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>FinLit — The Earning Challenge — Module 34</title>
<style>

  .week{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:var(--shell); display:inline-block; border-radius:6px; padding:2px 10px; margin-bottom:8px; font-weight:700}
  .stars{font-size:28px; letter-spacing:4px; text-align:center; margin:6px 0}
  .recaplist{list-style:none}
  .recaplist li{padding:8px 0; border-bottom:1px solid #eef2f0}
  .recaplist li:last-child{border-bottom:none}
  .goal{background:#fff; border:2px solid var(--good); border-radius:14px; padding:14px 16px; margin-bottom:12px}
  .goal .lbl{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; display:flex; justify-content:space-between}
  .goal .bar{height:16px; border-radius:999px; background:#eef2f0; overflow:hidden; margin-top:8px}
  .goal .bar div{height:100%; background:var(--good); border-radius:999px; transition:width .6s ease}
  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{

<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>

    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>

</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about tax returns and refunds…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 34;
/* =====================================================================
   CONTENT — Module 34: The Earning Challenge (Earning & Taxes finale)
   Vocab: tax return, refund.
   Concept only: a tax return is the once-a-year check of "was the right
   amount of tax paid?" — three possible outcomes (refund / pay a bit
   more / nothing). No forms, no country-specific rules, no rates.
   The season challenge pays off the SAIL GOAL that has run since the
   Foundations and Banking seasons — Kai finally buys it.
   Honesty is taught as non-negotiable: leaving income off a tax return
   is against the rules.
===================================================================== */
const VOCAB = {
  taxreturn:{term:"tax return", def:"A form you fill out once a year telling the government how much you earned and how much tax was already taken. It checks whether you paid the right amount."},
  refund:{term:"refund", def:"Money given back to you, often because you paid too much. Kai’s tax refund is his own money coming home — not a bonus, so give it a job."}
};

const QUESTIONS = {
  "q341a":{type:"mc", prompt:"What is a tax return?", concept:"taxreturn", opts:[
    {t:"A once-a-year form that checks whether you paid the right amount of tax", ok:true, fb:"Right. It lists what you earned and what was already taken, and checks if they match up."},
    {t:"Taking something back to a shop", ok:false, fb:"That is returning an item. A tax return is a yearly form about your income and your taxes."},
    {t:"A form to ask for a loan", ok:false, fb:"Nothing borrowed here. A tax return checks whether the tax you paid during the year was the right amount."}]},
  "q341b":{type:"mc", prompt:"On Kai\u2019s island, what happens if too LITTLE tax was taken during the year?", concept:"taxreturn", opts:[
    {t:"You pay the rest of what you owe", ok:true, fb:"Right. The return works both ways: too much taken → money back; too little → you pay the difference."},
    {t:"Nothing — you get to keep the difference", ok:false, fb:"Taxes are required. If too little was paid, the return is where you pay the rest."},
    {t:"You get a refund anyway", ok:false, fb:"On Kai\u2019s island, a refund only comes when too MUCH was taken. Too little means you pay a bit more."}]},
  "q341c":{type:"tf", prompt:"True or false: it is fine to leave some income off your tax return if it gets you a bigger refund.", answer:false, concept:"taxreturn",
    good:"Right. A tax return must be honest and complete. Leaving income out is against the rules.",
    bad:"Never. A tax return has to include all your income. Leaving some out to get more back is against the rules."},
  "q342a":{type:"mc", prompt:"What is a refund?", concept:"refund", opts:[
    {t:"Money given back to you, often because you paid too much", ok:true, fb:"Right. At a shop, or on Kai\u2019s tax return, it is money coming back to you."},
    {t:"A prize for filling out forms", ok:false, fb:"It is not a prize for paperwork. For Kai, it was his own money — he paid too much, and it came back."},
    {t:"Money the government lends you", ok:false, fb:"Nothing to pay back. A refund is your own money returned."}]},
  "q342b":{type:"mc", prompt:"Kai gets a $6 tax refund. What is the smartest way to think about it?", concept:"refund", opts:[
    {t:"It is his own money coming home — give it a job in his budget", ok:true, fb:"Right. Not free money, not a surprise bonus to blow. Like every dollar, it gets a job."},
    {t:"Free money — spend it all right away", ok:false, fb:"It was his money all along. Treat it like any other dollar: give it a job first."},
    {t:"He should send it back", ok:false, fb:"It is his! Too much was taken, so it comes back. He just needs to plan it."}]},
  "q342c":{type:"tf", prompt:"True or false: a message saying “You have a tax refund! Reply with your PIN to get it” is real.", answer:false, concept:"refund",
    good:"Right. That is a scam. Nobody real ever asks for your PIN — not the bank, not the government.",
    bad:"It is a scam. It asks for a PIN and dangles money. Tricksters love pretending to be the tax office."},
  "q343a":{type:"mc", prompt:"Kai earned $52 this pay period, and $5 was taken for taxes. Which number does his budget start with?", concept:"refund", opts:[
    {t:"$47 — his take-home pay", ok:true, fb:"Right. Plan with what actually lands."},
    {t:"$52 — what he earned", ok:false, fb:"He never sees $52 in his account. Plan with take-home pay: $47."},
    {t:"$57 — earned plus taxes", ok:false, fb:"Taxes come OUT, not in. Take-home pay is $47."}]},
  "q343b":{type:"mc", transfer:true, prompt:"Kai buys a net, but it rips on the first day. He brings it back with his receipt, and the shop gives him his money back. What is that money called?", concept:"refund", opts:[
    {t:"A refund — money given back because he paid for something he did not get", ok:true, fb:"Exactly. Same word as a tax refund, same shape: money that was his, coming home. And the receipt made it possible."},
    {t:"Income — new money coming in", ok:false, fb:"It is not new money — it was already his. A refund is his own money coming back."},
    {t:"A loan from the shop", ok:false, fb:"Nothing to pay back. The shop is returning what he paid. That is a refund."}]}
};

const CFG = {
  n:34, title:"The Earning Challenge", homeSub:"Four short lessons. The yearly check-up, then a whole season of work.",
  pool:["q341a","q341b","q341c","q342a","q342b","q342c","q343a"], transfer:"q343b",
  quest:"You learned what a tax return and a refund are, then ran a whole season of earning — and bought the sail.",
  failKeys:"The keys: a tax return is the once-a-year check that the right tax was paid (in Kai’s case, too much → refund, too little → pay the rest), it must be honest, and a refund is your own money coming home — give it a job.",
  badge:" · Earning & Taxes block complete 💼",

const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-33-sales-tax.html\'">← Module 33</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
