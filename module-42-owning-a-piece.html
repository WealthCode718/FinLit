<title>FinLit — Owning a Piece — Module 42</title>
<style>

  .grid10{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:6px 0 10px}

  .stars{font-size:28px; letter-spacing:4px; text-align:center; margin:6px 0}
  /* Shared island UX — tap targets, focus, no sideways scroll */

  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}

<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about stock and profit…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 42;
/* =====================================================================
   MODULE 42 — OWNING A PIECE  (Investing block, 3 of 6)
   Vocab: stock, profit.  ("business" has been used informally since
   M9/M30 and is not a shelf word.)
   L1: Nalu splits her juice stand into 10 equal pieces (M13/M14 callback)
       to pay for a second stand; Kai buys one. Named: stock.
   L2: Profit day. A good month (sales − costs = profit, split 10 ways),
       a rainy month (no profit), then what a piece could sell for.
       Two ways a stock can bring a return; both can go down.
   L3: Would you buy a piece? Includes "all eggs in one stand" as
       show-then-name for M43 (diversify).
   Concept over computation: only small subtraction and ÷10.
===================================================================== */
const VOCAB = {
  stock:{term:"stock", def:"A small piece of owning a business. If a business is split into 10 equal pieces and you buy one, you own 1/10 of it."},
  profit:{term:"profit", def:"The money a business has left after it pays all its costs. Owners share in the profit. Some months there is none."}
};

const QUESTIONS = {
  "q421a":{type:"mc", prompt:"Nalu splits her juice stand into 10 equal pieces. Kai buys 1 piece. What does Kai have?", concept:"stock", opts:[
    {t:"Stock: he owns 1/10 of the juice stand", ok:true, fb:"Right. A stock is a small piece of owning the business. His piece is 1 of 10."},
    {t:"A loan: Nalu owes him $10 back", ok:false, fb:"With a loan, the borrower must pay you back. Kai didn't lend Nalu money. He bought a piece of the stand, so he is part owner."},
    {t:"A coupon for 10 free juices", ok:false, fb:"He didn't buy juice. He bought a piece of the stand itself. That is stock."}]},
  "q421b":{type:"mc", prompt:"Why did Nalu sell pieces of her stand at all?", concept:"stock", opts:[
    {t:"To get money to grow the business, a second stand, without borrowing", ok:true, fb:"Right. Selling pieces brought in $60. In return, she now shares the stand with its new owners."},
    {t:"Because the stand was about to close", ok:false, fb:"The stand was doing well. Nalu wanted money to open a second one."},
    {t:"Because the bank told her to", ok:false, fb:"It was Nalu's choice. She wanted money for a second stand without taking a loan."}]},
  "q421c":{type:"tf", prompt:"True or false: if you own stock in a business, you own a small piece of that business.", answer:true, concept:"stock",
    good:"Right. That is exactly what stock is: a piece of owning.",
    bad:"Look again. A stock IS a small piece of owning a business. Kai owns 1 of Nalu's 10 pieces."},
  "q422a":{type:"mc", prompt:"In one month, the stand sold $60 of juice and paid $40 in costs. What was the profit?", concept:"profit", opts:[
    {t:"$20 — what's left after all the costs", ok:true, fb:"Right. $60 in, $40 out for costs, $20 left. That's the profit."},
    {t:"$60 — everything it sold", ok:false, fb:"$60 is what came in, but $40 went right back out for mangoes, cups, and Nalu's pay. Profit is what's LEFT: $20."},
    {t:"$100 — sales plus costs", ok:false, fb:"Costs are taken away, not added. $60 − $40 = $20 profit."}]},
  "q422b":{type:"mc", prompt:"It rains all month. The stand sells less than its costs. What does Kai's piece earn from profit this month?", concept:"profit", opts:[
    {t:"Nothing. No profit means nothing to share", ok:true, fb:"Right. Owners share the profit, and in a rainy month there isn't any. That's part of owning."},
    {t:"$2, the same as every month", ok:false, fb:"Kai only gets a part of the profit when there IS one. This month there was none."},
    {t:"Nalu has to pay him back his $10", ok:false, fb:"Kai is an owner, not a lender. Owners share the good months and the bad ones."}]},
  "q423a":{type:"mc", prompt:"Kai wants to put ALL the money he's ready to invest into Nalu's stand. What's the risk?", concept:"stock", opts:[
    {t:"If that one stand has big trouble, he could lose all of it at once", ok:true, fb:"Right. Everything in one place means one bad event hits all of it. Next module is about what to do instead."},
    {t:"There's no risk, because the stand is popular", ok:false, fb:"Popular stands still have rainy months, broken blenders, or a new stand next door. Everything in one place is a big risk."},
    {t:"The only risk is that Nalu won't let him", ok:false, fb:"The bigger risk: if that one stand struggles, ALL his invested money struggles with it."}]},
  "q423b":{type:"mc", transfer:true, prompt:"A bakery in Lena's town is split into 20 equal pieces. Lena's mom buys 2. The bakery has a great year and some profit is shared with the owners. What is true?", concept:"profit", opts:[
    {t:"She owns 2/20 of the bakery, so she gets a part of the shared profit", ok:true, fb:"Exactly. Different business, same idea: she owns stock, so she shares in the profit when there is some."},
    {t:"She gets all the profit, because she bought 2 pieces", ok:false, fb:"There are 20 pieces and she owns 2. The profit is shared among all the owners."},
    {t:"She gets free bread, which is what stock means", ok:false, fb:"Stock means owning a piece of the business. The return comes from profit, or selling the piece later, not free bread."}]}
};

const CFG = {
  n:42, title:"Owning a Piece", homeSub:"Four short lessons. What stock is, what profit is, and how owners share the good months and the bad ones.",
  pool:["q421a","q421b","q421c","q422a","q422b","q423a"], transfer:"q423b",
  quest:"You bought a piece of Nalu's juice stand, worked out its profit in a good month and a rainy one, and weighed when a piece is worth buying.",
  failKeys:"The keys: stock is a small piece of owning a business; profit is what's left after all costs; owners share profit when there is some and get nothing when there isn't; a piece can later sell for more or less than you paid; and putting everything in one business is a big risk.",
  nextFile:null,
  passStory:'<p><strong>You now own:</strong> stock and profit, and a real piece of a juice stand.</p>'+
    '<p>Kai sips a mango juice at the new beach stand. "What if a storm wrecks both stands?" he asks.</p>'+
    '<p>"Then every owner feels it," Nalu says.</p>'+
    '<p>Rana nods. "That is why smart owners don’t keep everything in one stand. Next time, we spread it out."</p>'+

      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-41-making-money-work.html\'">← Module 41</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
