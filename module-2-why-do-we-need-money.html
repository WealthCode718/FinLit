<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Why Do We Need Money? — Module 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436; --locked:#3d6166;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}

  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{
    position:sticky; top:0; z-index:20; background:var(--lagoon);
    padding:12px 16px 8px; border-bottom:1px solid #d9e6e1;
  }
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{
    font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep);
    border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink);
  }
  .word-chip:focus-visible{outline:3px solid var(--shell)}

  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .scene{
    background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%);
    border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px;
    font-size:44px; line-height:1.2; box-shadow:var(--shadow);
  }
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px; font-family:inherit}

  button{
    font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px;
    background:var(--ink); color:#fff; font-weight:700; width:100%;
  }
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .opt{
    display:block; width:100%; text-align:left; background:#fff; color:var(--ink);
    border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px;
  }
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.sel{border-color:var(--ink)}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}

  .npc{
    background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .npc-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .npc-face{font-size:32px}
  .npc-name{font-weight:700; font-size:15px}
  .npc-has{font-size:13px; color:var(--ink-soft); margin:4px 0}
  .npc-wants{font-size:13px; color:var(--shell); font-weight:600}
  .npc button{font-size:13px; padding:8px 12px; margin-top:8px}

  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{
    background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%;
    text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease;
  }
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}

  #tutorBtn{
    position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px;
    padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px;
  }
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{
    position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff;
    border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none;
    flex-direction:column;
  }
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}

  textarea{width:100%; font:inherit; padding:13px 14px; border:2px solid #d9e2de; border-radius:12px; min-height:110px; margin-bottom:10px}
  .night{
    background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius);
    padding:34px 22px; text-align:center; margin-bottom:16px;
  }
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{
    width:auto; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 12px; border-radius:999px; text-decoration:none;
    color:var(--ink); font-weight:700; font-size:14px; background:#fff;
    border:2px solid #d9e6e1; line-height:1.1; font-family:inherit; cursor:pointer;
  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
  .hrow{flex-wrap:wrap; row-gap:8px}
  .dots{margin-top:8px; flex-wrap:wrap}
  .shelf .word-chip{width:auto; min-height:44px; display:inline-flex; align-items:center}
  button,.opt,.sort-item,.coin-btn{min-height:44px}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.word-chip:focus-visible{
    outline:3px solid var(--shell); outline-offset:2px;
  }
  input,textarea{max-width:100%}
  .tp-in input{min-height:44px}
  .trader,.zone,.acct,.card,.txn,.lrow{min-width:0; max-width:100%}
  .trader button,.tp-quick button,.sortbar button{min-height:44px}
  .zones,.sortbar,.duo,.btn-row,.pick2{flex-wrap:wrap}
  .zone{flex:1 1 140px}
  #tutorBtn{max-width:calc(100vw - 32px)}
  @media (max-width:380px){
    h1{font-size:26px}
    .traders{grid-template-columns:1fr}
    .duo{flex-direction:column}
  }
  .back-btn{background:transparent; color:var(--ink); border:2px solid #cfdcd8; margin-top:12px; min-height:44px}
  .back-btn:hover{border-color:var(--ink)}
  /* optional deeper explanation for kids who want more */
  details.more{background:var(--card); border:1.5px dashed var(--sand-deep, #d9c9a8); border-radius:12px; margin:0 0 14px; padding:0 14px}
  details.more summary{cursor:pointer; font-weight:700; color:var(--shell); min-height:44px; display:flex; align-items:center; list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::after{content:"＋"; margin-left:auto; font-weight:700}
  details.more[open] summary::after{content:"−"}
  details.more p{font-size:15px; margin:0 0 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>

<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>

<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about barter or money…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js?v=20261008"></script>
<script>
const MODULE_N = 2;
/* =====================================================================
   CONTENT — Module 2: Why Do We Need Money?
===================================================================== */
const VOCAB = {
  barter:{term:"barter", def:"Trading one thing for another thing, with no money."},
  trade:{term:"trade", def:"When two people swap: each one gives something and gets something back."},
  matching:{term:"matching problem", def:"When the person who has what you want doesn't want what you have. Then you can't trade."}
};

const QUESTIONS = {
  "q21a":{type:"mc", prompt:"Why couldn't Kai trade his fish for a blanket?", concept:"matching", opts:[
    {t:"Blankets are worth more than fish", ok:false, fb:"Not quite. The real problem is simpler: she didn't want fish."},
    {t:"The blanket maker didn't want fish", ok:true, fb:"Yes! She wanted firewood, not fish. So they couldn't trade."},
    {t:"Kai was too young to trade at the market", ok:false, fb:"Kids can trade too. The problem was that she didn't want fish."}]},
  "q22a":{type:"mc", prompt:"What is the matching problem?", concept:"matching", opts:[
    {t:"Two people both want the same thing", ok:false, fb:"Not quite. It's when the person with what you want doesn't want your stuff."},
    {t:"The person with what you want doesn't want your stuff", ok:true, fb:"Yes! That's why nobody would take Kai's fish."},
    {t:"The market runs out of things, so nobody gets anything to take home", ok:false, fb:"The market had lots of things. Nobody wanted fish, so Kai was stuck."}]},
  "q22b":{type:"tf", prompt:"True or false: barter means trading things without using money.", answer:true, concept:"barter",
    good:"Right! Barter is swapping things, like fish for firewood, with no money.",
    bad:"It's true! Barter is swapping things, like fish for firewood, with no money."},
  "q23a":{type:"mc", prompt:"How did shells fix Kai's problem?", concept:"barter", opts:[
    {t:"Everyone takes shells, so he can trade with anyone", ok:true, fb:"Yes! The blanket maker didn't want fish, but she was happy to take shells."},
    {t:"Shells are prettier than fish, so people like them more", ok:false, fb:"It's not about looks. Shells work because everyone agrees to take them."},
    {t:"Shells made blankets free", ok:false, fb:"Kai still had to give shells for the blanket. Shells just made trading easier."}]},
  "q23b":{type:"tf", transfer:true, prompt:"True or false: if everyone in a village has fish, it's hard to trade fish for other things without money.", answer:true, concept:"matching",
    good:"Right! If everyone has fish, nobody wants more fish. Money lets them trade anyway.",
    bad:"It's true! If everyone has fish, nobody wants more fish. That's the matching problem, and money fixes it."}
};

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false };
let storageOK = true;

async function loadState(){ S = await FL.load(MODULE_N, S); }
async function saveState(){ await FL.save(MODULE_N, S); }
function addXP(n){ if(_replay) return; FL.award(S, n); document.getElementById("xpBox").textContent = FL.displayXP(S)+" XP"; saveState(); }
function more(html){ return '<details class="more"><summary>🤔 Tell me more</summary>'+html+'</details>'; }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return; // guard: skip words from other modules
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ const canBack = _inLesson && S.lesson!==3 && S.step>0;
  M.innerHTML='<div class="screen on">'+html+(canBack?'<button type="button" class="back-btn" onclick="back()">← Back</button>':'')+'</div>'; window.scrollTo(0,0); }
/* Back: replay the previous step. Steps revisited this way give no extra XP. */
const _far = {}; let _replay = false, _inLesson = false;
function back(){ if(S.lesson!==3 && S.step>0){ S.step--; saveState(); render(); } }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  _inLesson = true;
  { const f=_far[S.lesson]||0; _replay = S.step < f; _far[S.lesson]=Math.max(f, S.step); }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}

function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  const html='<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>';
  show(html);
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 1 — Kai wants a blanket  (short screens for young readers)
===================================================================== */
const L1=[
  ()=>show('<div class="kicker">Lesson 1 · Kai wants a blanket</div>'+
    '<div class="scene">🐟 ➡️ 🧣❓<div class="cap">Kai has fish. He wants a warm blanket.</div></div>'+
    '<p>Nights on the island are cold. Kai has lots of fish to trade.</p>'+
    '<button onclick="next()">Go see the blanket maker</button>'),
  ()=>show('<div class="kicker">Lesson 1</div>'+
    '<div class="scene">👩🏽‍🎨🧣<div class="cap">The blanket maker</div></div>'+
    '<div class="card"><p>“Fish? No, thanks,” she says. “I need firewood.”</p></div>'+
    '<p>Kai has fish. She wants firewood. <strong>They can’t trade.</strong></p>'+
    '<button onclick="next()">Uh-oh</button>'),
  ()=>show('<div class="kicker">Lesson 1 · A new word</div>'+
    '<div class="card"><p>Swapping things with <strong>no money</strong> is called <strong>barter</strong>.</p>'+
    '<p>Barter only works when you <strong>both</strong> want what the other one has.</p></div>'+
    more('<p>Kai isn’t alone. Lots of people live on the island, and each one wants something different.</p>'+
      '<p>Kai has fish. The blanket maker wants firewood. The wood collector wants rope. The rope maker wants mangoes. Everyone wants something else!</p>'+
      '<p>With barter, Kai has to find someone who has what he wants <strong>and</strong> wants what he has. That can take all day.</p>')+
    '<button onclick="earnWord(\'barter\');next()">New word: barter</button>'),
  ()=>renderMC("q21a", next),
  ()=>renderTF("q22b", next),
];

/* =====================================================================
   LESSON 2 — The market (tap each trader; nobody wants fish)
===================================================================== */
const NPCS=[
  {face:"🧔🏾",name:"Wood collector",has:"🪵 Firewood",wants:"🪢 Rope"},
  {face:"👵🏻",name:"Rope maker",has:"🪢 Rope",wants:"🥭 Mangoes"},
  {face:"👨🏽‍🌾",name:"Mango grower",has:"🥭 Mangoes",wants:"🧺 A basket"}
];
const L2=[
  ()=>{
    show('<div class="kicker">Lesson 2 · The market</div>'+
      '<p>Kai needs firewood for the blanket maker. Maybe someone at the market will take his fish.</p>'+
      '<p class="muted">Tap each person and ask.</p>'+
      '<div id="npcs"></div><div id="fb"></div><div id="cont"></div>');
    const asked=new Set(); const npDiv=document.getElementById("npcs");
    NPCS.forEach((npc,i)=>{
      const d=document.createElement("div"); d.className="npc";
      d.innerHTML='<div class="npc-head"><div class="npc-face">'+npc.face+'</div><div>'+
        '<div class="npc-name">'+npc.name+'</div><div class="npc-has">Has: '+npc.has+'</div></div></div>';
      const btn=document.createElement("button"); btn.textContent="Want fish? 🐟"; btn.setAttribute("data-bot","1");
      btn.onclick=()=>{
        asked.add(i); btn.disabled=true;
        btn.insertAdjacentHTML("afterend",'<div class="npc-wants">“No, thanks. I want '+npc.wants.replace(/^\S+ /,"").toLowerCase()+'.”</div>');
        if(asked.size===NPCS.length){
          document.getElementById("fb").innerHTML='<div class="feedback bad">Nobody wants fish! Kai is stuck. 😟</div>';
          document.getElementById("cont").innerHTML='<button onclick="next()">Why is this so hard?</button>';
          addXP(3); revealFB();
        }
      };
      d.appendChild(btn); npDiv.appendChild(d);
    });
  },
  ()=>show('<div class="kicker">Lesson 2 · A new word</div>'+
    '<div class="card"><p>Everyone had something. But <strong>nobody wanted fish</strong>.</p>'+
    '<p>When the person who has what you want doesn’t want what you have, it’s called the <strong>matching problem</strong>.</p></div>'+
    more('<p>Think of a chain. Kai wants firewood. The wood collector wants rope. The rope maker wants mangoes. The mango grower wants a basket.</p>'+
      '<p>Nobody in the chain wants fish. So the chain breaks, and Kai is stuck.</p>'+
      '<p>The more people and things there are, the harder it gets to find a match.</p>')+
    '<button onclick="earnWord(\'matching\');next()">New word: matching problem</button>'),
  ()=>renderMC("q22a", next),
];

/* =====================================================================
   LESSON 3 — Shells fix it (two-step trade)
===================================================================== */
const L3=[
  ()=>show('<div class="kicker">Lesson 3 · Shells to the rescue</div>'+
    '<div class="scene">🐚<div class="cap">The island starts using shells as money.</div></div>'+
    '<p>Now <strong>everyone</strong> takes shells, because everyone agrees they are money.</p>'+
    more('<p>Money fixes the matching problem. How? It is something <strong>everyone</strong> will take.</p>'+
      '<p>The blanket maker doesn’t care about fish. But she will take shells, because she knows the wood collector will take shells from her too.</p>'+
      '<p>Kai no longer needs someone who wants fish. He just needs someone who has what he wants.</p>')+
    '<button onclick="next()">Try again with shells</button>'),
  ()=>{
    let stepN=0;
    function draw(){
      show('<div class="kicker">Lesson 3 · Two easy trades</div>'+
        '<div class="npc"><div class="npc-head"><div class="npc-face">👨🏻‍🍳</div><div><div class="npc-name">The cook</div><div class="npc-has">Wants: 🐟 Fish</div></div></div>'+
          (stepN===0?'<button data-bot="1" onclick="window._s()">Give fish, get 5 shells</button>':'<div class="npc-wants">✅ Kai got 5 shells 🐚</div>')+'</div>'+
        '<div class="npc"><div class="npc-head"><div class="npc-face">👩🏽‍🎨</div><div><div class="npc-name">The blanket maker</div><div class="npc-has">Takes: 🐚 Shells</div></div></div>'+
          (stepN===0?'<p class="muted" style="margin:6px 0 0">First, get some shells.</p>':stepN===1?'<button data-bot="1" onclick="window._s()">Give 5 shells, get a blanket</button>':'<div class="npc-wants">✅ Kai got the blanket 🧣</div>')+'</div>'+
        '<div id="cont">'+(stepN===2?'<div class="feedback good">Kai is warm tonight! 🎉</div><button onclick="next()">Continue</button>':'')+'</div>');
      window._s=()=>{ stepN++; if(stepN===2) addXP(3); draw(); };
    }
    draw();
  },
  ()=>show('<div class="kicker">Lesson 3 · A new word</div>'+
    '<div class="card"><p>Kai gave fish and got shells. Then he gave shells and got a blanket.</p>'+
    '<p>Each swap, where both people give something and get something, is a <strong>trade</strong>.</p></div>'+
    more('<p><strong>With barter:</strong> one swap, and both people must want what the other has. Hard!</p>'+
      '<p><strong>With money:</strong> two easy trades. Fish for shells, then shells for a blanket.</p>'+
      '<p>Two trades sound like more work. But they are much faster than walking all over the island looking for a match!</p>')+
    '<button onclick="earnWord(\'trade\');next()">New word: trade</button>'),
  ()=>renderMC("q23a", next),
];

/* =====================================================================
   LESSON 4 — Mastery
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    mastery={qs:["q21a","q22a","q23a","q22b","q23b"].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="card" style="background:#f0ebe1; border-left:4px solid var(--shell)"><p style="font-size:14px; margin:0"><strong>Module 2 quest:</strong> why barter gets stuck, and how shells fix it.</p></div>'+
      '<h1 class="display">Five quick questions</h1>'+
      '<p>Get 3 right and Module 2 is done!</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
];
function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  if(q.type==="tf"){
    renderTFM(qid,()=>{ mastery.idx++; masteryQ(); });
  } else {
    renderMCM(qid,()=>{ mastery.idx++; masteryQ(); });
  }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module 2 complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓</p></div>'+
      '<div class="card"><p><strong>You now know:</strong> barter, trade, matching problem.</p>'+
      '<p>Barter gets stuck when people want different things. Shells work because <strong>everyone</strong> takes them.</p>'+
      '<p class="muted">Next: Module 3 gets into the money itself — Dollars & Cents.</p></div>'+
      '<button style="margin-bottom:10px" onclick="window.location.href=\'module-3-dollars-and-cents.html\'">Continue to Module 3</button>'+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module 2</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. The big idea: barter gets stuck when people want different things. Money fixes it because everyone takes it.</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

// Add mastery completion to L4
L4.push(()=>{
  const pass = mastery.score>=3;
  finishMastery(pass);
});

const LESSONS=[
  {title:"Kai Wants a Blanket", sub:"Why fish can't buy everything", steps:L1, emoji:"🧣"},
  {title:"The Market", sub:"Ask around: does anyone want fish?", steps:L2, emoji:"🏪"},
  {title:"Shells to the Rescue", sub:"Two easy trades", steps:L3, emoji:"🐚"},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module 2</div><h1 class="display">Why Do We Need Money?</h1>'+
    '<p class="muted">Four short lessons. Why barter breaks, and how money fixes it.</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module 2 mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-1-what-is-money.html\'">← Module 1</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }
function goBack(){ window.location.href='module-1-what-is-money.html'; }

/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){ 
  document.getElementById("tutorPanel").classList.toggle("on",on); 
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a","Hi! I'm your tutor. Ask me about barter, money, or the matching problem."); 
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys="You are the tutor inside Module 2 (Why Do We Need Money?) of a financial-literacy app. "+
    "The learner knows: money, worth, agree (from Module 1), barter, trade, matching problem (from this module). "+
    "NEVER use: price, cost, buy, sell, earn, spend, save, bank, interest, credit, invest. "+
    "The story: Kai has fish and wants a blanket. The blanket maker wants firewood, not fish. At the market the wood collector, rope maker and mango grower all say no to fish (the matching problem). Then the island uses shells as money: Kai gives fish to the cook for 5 shells, then gives 5 shells to the blanket maker for a blanket. "+
    "The learners are young (about 7-11): use short sentences and simple words. "+
    "Keep answers under 80 words, warm, honest. If asked 'Quiz me', ask ONE question about barter or money. Never mark wrong ideas as right.";
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)})});
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment.");
  }
}

(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
