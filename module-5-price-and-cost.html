<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price & Cost — Module 5</title>
<style>
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .opt.picked{border-color:var(--shell); background:var(--shell-soft)}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  /* price tag shop */
  .shop{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 8px; text-align:center; cursor:pointer; transition:transform .1s}
  .item:active{transform:scale(.96)}
  .item .face{font-size:36px}
  .item .nm{font-size:13px; font-weight:700; margin:4px 0 2px}
  .item .tag{display:inline-block; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:6px; padding:2px 10px; font-weight:700; font-size:15px}
  .item.right{border-color:var(--good); background:#eef7f2}
  .item.wrong{border-color:var(--bad); background:#faf0ee}
  .item.picked{border-color:var(--shell); background:var(--shell-soft)}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="dots" id="dots"></div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about price and cost…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script>
/* =====================================================================
   CONTENT — Module 5: Price & Cost
   Curriculum guard: buy/sell/pay are Module 8 words; earn is M9; spend M10.
   Language here: "asks for", "give to get", "trades for".
===================================================================== */
const VOCAB = {
  price:{term:"price", def:"The amount a trader asks for. The number on the tag."},
  cost:{term:"cost", def:"What you give up to get something. If the price is $3, getting it costs you $3 — money you no longer have for anything else."}
};

const QUESTIONS = {
  "q51a":{type:"mc", prompt:"What is a price?", concept:"price", opts:[
    {t:"How much something weighs", ok:false, fb:"Weight is about heaviness. A price is about what the trader asks for."},
    {t:"The amount a trader asks for", ok:true, fb:"That's it. The tag tells you the amount before you decide. No guessing, no asking."},
    {t:"How much something is secretly worth", ok:false, fb:"Close — worth and price are related, but the price is the number the trader actually ASKS for. Sometimes it matches worth, sometimes not!"}]},
  "q51b":{type:"mc", prompt:"A kite's tag says $4. What does that mean?", concept:"price", opts:[
    {t:"Give the trader $4 and the kite is yours", ok:true, fb:"Exactly. The price tells you the trade before you make it: $4 in, kite out."},
    {t:"The kite is 4 days old", ok:false, fb:"Tags show prices, not ages. $4 is the amount to give."},
    {t:"Only 4 kites are left", ok:false, fb:"That would be a count, not a price. The $ sign tells you: this is the amount to give."}]},
  "q52a":{type:"mc", prompt:"Two drums. One tag says $3.25, the other says $3.52. Which asks for more?", concept:"price", opts:[
    {t:"The $3.25 drum", ok:false, fb:"Use your Module 4 eye: dollars match (3=3), so compare cents — 25 vs 52. Which is bigger?"},
    {t:"The $3.52 drum", ok:true, fb:"Right. Same dollars, so the cents decide: 52 beats 25. Comparing prices is just comparing amounts."},
    {t:"They ask for the same", ok:false, fb:"Same digits, different order — 25 cents is not 52 cents. Look at the cents side."}]},
  "q52b":{type:"tf", prompt:"True or false: a bigger thing always has a bigger price.", answer:false, concept:"price",
    good:"Right — remember Module 1: a boulder is huge and worth nothing, a tiny pearl can be worth a lot. Price follows worth, and worth follows wanting — not size.",
    bad:"Think about a tiny pearl vs a giant boulder. Which asks for more? Price follows how much people WANT something — not how big it is."},
  "q53a":{type:"mc", prompt:"The kite's price is $5. You hand the trader exactly $5. Is that trade equal?", concept:"cost", opts:[
    {t:"Yes — you gave exactly what was asked", ok:true, fb:"Perfect. Price met exactly = equal trade. Both sides agreed, nobody owes anything."},
    {t:"No — the trader always wins", ok:false, fb:"When you give exactly the price, the trade is equal — you wanted the kite MORE than the $5, the trader wanted the $5 more than the kite. Both walk away happy."},
    {t:"No — you should have given less", ok:false, fb:"You gave exactly what was asked — that's an equal trade. (Asking for a lower price is a real thing, but that's a story for another module!)"}]},
  "q53b":{type:"mc", transfer:true, prompt:"Back before dollars came, a blanket on the island asked for 10 shells. Was that a price?", concept:"price", opts:[
    {t:"No — prices need dollar signs", ok:false, fb:"The $ sign is just mainland clothing. A price is any amount a trader asks for — in dollars, shells, or stones."},
    {t:"Yes — a price is whatever amount is asked for", ok:true, fb:"You've got the deep idea. Prices existed before dollars. 10 shells, 3 stones, $2.50 — all prices. The asking is what makes it a price."},
    {t:"No — shells can't have prices, only things do", ok:false, fb:"Flip it: the BLANKET had the price, and the price was counted in shells. Any money can carry a price."}]},
  "q53c":{type:"mc", prompt:"You have $2 saved in your pocket. The toy boat's price is $2. What does getting the boat COST you?", concept:"cost", opts:[
    {t:"Nothing — the boat is a gift", ok:false, fb:"You gave $2 — that's not nothing! Cost is what leaves your hands: your whole $2."},
    {t:"Your $2 — which can now never become anything else", ok:true, fb:"That's the big idea of cost. The $2 is gone into the boat — it can't also become a snack or a kite later. Every choice closes other doors."},
    {t:"$4, because trades double the amount", ok:false, fb:"No doubling! You give exactly the price: $2. That $2 is the cost."}]}
};

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false };

async function loadState(){
  try{
    const r = await window.storage.get("mod5-state");
    if(r && r.value){ S = Object.assign(S, JSON.parse(r.value)); return; }
  } catch(e){ }
  try{
    const saved = localStorage.getItem("mod5-state");
    if(saved){ S = Object.assign(S, JSON.parse(saved)); }
    for(const key of ["mod4-state","mod3-state","mod2-state","mod1-state"]){
      const prev = localStorage.getItem(key);
      if(prev){
        const p = JSON.parse(prev);
        if(p.xp > S.xp) S.xp = p.xp;
      }
    }
  } catch(e){ }
}
async function saveState(){
  try{ await window.storage.set("mod5-state", JSON.stringify(S)); }catch(e){
    try{ localStorage.setItem("mod5-state", JSON.stringify(S)); }catch(e2){}
  }
}
function addXP(n){ S.xp+=n; document.getElementById("xpBox").textContent = S.xp+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 1 — The Tags Appear
===================================================================== */
const L1=[
  ()=>show('<div class="kicker">Lesson 1 · The tags appear</div>'+
    '<div class="recap"><strong>Kai\'s story so far:</strong> The island trades in dollars and cents now, and Kai can compare any two amounts.</div>'+
    '<div class="scene">🏪🏷️<div class="cap">One morning, every item at the trading post has a little tag on it.</div></div>'+
    '<button onclick="next()">What are the tags?</button>'),
  ()=>show('<div class="kicker">Lesson 1</div>'+
    '<div class="card"><p>Before the tags, getting anything meant asking: <em>"What do you want for this drum?"</em> Every single time. And the answer could change by the hour.</p>'+
    '<p>Now each tag shows a number: the amount the trader asks for.</p>'+
    '<p>That number has a name: the <strong>price</strong>.</p>'+
    '<p>Drum: $3.50. Kite: $4. Mango: 75¢. The whole trading post, readable at a glance.</p></div>'+
    '<button onclick="earnWord(\'price\');next()">New word: price</button>'),
  ()=>show('<div class="kicker">Lesson 1 · Who picks the number?</div>'+
    '<div class="card"><p>Kai asks the drum maker: <em>"Who decided $3.50?"</em></p>'+
    '<p>"I did," she says. "But not out of thin air. If I ask too much, nobody trades with me. If I ask too little, my drums vanish by noon and I could have gotten more."</p>'+
    '<p>So a price follows <strong>worth</strong> — how much people want the thing and how hard it is to get. Sound familiar? It\'s Rana\'s firewood after the storm, wearing a tag.</p></div>'+
    '<button onclick="next()">Got it</button>'),
  ()=>renderMC("q51a", next),
  ()=>renderMC("q51b", next),
];

/* =====================================================================
   LESSON 2 — Tag Reader (shop game)
===================================================================== */
const SHOP=[
  {face:"🥭", nm:"Mango", tag:"$0.75", v:75},
  {face:"🪁", nm:"Kite", tag:"$1.25", v:125},
  {face:"🥥", nm:"Coconut", tag:"$0.95", v:95},
  {face:"🪘", nm:"Drum", tag:"$2.05", v:205}
];
const L2=[
  ()=>show('<div class="kicker">Lesson 2 · Tag reader</div>'+
    '<div class="recap"><strong>So far:</strong> The price is the amount a trader asks for — and it follows worth.</div>'+
    '<div class="card"><p>Time to read some tags. Three quick rounds at the trading post.</p></div>'+
    '<button onclick="next()">Open the shop</button>'),
  ()=>{ /* round 1: highest price */
    let done=false;
    let html='<div class="kicker">Tag reader · Round 1 of 3</div><h2 class="display">Which item asks for the MOST?</h2><div class="shop" id="shop"></div><div id="fb"></div><div id="cont"></div>';
    show(html);
    const shopEl=document.getElementById("shop");
    SHOP.forEach((it,i)=>{
      const d=document.createElement("div"); d.className="item";
      d.innerHTML='<div class="face">'+it.face+'</div><div class="nm">'+it.nm+'</div><span class="tag">'+it.tag+'</span>';
      d.onclick=()=>{
        if(done) return;
        const ok = it.v===Math.max(...SHOP.map(x=>x.v));
        d.classList.add(ok?"right":"wrong");
        document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+
          (ok?'Right — the drum asks for $2.05, more than anything else here.':'Compare in cents: mango 75, coconut 95, kite 125, drum 205. Which number is biggest?')+'</div>';
        if(ok){ done=true; addXP(2); document.getElementById("cont").innerHTML='<button onclick="next()">Round 2</button>'; }
      };
      shopEl.appendChild(d);
    });
  },
  ()=>{ /* round 2: lowest price */
    let done=false;
    show('<div class="kicker">Tag reader · Round 2 of 3</div><h2 class="display">Which item asks for the LEAST?</h2><div class="shop" id="shop"></div><div id="fb"></div><div id="cont"></div>');
    const shopEl=document.getElementById("shop");
    SHOP.forEach((it,i)=>{
      const d=document.createElement("div"); d.className="item";
      d.innerHTML='<div class="face">'+it.face+'</div><div class="nm">'+it.nm+'</div><span class="tag">'+it.tag+'</span>';
      d.onclick=()=>{
        if(done) return;
        const ok = it.v===Math.min(...SHOP.map(x=>x.v));
        d.classList.add(ok?"right":"wrong");
        document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+
          (ok?'Right — 75¢ for the mango is the smallest ask at the post.':'Compare in cents: 75, 95, 125, 205. Which is smallest?')+'</div>';
        if(ok){ done=true; addXP(2); document.getElementById("cont").innerHTML='<button onclick="next()">Round 3</button>'; }
      };
      shopEl.appendChild(d);
    });
  },
  ()=>{ /* round 3: what can you get with $1? multi-select */
    const CAN=SHOP.filter(x=>x.v<=100).map(x=>x.nm);
    let picked=new Set(), done=false;
    show('<div class="kicker">Tag reader · Round 3 of 3</div><h2 class="display">You\'re holding exactly $1. Tap EVERY item whose price you could meet.</h2>'+
      '<p class="muted">$1 = 100 cents. Pick all that fit, then check.</p>'+
      '<div class="shop" id="shop"></div><button id="check" style="margin-bottom:10px">Check my picks</button><div id="fb"></div><div id="cont"></div>');
    const shopEl=document.getElementById("shop");
    SHOP.forEach((it)=>{
      const d=document.createElement("div"); d.className="item"; d.dataset.nm=it.nm;
      d.innerHTML='<div class="face">'+it.face+'</div><div class="nm">'+it.nm+'</div><span class="tag">'+it.tag+'</span>';
      d.onclick=()=>{
        if(done) return;
        if(picked.has(it.nm)){ picked.delete(it.nm); d.classList.remove("picked"); }
        else { picked.add(it.nm); d.classList.add("picked"); }
      };
      shopEl.appendChild(d);
    });
    document.getElementById("check").onclick=()=>{
      if(done) return;
      const want=new Set(CAN);
      const ok = picked.size===want.size && [...picked].every(x=>want.has(x));
      document.querySelectorAll(".item").forEach(d=>{
        const nm=d.dataset.nm, should=want.has(nm), did=picked.has(nm);
        if(should) d.classList.add("right");
        if(did && !should) d.classList.add("wrong");
      });
      document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+
        (ok?'Perfect. Mango (75¢) and coconut (95¢) both fit inside your 100 cents. The kite (125¢) and drum (205¢) ask for more than you\'re holding.'
           :'The rule: your $1 is 100 cents. Mango 75 ✓, coconut 95 ✓ — both fit. Kite 125 ✗ and drum 205 ✗ ask for more than 100.')+'</div>';
      done=true; if(ok) addXP(4); else addXP(1);
      document.getElementById("cont").innerHTML='<button onclick="next()">Continue</button>';
      revealFB();
    };
  },
  ()=>renderMC("q52a", next),
];

/* =====================================================================
   LESSON 3 — What It Costs You
===================================================================== */
const L3=[
  ()=>show('<div class="kicker">Lesson 3 · What it costs you</div>'+
    '<div class="recap"><strong>So far:</strong> Kai can read any tag at the post.</div>'+
    '<div class="scene">🤔💵<div class="cap">Kai holds $2 — and stands very still, thinking.</div></div>'+
    '<button onclick="next()">What\'s the problem?</button>'),
  ()=>show('<div class="kicker">Lesson 3</div>'+
    '<div class="card"><p>The toy boat\'s price is $2. Kai has exactly $2.</p>'+
    '<p>Easy trade… but Kai hesitates. Because that same $2 could ALSO become a mango and a coconut. Or stay in the pocket for tomorrow.</p>'+
    '<p>Whatever Kai picks, the $2 turns into that ONE thing — and stops being able to become anything else.</p>'+
    '<p>That\'s what something really <strong>costs</strong> you: what you give up to get it.</p></div>'+
    '<button onclick="earnWord(\'cost\');next()">New word: cost</button>'),
  ()=>show('<div class="kicker">Lesson 3 · Price vs cost</div>'+
    '<div class="card"><p>They sound like twins, but hold them apart:</p>'+
    '<p><strong>Price</strong> = the number on the tag. The trader\'s ask.</p>'+
    '<p><strong>Cost</strong> = what leaves YOUR hands — and everything else that money could have become.</p>'+
    '<p>The price of the boat is $2. The cost of the boat is your $2… including the mango-and-coconut it will now never be.</p></div>'+
    '<button onclick="next()">Got it</button>'),
  ()=>renderMC("q53c", next),
  ()=>renderTF("q52b", next),
];

/* =====================================================================
   LESSON 4 — Mastery
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=["q51a","q51b","q52a","q52b","q53a","q53c"].sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,"q53b"].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module 5 quest:</strong> You learned what prices are, who sets them, and what things really cost.</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module 5 is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  q.opts.forEach((o,i)=>html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>');
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module 5 complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓</p></div>'+
      '<div class="card"><p><strong>You now own:</strong> price and cost — plus your comparing eye and all your island words.</p>'+
      '<p>Next: Kai\'s pocket has $1.25, and a mango is 75¢, and a coconut is 95¢… <em>how do you put amounts together?</em></p>'+
      '<p class="muted">That\'s Module 6: Adding Money.</p></div>'+
      '<button style="margin-bottom:10px" onclick="window.location.href=\'module-6-adding-money.html\'">Continue to Module 6</button>'+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module 5</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. The two keys: a price is the amount a trader ASKS for, and cost is what YOU give up.</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:"The Tags Appear", sub:"What a price is, and who picks it", steps:L1, emoji:"🏷️"},
  {title:"Tag Reader", sub:"Three rounds at the trading post", steps:L2, emoji:"🏪"},
  {title:"What It Costs You", sub:"Price vs cost — they're not twins", steps:L3, emoji:"🤔"},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module 5</div><h1 class="display">Price & Cost</h1>'+
    '<p class="muted">Four short lessons. The tags come to the trading post.</p>';
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module 5 mastered · '+S.xp+' XP</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ S.lesson=i; S.step=0; saveState(); render(); }

/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a","Hi! Ask me anything about prices, tags, or what things cost — or tap a button below.");
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys="You are the tutor inside Module 5 (Price & Cost) of a financial-literacy app. The learner may be a child or an adult. "+
    "They know from earlier modules: money, worth, agree, barter, trade, matching problem, dollar, cent, the four US coins, 100 cents = 1 dollar, reading $X.YY, compare, equal, count-the-cents. From this module: price (the amount a trader asks for; the number on the tag; follows worth) and cost (what you give up to get something — including what that money could have become instead). "+
    "STRICT RULES: never use these words (later modules): buy, sell, pay, purchase, earn, spend, save, bank, interest, credit, invest, add, subtract, plus, minus, budget, afford, opportunity cost. Say 'give to get', 'trades for', 'asks for', 'count up'. "+
    "Story context: price tags appeared at the island trading post; the drum maker explained she picks prices but worth pushes them; Kai chose between a toy boat and mango+coconut with the same $2. "+
    "Never repeat a failed explanation — switch analogies (lemonade stand tags, sticker trades, game-token shops). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple price/cost question and wait.";
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=S.xp+" XP";
  renderShelf();
  goHome();
})();
