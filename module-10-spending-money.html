<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Spending Money — Module 10</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436; --locked:#3d6166;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .trade-card{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px}
  .trade-card .big{font-size:38px; margin-bottom:6px}
  .trade-card .txt{font-size:16px; font-weight:600}
  .pick2{display:flex; gap:8px; margin-bottom:12px}
  .pick2 button{font-size:15px; padding:12px 6px}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{
    width:auto; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 12px; border-radius:999px; text-decoration:none;
    color:var(--ink); font-weight:700; font-size:14px; background:#fff;
    border:2px solid #d9e6e1; line-height:1.1; font-family:inherit; cursor:pointer;
  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
  .hrow{flex-wrap:wrap; row-gap:8px}
  .dots{margin-top:8px; flex-wrap:wrap}
  .shelf .word-chip{width:auto; min-height:44px; display:inline-flex; align-items:center}
  button,.opt,.sort-item,.coin-btn{min-height:44px}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.word-chip:focus-visible{
    outline:3px solid var(--shell); outline-offset:2px;
  }
  input,textarea{max-width:100%}
  .tp-in input{min-height:44px}
  .trader,.zone,.acct,.card,.txn,.lrow{min-width:0; max-width:100%}
  .trader button,.tp-quick button,.sortbar button{min-height:44px}
  .zones,.sortbar,.duo,.btn-row,.pick2{flex-wrap:wrap}
  .zone{flex:1 1 140px}
  #tutorBtn{max-width:calc(100vw - 32px)}
  @media (max-width:380px){
    h1{font-size:26px}
    .traders{grid-template-columns:1fr}
    .duo{flex-direction:column}
  }
  .back-btn{background:transparent; color:var(--ink); border:2px solid #cfdcd8; margin-top:12px; min-height:44px}
  .back-btn:hover{border-color:var(--ink)}
  /* optional deeper explanation for kids who want more */
  details.more{background:var(--card); border:1.5px dashed var(--sand-deep, #d9c9a8); border-radius:12px; margin:0 0 14px; padding:0 14px}
  details.more summary{cursor:pointer; font-weight:700; color:var(--shell); min-height:44px; display:flex; align-items:center; list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::after{content:"＋"; margin-left:auto; font-weight:700}
  details.more[open] summary::after{content:"−"}
  details.more p{font-size:15px; margin:0 0 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about spending choices…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js?v=20261008"></script>
<script>
const MODULE_N = 10;
/* =====================================================================
   CONTENT — Module 10: Spending Money
   'Spend' becomes permitted. Needs vs wants is the core skill.
   Still banned: save/savings (M11 — teased only!), bank (M17+),
   borrow/lend (M25), budget (M52).
===================================================================== */
const VOCAB = {
  spend:{term:"spend", def:"To use your money to buy things. You choose to do it."},
  need:{term:"need", def:"Something you must have to be okay, like food, water, or a warm place. Needs come first."}
};

const QUESTIONS = {
  "q101a":{type:"mc", prompt:"What does it mean to SPEND money?", concept:"spend", opts:[
    {t:"Use money to buy things", ok:true, fb:"Yes! You give money and get something back. You choose to do it."},
    {t:"Lose money by accident", ok:false, fb:"Dropping a dime is not spending. Spending is on purpose."},
    {t:"Give money away for nothing back", ok:false, fb:"That is a gift. When you spend, you get the thing you bought."}]},
  "q101b":{type:"mc", prompt:"Which of these is a NEED?", concept:"need", opts:[
    {t:"Food for dinner", ok:true, fb:"Yes! You must eat to be okay."},
    {t:"A second new kite", ok:false, fb:"A second kite is fun, but you’d be okay without it. That’s a want."},
    {t:"A bag of mango candy", ok:false, fb:"Yummy, but you can skip it. Candy is a want."}]},
  "q102a":{type:"mc", prompt:"Which of these is a WANT?", concept:"need", opts:[
    {t:"A warm blanket when yours is torn", ok:false, fb:"Cold nights are no fun. A warm blanket in winter is a need."},
    {t:"A song book, just for fun", ok:true, fb:"Yes! It’s fun, but Kai would be okay without it."},
    {t:"Water when the well is low", ok:false, fb:"You must have water. That’s a need."}]},
  "q102b":{type:"tf", prompt:"True or false: the same thing can be a need one time and a want another time.", answer:true, concept:"need",
    good:"Right! One blanket in winter is a need. A third pretty blanket is a want.",
    bad:"It’s true! One blanket in winter is a need. A third pretty blanket is a want."},
  "q103a":{type:"mc", prompt:"Kai has $6. Dinner is $3 (a need). The book is $4 (a want). What should he do?", concept:"spend", opts:[
    {t:"Buy the book first, then dinner", ok:false, fb:"After the $4 book, only $2 is left. That’s not enough for dinner!"},
    {t:"Buy dinner first", ok:true, fb:"Yes! Needs first. $6 − $3 = $3 left for wants."},
    {t:"Buy nothing and skip dinner", ok:false, fb:"Dinner is a need. Buy the need first, then choose."}]},
  "q103c":{type:"mc", prompt:"Kai has $6. He spends $3 on dinner. How much is left?", concept:"spend", opts:[
    {t:"$3", ok:true, fb:"Yes! $6 − $3 = $3."},
    {t:"$2", ok:false, fb:"Count up from 3 to 6. That’s 3. So $3 is left."},
    {t:"$9", ok:false, fb:"Spending takes money out. $6 − $3 = $3."}]},
  "q103b":{type:"mc", transfer:true, prompt:"Long ago, Kai had 10 shells. A cold night was coming. A warm blanket cost 10 shells. A pretty necklace cost 10 shells. Is this a need-or-want choice?", concept:"need", opts:[
    {t:"Yes. The blanket is the need.", ok:true, fb:"Yes! Needs and wants are older than dollars. Stay warm first."},
    {t:"No. That only works with dollars.", ok:false, fb:"Shells were money too. People always had to choose needs first."},
    {t:"No. Pretty things are needs.", ok:false, fb:"Pretty is a want. On a cold night, warm is the need."}]}
};

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false };

async function loadState(){ S = await FL.load(MODULE_N, S); }
async function saveState(){ await FL.save(MODULE_N, S); }
function addXP(n){ if(_replay) return; FL.award(S, n); document.getElementById("xpBox").textContent = FL.displayXP(S)+" XP"; saveState(); }
function more(html){ return '<details class="more"><summary>🤔 Tell me more</summary>'+html+'</details>'; }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ const canBack = _inLesson && S.lesson!==3 && S.step>0;
  M.innerHTML='<div class="screen on">'+html+(canBack?'<button type="button" class="back-btn" onclick="back()">← Back</button>':'')+'</div>'; window.scrollTo(0,0); }
/* Back: replay the previous step. Steps revisited this way give no extra XP. */
const _far = {}; let _replay = false, _inLesson = false;
function back(){ if(S.lesson!==3 && S.step>0){ S.step--; saveState(); render(); } }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  _inLesson = true;
  { const f=_far[S.lesson]||0; _replay = S.step < f; _far[S.lesson]=Math.max(f, S.step); }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 1 — The Full Pocket Problem
===================================================================== */
const L1=[
  ()=>show('<div class="kicker">Lesson 1 · A full pocket</div>'+
    '<div class="recap"><strong>So far:</strong> Kai helps the fruit trader. This week he earned $6.</div>'+
    '<div class="scene">💵🤩🏪<div class="cap">$6, and a trading post full of fun things!</div></div>'+
    '<button onclick="next()">What will Kai buy?</button>'),
  ()=>show('<div class="kicker">Lesson 1 · A new word</div>'+
    '<div class="card"><p>Using money to buy things is called <strong>spending</strong>.</p>'+
    '<p>Spending is not bad. It’s what money is for!</p>'+
    '<p>But $6 can’t buy everything. Kai has to <strong>choose</strong>.</p></div>'+
    more('<p>Every mango Kai has ever eaten came from spending. That is what money is for!</p>'+
      '<p>But remember Module 5? When Kai spends a dollar on one thing, that dollar can’t buy anything else. It is gone.</p>'+
      '<p>So spending is really <strong>choosing</strong>. Each time you spend, you pick one thing and say no to the others.</p>')+
    '<button onclick="earnWord(\'spend\');next()">New word: spend</button>'),
  ()=>renderMC("q101a", next),
];

/* =====================================================================
   LESSON 2 — Need or Want? (game)
===================================================================== */
const NW_ROUNDS=[
  {big:"🍲", txt:"Food for dinner", ans:"need",
   fb:{need:"Yes! You must eat to be okay.",
       want:"You must eat to be okay. Food is a need."}},
  {big:"🪁🪁", txt:"A second kite (the first one still flies)", ans:"want",
   fb:{need:"The first kite still flies! A second one is a want.",
       want:"Yes! Fun to have, fine to skip."}},
  {big:"🧶❄️", txt:"A warm blanket. Winter is coming, and yours is torn.", ans:"need",
   fb:{need:"Yes! You need to stay warm in winter.",
       want:"Winter is coming and his blanket is torn. This is a need."}},
  {big:"🍬", txt:"Mango candy", ans:"want",
   fb:{need:"Yummy, but you’d be okay without it. Want.",
       want:"Yes! Yummy, but you can skip it."}},
  {big:"🧶🌸", txt:"A third blanket, because it’s pretty", ans:"want",
   fb:{need:"Kai already has two warm blankets! The third one is a want.",
       want:"Good eye! Two blankets keep him warm. The third is just pretty."}}
];
const L2=[
  ()=>show('<div class="kicker">Lesson 2 · A new word</div>'+
    '<div class="card"><p>A <strong>need</strong> is something you must have to be okay. Food, water, a warm place.</p>'+
    '<p>A <strong>want</strong> is a fun extra. Nice to have. Fine to skip.</p></div>'+
    more('<p>Needs are the things that keep you safe and healthy: food, water, a warm place to sleep, and clothes that fit the weather.</p>'+
      '<p>Wants are everything else: the fun, the pretty, the yummy. Wants are not bad! They just come <strong>after</strong> needs.</p>')+
    '<p class="muted">Sort 5 things. One is a trick!</p>'+
    '<button onclick="earnWord(\'need\');next()">New word: need</button>'),
  ()=>{
    let round=0;
    function draw(){
      const r=NW_ROUNDS[round];
      show('<div class="kicker">Need or want? · '+(round+1)+' of '+NW_ROUNDS.length+'</div>'+
        '<div class="trade-card"><div class="big">'+r.big+'</div><div class="txt">'+r.txt+'</div></div>'+
        '<div class="pick2">'+
          '<button onclick="window._p(\'need\')">NEED</button>'+
          '<button onclick="window._p(\'want\')">WANT</button>'+
        '</div><div id="fb"></div><div id="cont"></div>');
      window._p=(pick)=>{
        const ok = pick===r.ans;
        if(ok) addXP(2);
        document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+r.fb[pick]+'</div>';
        revealFB();
        if(ok){
          document.getElementById("cont").innerHTML=(round===NW_ROUNDS.length-1 ? more('<p>Did you see the trick? A blanket can be a <strong>need</strong> or a <strong>want</strong>!</p>'+
            '<p>When winter is coming and yours is torn, a warm blanket is a need. When you already have two warm ones, a third is just a want.</p>'+
            '<p>So always ask: “Do I already have what I need?”</p>') : '')+'<button onclick="window._n()">'+(round<NW_ROUNDS.length-1?"Next":"Done")+'</button>';
          revealFB();
          window._n=()=>{ round++; if(round<NW_ROUNDS.length) draw(); else { addXP(3); next(); } };
        }
      };
    }
    draw();
  },
  ()=>renderTF("q102b", next),
  ()=>renderMC("q102a", next),
];

/* =====================================================================
   LESSON 3 — Needs First
===================================================================== */
const L3=[
  ()=>show('<div class="kicker">Lesson 3 · Needs first</div>'+
    '<div class="scene">🍲 $3 &nbsp; 📖 $4<div class="cap">Dinner is $3. The song book is $4. Kai has $6.</div></div>'+
    '<p>$3 + $4 = $7. That’s more than $6. He can’t buy both.</p>'+
    '<button onclick="next()">What comes first?</button>'),
  ()=>show('<div class="kicker">Lesson 3 · The island rule</div>'+
    '<div class="card"><p><strong>Needs first. Wants get what’s left.</strong></p>'+
    '<p>Dinner first: $6 − $3 = <strong>$3 left</strong>.</p>'+
    '<p>But the book is $4. Kai is <strong>$1 short</strong>. Oh no!</p></div>'+
    more('<p>Why needs first? Think about the other way around.</p>'+
      '<p>If Kai buys the $4 book first, he has $6 − $4 = $2 left. Dinner costs $3. Now he has a book, but <strong>no dinner</strong>!</p>'+
      '<p>Missing a want is a little sad. Missing a need is a real problem. That is why needs go first.</p>')+
    '<button onclick="next()">Not again!</button>'),
  ()=>renderMC("q103a", next),
  ()=>renderMC("q103c", next),
];

/* =====================================================================
   LESSON 4 — Mastery
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=["q101a","q101b","q102a","q102b","q103a","q103c"].sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,"q103b"].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module 10 quest:</strong> You learned to spend on purpose — needs first, wants with what\'s left.</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module 10 is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module 10 complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓</p></div>'+
      '<div class="card"><p><strong>You now own:</strong> spend and need — the choosing tools.</p>'+
      '<p>Kai has $3. The book is $4. He is $1 short today. But next week, he will earn more…</p>'+
      '<p><em>What if his $3 could wait for next week?</em></p>'+
      '<p class="muted">That\'s Module 11: Saving Money.</p></div>'+
      '<button style="margin-bottom:10px" onclick="window.location.href=\'module-11-saving-money.html\'">Continue to Module 11</button>'+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module 10</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. Remember: needs first, wants get what\'s left.</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:"The Full Pocket Problem", sub:"$6 and a post full of wonderful things", steps:L1, emoji:"💵"},
  {title:"Need or Want?", sub:"Five things — sort them, dodge the trick", steps:L2, emoji:"🍲"},
  {title:"Needs First", sub:"The island's choosing rule", steps:L3, emoji:"🥇"},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module 10</div><h1 class="display">Spending Money</h1>'+
    '<p class="muted">Four short lessons. Choosing well at a full trading post.</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module 10 mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-9-earning-money.html\'">← Module 9</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }

/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a","Hi! Ask me anything about spending, needs, and wants — or tap a button below.");
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys="You are the tutor inside Module 10 (Spending Money) of a financial-literacy app. The learner may be a child or an adult. "+
    "They know from earlier modules: money, worth, agree, barter, trade, dollar, cent, coins, reading $X.YY, compare, equal, price, cost, add, total, subtract, change, buy, sell, pay, earn, work. From this module: spend (use money to buy things — on purpose), need (must-have to be okay: food, water, warm place, weather-right clothes), want (fun extras, fine to skip), the situation decides (same item can be need or want), and the rule: needs first, wants with what's left. "+
    "STRICT RULES: never use these words (later modules): save, saving, savings, set aside, put away for later, bank, deposit, borrow, lend, credit, invest, budget, multiply, divide, tax, income, wage. IMPORTANT: if the learner asks about keeping money for later or not spending it, warmly say that is EXACTLY the next module's big idea and they're thinking ahead — do not explain or name it. "+
    "Story context: Kai earned $6 this week; dinner ($3, need) came before the song book ($4, want); after dinner Kai has $3 and is $1 short of the book — a cliffhanger. "+
    "Never repeat a failed explanation — switch analogies (school lunch vs toy aisle, rainy-day boots vs sticker packs). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple need-or-want question and wait.";
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
