<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Your Credit Score — Module 28</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436; --locked:#3d6166;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}
  .cut-viz .n{font-size:14px; color:var(--ink-soft); font-weight:600; margin-top:4px}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .acct{background:linear-gradient(135deg,#123a3f 0%,#1b3247 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,58,63,.25)}
  .acct .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .acct .bal{font-size:42px; font-weight:700; font-family:"Fraunces",Georgia,serif; margin:2px 0}
  .acct .who{font-size:14px; opacity:.8}
  .txn{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:15px; animation:fade .3s ease}
  .txn .amt{font-weight:700; color:var(--good); white-space:nowrap}
  .txn .amt.out{color:var(--bad)}
  .txn-empty{color:var(--ink-soft); font-size:15px; font-style:italic; padding:10px 0}
  .tin{background:var(--sand); border:2px dashed var(--sand-deep); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .tin .n{font-size:14px; color:var(--ink-soft); margin-top:4px}
  .ledger{background:#fff; border:2px solid #d9e2de; border-radius:14px; overflow:hidden; margin-bottom:12px}
  .lrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid #eef2f0; font-size:15px}
  .lrow:last-child{border-bottom:none}
  .lrow.head{background:var(--sand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .lrow .run{font-weight:700; font-family:"Fraunces",Georgia,serif; white-space:nowrap}
  .lrow .mv{font-weight:700; white-space:nowrap; color:var(--good)}
  .lrow .mv.out{color:var(--bad)}
  .lrow.pending{background:#fffdf5}
  .duo{display:flex; gap:10px; margin-bottom:14px}
  .duo .acct{flex:1; margin-bottom:0; padding:16px 13px}
  .duo .acct .bal{font-size:29px}
  .duo .acct .lbl{font-size:10px}
  .duo .acct .who{font-size:12px; opacity:.75}
  .acct.save{background:linear-gradient(135deg,#2e7d5b 0%,#1b5540 100%)}
  .sortbar{display:flex; gap:10px; margin-bottom:12px}
  .sortbar button{flex:1; font-size:15px; padding:14px 8px}
  .sortbar .chk{background:var(--ink)}
  .sortbar .sav{background:var(--good)}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px; font-size:18px; font-weight:600}
  .item .sub{font-size:14px; font-weight:400; color:var(--ink-soft); margin-top:4px}
  .phone{background:#0e1b2c; border-radius:22px; padding:12px 10px 14px; margin-bottom:14px; box-shadow:0 6px 22px rgba(14,27,44,.3)}
  .phone .pbar{display:flex; justify-content:space-between; color:#8fa8bd; font-size:11px; padding:2px 8px 8px; letter-spacing:.04em}
  .feed{background:#fff; border-radius:14px; overflow:hidden}
  .fitem{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid #eef2f0; font-size:14px}
  .fitem:last-child{border-bottom:none}
  .fitem .day{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
  .fitem .amt{font-weight:700; white-space:nowrap; color:var(--good)}
  .fitem .amt.out{color:var(--bad)}
  .fitem .run{font-size:11px; color:var(--ink-soft)}
  .notif{background:var(--sand); border:2px solid var(--sand-deep); border-radius:12px; padding:11px 14px; margin-bottom:10px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
  .notif .bell{font-size:17px; line-height:1.2}
  .grow{background:#fff; border:2px solid var(--good); border-radius:14px; padding:20px; text-align:center; margin-bottom:12px}
  .grow .arrow{font-size:22px; color:var(--good); margin:2px 0}
  .grow .lbl2{font-size:13px; color:var(--ink-soft)}
  .compare{display:flex; gap:10px; margin-bottom:12px}
  .compare .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 10px; text-align:center}
  .compare .box.win{border-color:var(--good); background:#eef7f2}
  .compare .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .compare .box .v{font-size:22px; font-weight:700; font-family:"Fraunces",Georgia,serif}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gauge{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; margin-bottom:12px}
  .gauge .who{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:8px}
  .gtrack{position:relative; height:18px; border-radius:999px; background:linear-gradient(90deg,#a94436 0%,#e8b84b 50%,#2e7d5b 100%)}
  .gpin{position:absolute; top:-7px; width:6px; height:32px; background:var(--ink); border-radius:3px; transform:translateX(-50%); transition:left .5s ease; box-shadow:0 0 0 3px #fff}
  .gends{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:8px; font-weight:600}
  .sortbar .up{background:var(--good)}
  .sortbar .down{background:var(--bad)}
  .cal{display:inline-block; background:#fff; border:2px solid var(--bad); border-radius:10px; overflow:hidden; text-align:center; min-width:72px; vertical-align:middle}
  .cal .m, .cal .d{display:block}
  .cal .m{background:var(--bad); color:#fff; font-size:11px; font-weight:700; letter-spacing:.1em; padding:2px 0}
  .cal .d{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:28px; padding:2px 0}
  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{
    width:auto; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 12px; border-radius:999px; text-decoration:none;
    color:var(--ink); font-weight:700; font-size:14px; background:#fff;
    border:2px solid #d9e6e1; line-height:1.1; font-family:inherit; cursor:pointer;
  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
  .hrow{flex-wrap:wrap; row-gap:8px}
  .dots{margin-top:8px; flex-wrap:wrap}
  .shelf .word-chip{width:auto; min-height:44px; display:inline-flex; align-items:center}
  button,.opt,.sort-item,.coin-btn{min-height:44px}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.word-chip:focus-visible{
    outline:3px solid var(--shell); outline-offset:2px;
  }
  input,textarea{max-width:100%}
  .tp-in input{min-height:44px}
  .trader,.zone,.acct,.card,.txn,.lrow{min-width:0; max-width:100%}
  .trader button,.tp-quick button,.sortbar button{min-height:44px}
  .zones,.sortbar,.duo,.btn-row,.pick2{flex-wrap:wrap}
  .zone{flex:1 1 140px}
  #tutorBtn{max-width:calc(100vw - 32px)}
  @media (max-width:380px){
    h1{font-size:26px}
    .traders{grid-template-columns:1fr}
    .duo{flex-direction:column}
  }
  .back-btn{background:transparent; color:var(--ink); border:2px solid #cfdcd8; margin-top:12px; min-height:44px}
  .back-btn:hover{border-color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about credit scores and due dates…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 28;
/* =====================================================================
   CONTENT — Module 28: Your Credit Score
   Vocab: credit score, due date.
   "due date" follows show-then-name: M27's bill said "pay by the 15th";
   here it is named.
   Deliberately NO score numbers (no 300–850 range): the score is a
   gauge from "less trusted" to "more trusted". What moves it is the
   concept being taught — mostly, paying back on time. A common
   misconception is addressed directly: a credit score is about your
   record of paying back, not about how much money you have.
===================================================================== */
const VOCAB = {
  creditscore:{term:"credit score", def:"A number that shows banks how well you have paid back money before. Paying on time makes it go up. Missing payments makes it go down."},
  duedate:{term:"due date", def:"The date on a bill by which you must pay. Paying by the due date avoids late fees — and is the biggest thing that builds a good credit score."}
};

const QUESTIONS = {
  "q281a":{type:"mc", prompt:"What is a credit score?", concept:"creditscore", opts:[
    {t:"A number showing how well you have paid back before", ok:true, fb:"Right. It is a bank’s quick way of asking: when this person borrowed before, did they pay it back?"},
    {t:"A number that shows how much money you have saved in the bank", ok:false, fb:"Savings does not set the score. It is about your record of borrowing and paying back."},
    {t:"The number of cards you own", ok:false, fb:"Owning cards is not the score. The score shows how well you have paid back what you borrowed."}]},
  "q281b":{type:"mc", prompt:"Why did the bank say yes to Tavo and no to Nilo?", concept:"creditscore", opts:[
    {t:"Tavo has paid back on time; Nilo has missed payments", ok:true, fb:"Right. The bank looked at their past. Tavo’s record says he pays back. Nilo’s record says he sometimes does not."},
    {t:"Tavo has more money in savings, so the bank knows he can pay", ok:false, fb:"It was not about who has more money. It was about who has paid back on time before."},
    {t:"The bank just likes Tavo more", ok:false, fb:"It is not about liking. The bank looked at each person’s record of paying back."}]},
  "q281c":{type:"tf", prompt:"True or false: having lots of money in savings automatically gives you a high credit score.", answer:false, concept:"creditscore",
    good:"Right. Savings is great, but the credit score is about your record of borrowing and paying back on time.",
    bad:"Surprising, but no. The credit score only looks at how you have handled borrowed money — mostly whether you paid back on time."},
  "q282a":{type:"mc", prompt:"What is a due date?", concept:"duedate", opts:[
    {t:"The date on a bill by which you must pay", ok:true, fb:"Right. Nilo’s bill said “pay by the 15th” — the 15th was the due date."},
    {t:"The day you get paid for work", ok:false, fb:"That is payday. A due date is when a bill must be paid."},
    {t:"The day a store opens", ok:false, fb:"A due date is about bills: the last day to pay on time."}]},
  "q282b":{type:"mc", prompt:"What is the BIGGEST thing that builds a good credit score?", concept:"duedate", opts:[
    {t:"Paying every bill by its due date", ok:true, fb:"Right. On time, every time. Nothing matters more to the score."},
    {t:"Borrowing as much as possible", ok:false, fb:"Borrowing lots does not help — and borrowing lots all at once can make the score go down."},
    {t:"Having a nice-looking card", ok:false, fb:"How the card looks does nothing. Paying by the due date is what counts."}]},
  "q282c":{type:"tf", prompt:"True or false: missing a due date can lower your credit score.", answer:true, concept:"duedate",
    good:"Right. A missed due date goes on your record — and it usually brings a late fee too.",
    bad:"It really can. A missed due date goes on your record, and banks see it."},
  "q283a":{type:"mc", prompt:"Why does a good credit score matter?", concept:"creditscore", opts:[
    {t:"Borrowing gets easier, and often costs less extra", ok:true, fb:"Right. Tavo got his net loan fast. A good record opens doors when you need them."},
    {t:"It lets you skip paying bills", ok:false, fb:"Nobody gets to skip bills! A good score just makes banks more willing to trust you."},
    {t:"The bank adds a little extra to your savings when your score is high", ok:false, fb:"A score does not add money. It helps when you need to borrow — easier yes, often less extra to pay."}]},
  "q283c":{type:"mc", prompt:"Nilo’s score is low. What can he do?", concept:"creditscore", opts:[
    {t:"Pay on time from now on; it rises slowly", ok:true, fb:"Right. Scores are not stuck. A new record of on-time payments slowly builds trust back."},
    {t:"Nothing — a low score is forever", ok:false, fb:"Not forever! Paying on time, again and again, slowly rebuilds it."},
    {t:"Borrow a lot more right away, to show the bank he can handle it", ok:false, fb:"Borrowing lots at once can lower it further. The fix is on-time payments, one after another."}]},
  "q283b":{type:"mc", transfer:true, prompt:"Mika always gives back what she borrows, on time. Jojo usually forgets. Who will friends be happy to lend to next time?", concept:"creditscore", opts:[
    {t:"Mika — her record shows she gives things back", ok:true, fb:"Exactly. Nobody wrote down a number, but everyone keeps a kind of score. A credit score is the same idea, written down."},
    {t:"Jojo — he needs things more", ok:false, fb:"Needing something does not make people trust you. Friends look at who has given things back before."},
    {t:"Both the same — friends should share with everyone equally, no matter what", ok:false, fb:"The past matters a lot. People lend more easily to someone with a record of giving things back."}]}
};

const CFG = {
  n:28, title:"Your Credit Score", homeSub:"Four short lessons. Who is keeping score — and how to keep it high.",
  pool:["q281a","q281b","q281c","q282a","q282b","q282c","q283a","q283c"], transfer:"q283b",
  quest:"You learned what a credit score is, why due dates matter so much, and how a score is built back up.",
  failKeys:"The keys: a credit score shows how well you have paid back before (not how much money you have), paying by the due date is the biggest thing that builds it, and a low score can slowly be rebuilt.",
  nextFile:"module-29-credit-challenge.html",
  passStory:'<p><strong>You now own:</strong> credit score and due date — and the one habit that matters most: on time, every time.</p>'+
    '<p>Rana finds Kai at the harbor. "You’ve learned borrowing, debt, cards, and scores. When you are grown, you’ll have a card of your own someday."</p>'+
    '<p>She hands him a pretend one, cut from a coconut shell. "So let’s practice. One whole month. Your card. Your bills. Your choices."</p>'+
    '<p class="muted">Module 29: The Credit Challenge.</p>'
};

const TUTOR_HELLO = "Hi! Ask me anything about credit scores or due dates — or tap a button below.";
const TUTOR_SYS = "You are the tutor inside Module 28 (Your Credit Score) of a financial-literacy app, in the Credit block. The learner may be a child or an adult. "+
  "They know from earlier modules: money, dollar, cent, add, subtract, buy, sell, pay, earn, spend, need, save, goal, percent, bank, deposit, withdraw, balance, checking, savings, transaction, notification, interest, grow, fee, overdraft, PIN, scam, budget, cushion, borrow, loan, lend, owe, debt, debit card, credit card. "+
  "From THIS module: credit score (a number that shows banks how well you have paid back before; on-time payments raise it, missed payments and borrowing lots all at once lower it; it is NOT about how much money you have) and due date (the date on a bill by which you must pay). A good score makes it easier to get a yes when you really need to borrow, and often means paying less extra. A low score can be rebuilt slowly with on-time payments. "+
  "TEACHING STYLE: concepts over calculations. Do not give score numbers or ranges (no 300-850), rates, or percentages; describe the score as 'more trusted' vs 'less trusted'. Do not list detailed scoring formulas. "+
  "STRICT RULES: never use these words (later modules): minimum payment, lender (say 'the bank' or 'whoever lends'), credit limit, credit utilization, credit report, credit bureau, APR, interest rate, bankruptcy, collections, invest, stock, tax, insurance. If the learner uses a later word, answer briefly in plain words and say it is coming later. Children do not have credit scores yet; say so gently if asked. "+
  "Story context: the bank said yes fast to Tavo's new net loan because of his good record, and no to Nilo because of missed payments. Kai learned what a credit score is, what a due date is, sorted actions by whether they push a score up or down, and saw that Nilo can rebuild by paying on time. "+
  "Never repeat a failed explanation — switch analogies (a friend who always returns borrowed things, a report card for paying back, trust that takes time to build). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple 'up or down?' question and wait.";

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false,
          acct:{checking:0, savings:0} };

async function loadState(){ S = await FL.load(MODULE_N, S); }
async function saveState(){ await FL.save(MODULE_N, S); }
function addXP(n){ if(_replay) return; FL.award(S, n); document.getElementById("xpBox").textContent = FL.displayXP(S)+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ const canBack = _inLesson && S.lesson!==3 && S.step>0;
  M.innerHTML='<div class="screen on">'+html+(canBack?'<button type="button" class="back-btn" onclick="back()">← Back</button>':'')+'</div>'; window.scrollTo(0,0); }
/* Back: replay the previous step. Steps revisited this way give no extra XP. */
const _far = {}; let _replay = false, _inLesson = false;
function back(){ if(S.lesson!==3 && S.step>0){ S.step--; saveState(); render(); } }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  _inLesson = true;
  { const f=_far[S.lesson]||0; _replay = S.step < f; _far[S.lesson]=Math.max(f, S.step); }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   SIMULATOR — a trust gauge (red → gold → green) with a moving pin.
   No numbers on it on purpose.
===================================================================== */
function gauge(pos, who){
  const p=Math.max(4,Math.min(96,pos));
  return '<div class="gauge"><div class="who">'+who+'</div><div class="gtrack"><div class="gpin" style="left:'+p+'%"></div></div>'+
    '<div class="gends"><span>less trusted</span><span>more trusted</span></div></div>';
}
function cal(d){ return '<span class="cal"><span class="m">DUE</span><span class="d">'+d+'</span></span>'; }

/* =====================================================================
   LESSON 1 — Who's Keeping Score?
===================================================================== */
const L1=[
  ()=>show(`<div class="kicker">Lesson 1 · Who’s keeping score?</div>
    <div class="recap"><strong>Kai’s story so far:</strong> Tavo got a fast yes on a new loan. Nilo got a no. Same bank, same week.</div>
    <div class="card"><p>Rana explains. "Before a bank lends, it wants to know one thing: <em>if we lend to you, will you pay it back?</em>"</p>
    <p>"It can’t see the future. So it looks at the past."</p></div>
    ${gauge(85,"Tavo")}
    ${gauge(22,"Nilo")}
    <button onclick="next()">What is it looking at?</button>`),
  ()=>show(`<div class="kicker">Lesson 1</div>
    <div class="card"><p>Every time someone borrows and pays back, it goes on a record. That record is boiled down into one number: a <strong>credit score</strong>.</p>
    <p>A credit score shows banks how well you have paid back money before. Higher means more trusted.</p>
    <p>Tavo has paid his boat loan every single week. Nilo skipped payments on his jacket and his card. The bank did not guess — it looked.</p>
    <p>One surprise: <strong>the score is not about how much money you have.</strong> It is about how you have handled borrowed money.</p></div>
    <button onclick="earnWord('creditscore');next()">New word: credit score</button>`),
  ()=>renderMC("q281a", next),
  ()=>renderMC("q281b", next),
  ()=>renderTF("q281c", next),
];

/* =====================================================================
   LESSON 2 — The Date That Matters Most (up-or-down sort)
===================================================================== */
const ACTIONS=[
  {t:"Pays the whole credit card bill by the due date.", up:true, why:"On time — exactly what banks want to see."},
  {t:"Misses the due date by two weeks.", up:false, why:"A missed due date goes on the record, and a late fee usually comes too."},
  {t:"Pays the boat loan on time, every week, for a whole year.", up:true, why:"A long record of on-time payments is the strongest thing there is."},
  {t:"Borrows lots of new loans all at once.", up:false, why:"Grabbing lots of new borrowing at once makes banks nervous."},
  {t:"Ignores the bank’s letters and does not pay.", up:false, why:"Missed payments are the fastest way down."},
  {t:"Pays a small bill on time, every month.", up:true, why:"Small or not, on time is on time. It all builds trust."}
];
const L2=[
  ()=>show(`<div class="kicker">Lesson 2 · The date that matters most</div>
    <div class="recap"><strong>So far:</strong> a credit score shows how well you have paid back before.</div>
    <div class="card"><p>Remember Nilo’s bill in Module 27? At the bottom it said: <strong>pay by the 15th</strong>. ${cal(15)}</p>
    <p>That date has a name: the <strong>due date</strong> — the date on a bill by which you must pay.</p>
    <p>Of everything that moves a credit score, paying by the due date matters most. <strong>On time, every time.</strong></p></div>
    <button onclick="earnWord('duedate');next()">New word: due date</button>`),
  ()=>{
    let i=0, pos=50;
    function draw(){
      if(i>=ACTIONS.length){ addXP(6); next(); return; }
      const a=ACTIONS[i];
      show(`<div class="kicker">Up or down? · ${i+1} of ${ACTIONS.length}</div>
        ${gauge(pos,"Someone’s credit score")}
        <div class="item">${a.t}</div>
        <div class="sortbar"><button class="up" id="sUp">⬆ Score goes up</button><button class="down" id="sDown">⬇ Score goes down</button></div>
        <div id="fb"></div><div id="cont"></div>`);
      let done=false;
      function pick(saysUp){
        if(done) return;
        const ok = saysUp===a.up;
        document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'Right — ':'Not quite. ')+a.why+(ok?'':' Try again.')+'</div>';
        revealFB();
        if(ok){
          done=true; addXP(1);
          pos += a.up ? 12 : -12;
          document.querySelector(".gauge").outerHTML=gauge(pos,"Someone’s credit score");
          document.getElementById("sUp").disabled=true; document.getElementById("sDown").disabled=true;
          document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(i<ACTIONS.length-1?"Next":"Done")+'</button>';
          window._n=()=>{ i++; draw(); };
          revealFB();
        }
      }
      document.getElementById("sUp").onclick=()=>pick(true);
      document.getElementById("sDown").onclick=()=>pick(false);
    }
    draw();
  },
  ()=>renderMC("q282a", next),
  ()=>renderMC("q282b", next),
  ()=>renderTF("q282c", next),
];

/* =====================================================================
   LESSON 3 — Why It Matters (and how it comes back)
===================================================================== */
const L3=[
  ()=>show(`<div class="kicker">Lesson 3 · Why it matters</div>
    <div class="recap"><strong>So far:</strong> paying by the due date is what builds a score.</div>
    <div class="card"><p>Why should Kai care about a number he will not have for years?</p>
    <p>Because someday he might <em>need</em> to borrow — like Tavo did when his engine broke. When that day comes:</p>
    <p>✅ A good score → a faster yes, and often <strong>less extra to pay</strong>.<br>
    ❌ A low score → maybe a no, or <strong>more extra to pay</strong> for the same loan.</p>
    <p>The habits Kai builds now — a budget, looking before he pays, paying back what he owes — are the same ones that build a good score later.</p></div>
    <button onclick="next()">What about Nilo?</button>`),
  ()=>show(`<div class="kicker">Lesson 3 · Climbing back</div>
    ${gauge(22,"Nilo — this month")}
    ${gauge(55,"Nilo — a year of on-time payments later")}
    <div class="card"><p>A low score is not forever. Nilo pays every bill by its due date, month after month. Slowly, the pin moves.</p>
    <p>Trust takes a long time to build and a short time to lose. But it <strong>can</strong> be built back.</p></div>
    <button onclick="next()">Practice</button>`),
  ()=>renderMC("q283a", next),
  ()=>renderMC("q283c", next),
];
const META=[
  {title:"Who’s Keeping Score?", sub:"Why the bank said yes to Tavo and no to Nilo", emoji:"📊"},
  {title:"The Date That Matters Most", sub:"Up or down? Sort six choices", emoji:"📅"},
  {title:"Why It Matters", sub:"And how a score comes back", emoji:"🌱"},
];


function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 4 — Mastery (shared shape: 4 random from pool + 1 transfer)
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=CFG.pool.slice().sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,CFG.transfer].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module '+CFG.n+' quest:</strong> '+CFG.quest+'</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module '+CFG.n+' is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-27-paying-with-cards.html\'">← Module 27</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
