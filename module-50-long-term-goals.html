<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Long-Term Goals — Module 50</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436; --locked:#3d6166;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}
  .cut-viz .n{font-size:14px; color:var(--ink-soft); font-weight:600; margin-top:4px}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .acct{background:linear-gradient(135deg,#123a3f 0%,#1b3247 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,58,63,.25)}
  .acct .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .acct .bal{font-size:42px; font-weight:700; font-family:"Fraunces",Georgia,serif; margin:2px 0}
  .acct .who{font-size:14px; opacity:.8}
  .txn{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:15px; animation:fade .3s ease}
  .txn .amt{font-weight:700; color:var(--good); white-space:nowrap}
  .txn .amt.out{color:var(--bad)}
  .txn-empty{color:var(--ink-soft); font-size:15px; font-style:italic; padding:10px 0}
  .tin{background:var(--sand); border:2px dashed var(--sand-deep); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .tin .n{font-size:14px; color:var(--ink-soft); margin-top:4px}
  .ledger{background:#fff; border:2px solid #d9e2de; border-radius:14px; overflow:hidden; margin-bottom:12px}
  .lrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid #eef2f0; font-size:15px}
  .lrow:last-child{border-bottom:none}
  .lrow.head{background:var(--sand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .lrow .run{font-weight:700; font-family:"Fraunces",Georgia,serif; white-space:nowrap}
  .lrow .mv{font-weight:700; white-space:nowrap; color:var(--good)}
  .lrow .mv.out{color:var(--bad)}
  .lrow.pending{background:#fffdf5}
  .duo{display:flex; gap:10px; margin-bottom:14px}
  .duo .acct{flex:1; margin-bottom:0; padding:16px 13px}
  .duo .acct .bal{font-size:29px}
  .duo .acct .lbl{font-size:10px}
  .duo .acct .who{font-size:12px; opacity:.75}
  .acct.save{background:linear-gradient(135deg,#2e7d5b 0%,#1b5540 100%)}
  .sortbar{display:flex; gap:10px; margin-bottom:12px}
  .sortbar button{flex:1; font-size:15px; padding:14px 8px}
  .sortbar .chk{background:var(--ink)}
  .sortbar .sav{background:var(--good)}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px; font-size:18px; font-weight:600}
  .item .sub{font-size:14px; font-weight:400; color:var(--ink-soft); margin-top:4px}
  .phone{background:#0e1b2c; border-radius:22px; padding:12px 10px 14px; margin-bottom:14px; box-shadow:0 6px 22px rgba(14,27,44,.3)}
  .phone .pbar{display:flex; justify-content:space-between; color:#8fa8bd; font-size:11px; padding:2px 8px 8px; letter-spacing:.04em}
  .feed{background:#fff; border-radius:14px; overflow:hidden}
  .fitem{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid #eef2f0; font-size:14px}
  .fitem:last-child{border-bottom:none}
  .fitem .day{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
  .fitem .amt{font-weight:700; white-space:nowrap; color:var(--good)}
  .fitem .amt.out{color:var(--bad)}
  .fitem .run{font-size:11px; color:var(--ink-soft)}
  .notif{background:var(--sand); border:2px solid var(--sand-deep); border-radius:12px; padding:11px 14px; margin-bottom:10px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
  .notif .bell{font-size:17px; line-height:1.2}
  .grow{background:#fff; border:2px solid var(--good); border-radius:14px; padding:20px; text-align:center; margin-bottom:12px}
  .grow .arrow{font-size:22px; color:var(--good); margin:2px 0}
  .grow .lbl2{font-size:13px; color:var(--ink-soft)}
  .compare{display:flex; gap:10px; margin-bottom:12px}
  .compare .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 10px; text-align:center}
  .compare .box.win{border-color:var(--good); background:#eef7f2}
  .compare .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .compare .box .v{font-size:22px; font-weight:700; font-family:"Fraunces",Georgia,serif}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .week{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:var(--shell); display:inline-block; border-radius:6px; padding:2px 10px; margin-bottom:8px; font-weight:700}
  .stars{font-size:28px; letter-spacing:4px; text-align:center; margin:6px 0}
  .life{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:12px 14px; margin-bottom:12px}
  .life .track{display:flex; height:26px; border-radius:999px; overflow:hidden; margin:8px 0 6px}
  .life .track div{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff}
  .life .kid{background:#d6e3dd; color:var(--ink)!important} .life .work{background:var(--good)} .life .ret{background:var(--shell)}
  .life .legend{font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between}
  .buckets{display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:12px}
  .bucket{background:#fff; color:var(--ink); border:2px solid #d9e2de; border-radius:14px; padding:12px 14px; text-align:left; font-size:14px; font-weight:400; line-height:1.4; min-height:44px}
  .bucket .nm{font-weight:800; font-size:15px}
  .bucket.open{border-color:var(--good); background:#e8f3ee}
  .cover{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:12px 14px; margin-bottom:12px}
  .cover .lbl{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; display:flex; justify-content:space-between}
  .cover .bar{height:16px; border-radius:999px; background:#eef2f0; overflow:hidden; margin-top:8px; display:flex}
  .cover .bar div{height:100%; transition:width .5s ease}
  .race{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:12px 14px; margin-bottom:12px}
  .race .row{margin:8px 0}
  .race .nm{display:flex; justify-content:space-between; font-weight:700; font-size:15px}
  .race .bar{height:18px; border-radius:999px; background:#eef2f0; overflow:hidden; margin-top:4px}
  .race .bar div{height:100%; border-radius:999px; transition:width .6s ease}
  .race .p .bar div{background:var(--good)} .race .l .bar div{background:var(--shell)}
  .race .sub{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .sortbar .st{background:var(--ink)} .sortbar .lt{background:var(--good)}
  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{
    width:auto; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 12px; border-radius:999px; text-decoration:none;
    color:var(--ink); font-weight:700; font-size:14px; background:#fff;
    border:2px solid #d9e6e1; line-height:1.1; font-family:inherit; cursor:pointer;
  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
  .hrow{flex-wrap:wrap; row-gap:8px}
  .dots{margin-top:8px; flex-wrap:wrap}
  .shelf .word-chip{width:auto; min-height:44px; display:inline-flex; align-items:center}
  button,.opt,.sort-item,.coin-btn{min-height:44px}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.word-chip:focus-visible{
    outline:3px solid var(--shell); outline-offset:2px;
  }
  input,textarea{max-width:100%}
  .tp-in input{min-height:44px}
  .trader,.zone,.acct,.card,.txn,.lrow{min-width:0; max-width:100%}
  .trader button,.tp-quick button,.sortbar button{min-height:44px}
  .zones,.sortbar,.duo,.btn-row,.pick2{flex-wrap:wrap}
  .zone{flex:1 1 140px}
  #tutorBtn{max-width:calc(100vw - 32px)}
  @media (max-width:380px){
    h1{font-size:26px}
    .traders{grid-template-columns:1fr}
    .duo{flex-direction:column}
  }
  .back-btn{background:transparent; color:var(--ink); border:2px solid #cfdcd8; margin-top:12px; min-height:44px}
  .back-btn:hover{border-color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about retirement and long-term goals…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 50;
/* =====================================================================
   MODULE 50 — LONG-TERM GOALS  (Finale block, 1 of 3)
   Vocab: retirement, retirement account.
   L1: Tavo's question. A lifetime bar (childhood / working / retired),
       then open three buckets that will pay Tavo's needs once the
       paycheck stops: what he built, an island program he paid into
       from every paycheck, and family/selling his boat. Named: retirement.
   L2: Pua starts $5 a week at 20; Leo starts $10 a week at 40. By 65,
       Pua put in less but has more (compound growth, M44). Named:
       retirement account (generic: names and rules differ by place;
       some employers add money; taking it out early can cost extra).
   L3: Short-term or long-term goal sort, then a 4-moment challenge.
   Pua/Leo numbers follow ~7% a year, never stated; labeled smoothed.
===================================================================== */
const VOCAB = {
  retirement:{term:"retirement", def:"The time in life when a person stops working for pay, usually when they're older. The paychecks stop, but needs like food, a home, and medicine don't."},
  retacct:{term:"retirement account", def:"A special account for long-term money you'll live on in retirement. Names and rules differ by place. Often it gets extra help, like an employer adding money, and taking money out early can cost extra."}
};

const QUESTIONS = {
  "q501a":{type:"mc", prompt:"What is retirement?", concept:"retirement", opts:[
    {t:"The time when someone stops working for pay, usually when older", ok:true, fb:"Right. The paychecks stop, but the needs keep going."},
    {t:"A long vacation someone takes between two jobs to rest before starting again", ok:false, fb:"A break between jobs is short. Retirement is when someone stops working for pay for good, usually when older."},
    {t:"When someone switches to a new employer", ok:false, fb:"That's a new job. Retirement is when working for pay stops."}]},
  "q501b":{type:"mc", prompt:"Tavo stops fishing. His paychecks stop. What will mostly pay for his needs?", concept:"retirement", opts:[
    {t:"Money he built up while working, plus programs he paid into", ok:true, fb:"Right. Retirement is paid for by what you set aside while you were earning."},
    {t:"Nothing. Needs stop when work stops", ok:false, fb:"Food, a home, and medicine are still needed. Something has to pay for them."},
    {t:"A loan he can pay back slowly, even with no paychecks coming in", ok:false, fb:"Loans must be paid back, and borrowing with no income is very risky. Retirement runs on money built up earlier."}]},
  "q501c":{type:"tf", prompt:"True or false: retirement only matters once you're old.", answer:false, concept:"retirement",
    good:"Right. It's paid for during the working years, and the earliest years help most, thanks to compound growth.",
    bad:"Look again. Retirement is paid for while you're working. Starting young gives compound growth the most time."},
  "q502a":{type:"mc", prompt:"What is a retirement account?", concept:"retacct", opts:[
    {t:"An account for long-term money to live on later, often with extra help", ok:true, fb:"Right. Names and rules differ by place, but the idea is the same."},
    {t:"An account for next week's spending", ok:false, fb:"That's checking. A retirement account is for money you won't touch for decades."},
    {t:"The emergency fund under a new name, kept ready for any bad day before you're old", ok:false, fb:"The emergency fund must be ready any day. Retirement money is meant to stay put for a very long time."}]},
  "q502b":{type:"mc", prompt:"Pua put in about $11,700 starting at 20. Leo put in about $13,000 starting at 40. By 65, Pua has much more. Why?", concept:"retacct", opts:[
    {t:"Her money had 20 more years of compound growth", ok:true, fb:"Right. Time beat size. Starting small and early won."},
    {t:"Pua found a magic account", ok:false, fb:"Same kind of account. The only big difference was 20 extra years of growth on growth."},
    {t:"Leo's money disappeared", ok:false, fb:"Leo's money grew too, just for fewer years. Pua had 20 more years of compound growth."}]},
  "q503a":{type:"mc", prompt:"At 30, Kai wants to take money out of his retirement account early to buy a fancy new phone. What's the problem?", concept:"retacct", opts:[
    {t:"It can cost extra, and that money loses decades of growth he'll need later", ok:true, fb:"Right. A phone today could cost far more in retirement money later. It's long-term money for a reason."},
    {t:"No problem. It's his own money, so he can take it out any time with no cost at all", ok:false, fb:"It's his, but taking it out early often costs extra, and it stops decades of compound growth."},
    {t:"The phone will grow in value instead", ok:false, fb:"Phones lose value fast. The retirement money would have kept growing."}]},
  "q503b":{type:"mc", transfer:true, prompt:"Lena's aunt, 25, starts a new job. Her employer says: \"Put money in your retirement account and we'll add some too.\" She already has an emergency fund. What's a smart move?", concept:"retacct", opts:[
    {t:"Join, put in at least enough to get the employer's extra, read the fine print, and keep her emergency fund", ok:true, fb:"Exactly. Extra money from an employer plus decades of growth. Same ideas as Pua's head start."},
    {t:"Wait until she's 45, because 25 is too young", ok:false, fb:"25 is a great time. More years of growth, and she'd miss the employer's extra money."},

  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 4 — Mastery (shared shape: 4 random from pool + 1 transfer)
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=CFG.pool.slice().sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,CFG.transfer].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module '+CFG.n+' quest:</strong> '+CFG.quest+'</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module '+CFG.n+' is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-49-money-world-challenge.html\'">← Module 49</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
