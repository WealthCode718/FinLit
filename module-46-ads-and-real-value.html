<!DOCTYPE html>
<html lang="en">
<head>

<title>FinLit — Ads & Real Value — Module 46</title>
<style>

  /* Shared island UX — tap targets, focus, no sideways scroll */

<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about advertising and real value…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 46;
/* =====================================================================
   MODULE 46 — ADS & REAL VALUE  (Money World block, 1 of 4)
   Vocab: advertising, value.
   L1: Spot five tricks on the Sparkle Snack poster (opinion as fact,
       crowd pressure, rush, paid famous person, tiny print). Named:
       advertising. Ads aren't evil; some lines are useful facts.
   L2: Fact or feeling? sort, then a pop-up "gem sale" in Kai's phone
       game (online ads, sponsored videos, in-game offers).
   L3: Pick the better value in three pairs; cheap isn't always better
       value, and a "sale" on something you don't need isn't value.
       Named: value.
   PISA link: financial landscape, consumer awareness.
===================================================================== */
const VOCAB = {
  advertising:{term:"advertising", def:"Messages that sellers pay for to make you want to buy their things: signs, videos, pop-ups, songs, even famous people. Some parts are useful facts. Some parts are tricks to make you feel rushed or left out."},
  value:{term:"value", def:"What you really get for what you pay: how good it is, how long it lasts, and how much you'll actually use it. A low price is not the same as good value."}
};

const QUESTIONS = {
  "q461a":{type:"mc", prompt:"What is advertising?", concept:"advertising", opts:[
    {t:"Messages sellers pay for to make you want to buy their things", ok:true, fb:"Right. Signs, videos, pop-ups, and paid famous people are all advertising."},
    {t:"Fair reviews written by people who tested the product", ok:false, fb:"A fair review isn't paid for by the seller. Advertising is the seller's own message, made to get you to buy."},
    {t:"Rules that say what stores are allowed to sell", ok:false, fb:"That's not it. Advertising is messages sellers pay for, to make you want their things."}]},
  "q461b":{type:"mc", prompt:"An ad shouts “ONLY TODAY! HURRY!” What is that trick trying to do?", concept:"advertising", opts:[
    {t:"Rush you so you buy before you stop and think", ok:true, fb:"Right. Scammers use the same trick (Module 23). A good deal usually survives one night of thinking."},
    {t:"Help you plan your budget", ok:false, fb:"It does the opposite. The rush is there so you skip the planning."},
    {t:"Tell you a useful fact about the product", ok:false, fb:"“Hurry” tells you nothing about the product. It's pressure, not information."}]},
  "q461c":{type:"tf", prompt:"True or false: if a famous person is in an ad for a product, the product must be good.", answer:false, concept:"advertising",
    good:"Right. Famous people are often paid to be in ads. Being in an ad isn't proof that something is good.",
    bad:"Look again. Famous people are often PAID to be in ads. That's not proof the product is good."},
  "q462a":{type:"mc", prompt:"Which line from an ad is a useful FACT, not a feeling-pusher?", concept:"advertising", opts:[
    {t:"“$2 a cup. Made with mango and lime. Open 8 to 5 at the harbor.”", ok:true, fb:"Right. Price, what's in it, where and when. You can check all of that."},
    {t:"“The most amazing drink you'll ever taste!”", ok:false, fb:"That's an opinion dressed up as a fact. You can't check “most amazing.”"},
    {t:"“Everyone cool is drinking it!”", ok:false, fb:"That's crowd pressure, trying to make you feel left out. It tells you nothing about the drink."}]},
  "q462b":{type:"mc", prompt:"A pop-up in Kai's game: “GEM PACK 80% OFF! 2 hours left!” What's the smartest first move?", concept:"advertising", opts:[
    {t:"Pause. Ask: do I need it, is it in my budget, and would I want it tomorrow?", ok:true, fb:"Right. A countdown timer is a rush trick. Your budget doesn't change just because a clock is ticking."},
    {t:"Buy fast before the timer ends", ok:false, fb:"The timer is there so you don't think. 80% off something you don't need is still money spent."},
    {t:"Buy two, because it's 80% off", ok:false, fb:"A discount on something you didn't plan to buy isn't saving money. It's spending money."}]},
  "q463a":{type:"mc", prompt:"Sandals A cost $4 and break after about 2 months. Sandals B cost $10 and last a whole year. Which is better value for a year of walking?", concept:"value", opts:[
    {t:"Sandals B. Kai would need about 6 pairs of A in a year, which is $24", ok:true, fb:"Right. The cheaper price wasn't the better value. B costs $10 for the whole year."},
    {t:"Sandals A, because $4 is less than $10", ok:false, fb:"Per pair, yes. But A breaks every 2 months: 6 pairs × $4 = $24 for the year, more than B's $10."},
    {t:"They are the same value", ok:false, fb:"Count the pairs: about 6 of A in a year is $24. One pair of B is $10."}]},
  "q463b":{type:"mc", transfer:true, prompt:"Lena sees a video of a popular gamer holding a $40 headset: “Use my code for 10% off, today only!” The video has a tiny “sponsored” label. What's true?", concept:"advertising", opts:[
    {t:"It's an ad. The gamer is paid, and “today only” is a rush. Lena should compare before buying", ok:true, fb:"Exactly. Different place, same tricks: a paid famous person and a rush. “Sponsored” means advertising."},
    {t:"It's an honest review, because the gamer uses it", ok:false, fb:"“Sponsored” means the seller paid for it. That makes it advertising, not a fair review."},
    {t:"10% off means she's saving money, so she should buy it now", ok:false, fb:"She only saves if she needed a headset anyway and it's good value. Compare first. The rush is a trick."}]}
};

const CFG = {
  n:46, title:"Ads & Real Value", homeSub:"Four short lessons. Spot the tricks in advertising, and learn to judge real value.",

const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];

}
function lessonComplete(){

}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-45-investing-challenge.html\'">← Module 45</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
