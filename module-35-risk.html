<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Risk — Module 35</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}

  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}

  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}

  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}

  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}

  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}

  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}

  .grow{background:#fff; border:2px solid var(--good); border-radius:14px; padding:20px; text-align:center; margin-bottom:12px}

  .compare{display:flex; gap:10px; margin-bottom:12px}
  .compare .box{flex:1; background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px 10px; text-align:center}
  .compare .box.win{border-color:var(--good); background:#eef7f2}
  .compare .box .n{font-size:12px; color:var(--ink-soft); margin-bottom:4px}
  .compare .box .v{font-size:22px; font-weight:700; font-family:"Fraunces",Georgia,serif}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
  .grid2 button{font-size:14px; padding:14px 8px; border-radius:12px; line-height:1.25}
  .grid2 .q1{background:#e8b84b; color:var(--night)}
  .grid2 .q2{background:var(--bad)}
  .grid2 .q3{background:var(--good)}
  .grid2 .q4{background:var(--shell)}
  .grid2 button small{display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:2px}
  .ways{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
  .ways div{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:12px 10px; font-size:14px}
  .ways div strong{display:block; font-size:15px; margin-bottom:2px}
  .ways div span{font-size:24px}
  .sailcard{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:14px; text-align:center; margin-bottom:12px}
  .sailcard .v{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:26px; color:var(--bad)}
  /* Shared island UX — tap targets, focus, no sideways scroll */
  html,body{overflow-x:clip}
  a.back-hub,button.back-lessons{
    width:auto; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 12px; border-radius:999px; text-decoration:none;
    color:var(--ink); font-weight:700; font-size:14px; background:#fff;
    border:2px solid #d9e6e1; line-height:1.1; font-family:inherit; cursor:pointer;
  }
  .hrow-nav{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
  .hrow{flex-wrap:wrap; row-gap:8px}
  .dots{margin-top:8px; flex-wrap:wrap}
  .shelf .word-chip{width:auto; min-height:44px; display:inline-flex; align-items:center}

  input,textarea{max-width:100%}

    h1{font-size:26px}
    .traders{grid-template-columns:1fr}

</style>

<div id="app">
  <header>
    <div class="hrow">
      <div class="hrow-nav">
        <a class="back-hub" href="index.html">← Modules</a>
        <button type="button" class="back-lessons" onclick="goHome()">Lessons</button>
      </div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about risk and loss…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script src="finlit-core.js"></script>
<script>
const MODULE_N = 35;
/* =====================================================================
   CONTENT — Module 35: Risk  (opens the Risk & Insurance block)
   Vocab: risk, loss.
   Built toward the PISA financial-literacy "risk and reward" content:
   recognising risk, judging it by likelihood × size of loss, and
   choosing a response (avoid / reduce / keep / share).
   Callback: "risky" was used informally in M17 (the storm and the tin).
   "Share the risk" is SHOWN here as the fourth way and NAMED as
   insurance in M37. No probabilities or numbers to compute.
===================================================================== */
const VOCAB = {
  risk:{term:"risk", def:"The chance that something bad could happen that costs you money. Ask two questions: how likely is it, and how big would the loss be?"},
  loss:{term:"loss", def:"The money or things you lose when something bad happens. A torn sail is a $60 loss for Kai."}
};

const QUESTIONS = {
  "q351a":{type:"mc", prompt:"What is a risk?", concept:"risk", opts:[
    {t:"The chance that something bad could happen that costs you money", ok:true, fb:"Right. Not a sure thing — a chance. The storm MIGHT tear the sail."},
    {t:"Something bad that has already happened", ok:false, fb:"Once it has happened, it is a loss. A risk is the chance of it happening."},
    {t:"A kind of fee from the bank", ok:false, fb:"A fee is a certain charge. A risk is a chance that something bad might happen."}]},
  "q351b":{type:"mc", prompt:"The storm tears Kai’s sail. The sail cost $60. What is the $60?", concept:"loss", opts:[
    {t:"A loss — money Kai loses because something bad happened", ok:true, fb:"Right. The risk was the chance of a tear. The loss is what the tear actually cost."},
    {t:"Income", ok:false, fb:"Income comes IN. A torn sail sends money out — it is a loss."},
    {t:"A refund", ok:false, fb:"A refund gives money back. Here money is lost."}]},
  "q351c":{type:"tf", prompt:"True or false: every choice has zero risk if you are careful enough.", answer:false, concept:"risk",
    good:"Right. Care can make risk smaller, but some chance of something bad almost always stays.",
    bad:"Careful people still face risk. Care can shrink it, but almost nothing is zero risk."},
  "q352a":{type:"mc", prompt:"What are the two questions to ask about any risk?", concept:"risk", opts:[
    {t:"How likely is it? How big would the loss be?", ok:true, fb:"Right. A likely small loss and an unlikely huge loss need very different plans."},
    {t:"Who is to blame? When will it happen?", ok:false, fb:"Blame does not help plan. Ask: how likely is it, and how big would the loss be?"},
    {t:"Is it a need or a want?", ok:false, fb:"That is a budgeting question. For risk, ask how likely and how big."}]},
  "q352b":{type:"mc", prompt:"Which risk deserves the MOST planning?", concept:"loss", opts:[
    {t:"A likely risk with a big loss — like storm season and a new sail", ok:true, fb:"Right. It will probably happen, and it would hurt a lot. That is where planning pays off most."},
    {t:"An unlikely risk with a tiny loss", ok:false, fb:"Rare and small? Hardly worth worrying about. Save your planning for likely, big losses."},
    {t:"Losing a $1 fish hook", ok:false, fb:"That happens, but it is small. Kai can just pay for a new one. The big, likely risks need more planning."}]},
  "q353a":{type:"mc", prompt:"Kai checks the sky and stays in the harbor when a storm is coming. Which way of handling risk is that?", concept:"risk", opts:[
    {t:"Avoid it — not doing the risky thing at all", ok:true, fb:"Right. No sailing in the storm, no storm damage from sailing."},
    {t:"Keep it — paying for any loss himself", ok:false, fb:"Keeping it would mean sailing anyway and paying if the sail tears. Staying in is avoiding."},
    {t:"Share it with others", ok:false, fb:"Sharing spreads the cost of a loss across many people. Staying in port avoids the risk entirely."}]},
  "q353c":{type:"mc", prompt:"Kai loses a $1 fish hook most weeks. What is the sensible way to handle that risk?", concept:"loss", opts:[
    {t:"Keep it — just pay for a new hook when it happens", ok:true, fb:"Right. Small, expected losses are simply part of the budget. No big plan needed."},
    {t:"Stop fishing forever", ok:false, fb:"Avoiding fishing would cost him his job! For a tiny loss, just keep the risk and buy a new hook."},
    {t:"Borrow money for hooks", ok:false, fb:"Borrowing makes things cost more. A $1 loss fits right in his budget."}]},
  "q353b":{type:"mc", transfer:true, prompt:"Mika wears a helmet every time she rides her bike. Which way of handling risk is that?", concept:"risk", opts:[
    {t:"Reduce it — she still rides, but a fall would hurt far less", ok:true, fb:"Exactly. Same as Kai tying down the sail before a storm: the risk is still there, just smaller."},
    {t:"Avoid it — she never rides", ok:false, fb:"She does ride! Avoiding would mean never riding. The helmet makes the risk smaller."},
    {t:"Keep it — she ignores the risk", ok:false, fb:"She is not ignoring it — she is doing something about it. That is reducing."}]}
};

const CFG = {
  n:35, title:"Risk", homeSub:"Four short lessons. The storm, the sail, and how to think about what could go wrong.",
  pool:["q351a","q351b","q351c","q352a","q352b","q353a","q353c"], transfer:"q353b",
  quest:"You learned what risk and loss are, how to size up a risk, and four ways to handle one.",
  failKeys:"The keys: a risk is the chance of something bad that costs money, a loss is what it actually costs, size up a risk by how likely and how big, and you can avoid, reduce, keep, or share it.",
  badge:" · Risk & Insurance block begins ⛈️",
  nextFile:"module-36-emergency-fund.html",
  passStory:'<p><strong>You now own:</strong> risk and loss.</p>'+
    '<p>The storm passes. The sail survives — barely. But Tavo is not so lucky: a wave smashes his boat against the dock. The repair will cost $40, and he needs it fixed this week to keep fishing.</p>'+
    '<p>He does not borrow. He does not panic. He walks to the bank and takes $40 out of a savings account Kai has never heard of.</p>'+
    '<p>"What is that account for?" Kai asks.</p>'+
    '<p>"Days exactly like this one," Tavo says.</p>'+
    '<p class="muted">Module 36: The Emergency Fund.</p>'
};

const TUTOR_HELLO = "Hi! Ask me anything about risk, loss, or ways to handle what could go wrong — or tap a button below.";
const TUTOR_SYS = "You are the tutor inside Module 35 (Risk) of a financial-literacy app, the first module of the Risk & Insurance block. The learner may be a child or an adult. "+
  "They know from earlier modules: money, dollar, cent, add, subtract, multiply, buy, sell, pay, earn, work, spend, need, save, goal, percent, bank, deposit, withdraw, balance, checking, savings, transaction, notification, interest, grow, fee, overdraft, PIN, scam, budget, cushion, borrow, loan, lend, owe, debt, debit card, credit card, credit score, due date, lender, minimum payment, employer, wage, paycheck, income, tax, take-home pay, sales tax, receipt, tax return, refund. "+
  "From THIS module: risk (the chance that something bad could happen that costs you money) and loss (the money or things you lose when it does happen). Size up a risk with two questions: how likely is it, and how big would the loss be? Four ways to handle a risk: avoid it (don't do the risky thing), reduce it (make it less likely or less bad, like tying down a sail or wearing a helmet), keep it (pay small losses yourself), share it (spread the cost of a big loss across many people — named in a later module). "+
  "TEACHING STYLE: concepts over calculations. No probabilities, odds, or percentages. Keep answers about WHY and WHICH. Do not frighten the learner; risk is normal and manageable. "+
  "STRICT RULES: never use these words (later modules): insurance, premium, deductible, claim, policy, coverage, emergency fund, emergency, invest, stock, diversify. If the learner uses one, answer briefly in plain words and say it is coming later. "+
  "Story context: a storm threatened Kai's new $60 sail (in Module 17 a storm also made his tin under the floorboard feel risky). Kai sorted risks by how likely and how big (a lost fish hook, a torn sail in storm season, a rare giant wave, a rarely cracked cup), then learned avoid, reduce, keep, share. "+
  "Never repeat a failed explanation — switch analogies (a helmet, an umbrella, checking the sky before sailing). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked 'Quiz me', ask ONE simple 'which way of handling it?' question and wait.";

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false,
          acct:{checking:0, savings:0} };

async function loadState(){ S = await FL.load(MODULE_N, S); }
async function saveState(){ await FL.save(MODULE_N, S); }
function addXP(n){ FL.award(S, n); document.getElementById("xpBox").textContent = FL.displayXP(S)+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   SIMULATOR — a 2×2 "how likely × how big" board. Each risk has clear
   hints in its text so the right square never depends on opinion.
===================================================================== */
const RISKS=[
  {t:"🪝 Losing a $1 fish hook overboard", hint:"Happens almost every week.", q:"q1", why:"Likely (every week) but small ($1). Just part of fishing."},
  {t:"⛵ The storm tearing Kai’s $60 sail", hint:"It is storm season — storms come often.", q:"q2", why:"Likely (storm season) AND big ($60). This is the one to plan for."},
  {t:"🌊 A giant wave sinking the whole boat", hint:"It has not happened on this island in fifty years.", q:"q4", why:"Rare — but if it happened, the loss would be huge."},
  {t:"🥤 Kai’s $1 cup cracking on a calm day", hint:"It has almost never happened.", q:"q3", why:"Rare AND small. Not worth a second thought."}
];
const Q_LABEL={q1:"Likely · small loss", q2:"Likely · big loss", q3:"Unlikely · small loss", q4:"Unlikely · big loss"};
function board(){
  return '<div class="grid2">'+
    '<button class="q1" data-bot="1" data-q="q1">Likely<small>small loss</small></button>'+
    '<button class="q2" data-bot="1" data-q="q2">Likely<small>BIG loss</small></button>'+
    '<button class="q3" data-bot="1" data-q="q3">Unlikely<small>small loss</small></button>'+
    '<button class="q4" data-bot="1" data-q="q4">Unlikely<small>BIG loss</small></button></div>';
}

/* =====================================================================
   LESSON 1 — The Storm
===================================================================== */
const L1=[
  ()=>show(`<div class="kicker">Lesson 1 · The storm</div>
    <div class="recap"><strong>Kai’s story so far:</strong> A whole season of work, and the sail is finally his. Then the sky turns grey.</div>
    <div class="scene">⛈️⛵<div class="cap">Tavo: "What happens to that sail if the storm tears it in half?"</div></div>
    <div class="card"><p>Kai has felt this before. Back in Module 17, a storm made his tin under the floorboard feel <em>risky</em> — and that is why he opened a bank account.</p>
    <p>Now the word gets its full meaning.</p></div>
    <button onclick="next()">What is risk?</button>`),
  ()=>show(`<div class="kicker">Lesson 1</div>
    <div class="card"><p>A <strong>risk</strong> is the chance that something bad could happen that costs you money.</p>
    <p>It is not a sure thing. The storm <em>might</em> tear the sail. Or it might not.</p></div>
    <button onclick="earnWord('risk');next()">New word: risk</button>`),
  ()=>show(`<div class="kicker">Lesson 1 · And if it happens?</div>
    <div class="sailcard"><div>If the sail tears, Kai loses</div><div class="v">$60</div></div>
    <div class="card"><p>If the bad thing actually happens, what you lose is called a <strong>loss</strong>.</p>
    <p>The risk is the <em>chance</em>. The loss is the <em>cost</em>. Kai’s whole season of saving could be a $60 loss in one gust.</p></div>
    <button onclick="earnWord('loss');next()">New word: loss</button>`),
  ()=>renderMC("q351a", next),
  ()=>renderMC("q351b", next),
  ()=>renderTF("q351c", next),
];

/* =====================================================================
   LESSON 2 — How Likely, How Big (2×2 sort)
===================================================================== */
const L2=[
  ()=>show(`<div class="kicker">Lesson 2 · Two questions</div>
    <div class="recap"><strong>So far:</strong> risk is the chance; loss is the cost.</div>
    <div class="card"><p>Tavo has been fishing for thirty years. He sizes up every risk with two questions:</p>
    <p style="text-align:center; font-size:18px"><strong>How likely is it?<br>How big would the loss be?</strong></p>
    <p>A likely little loss and a rare huge one need very different plans. Try sorting four of Kai’s risks.</p></div>
    <button onclick="next()">Sort four risks</button>`),
  ()=>{
    let i=0;
    function draw(){
      if(i>=RISKS.length){ addXP(4); next(); return; }
      const r=RISKS[i];
      show(`<div class="kicker">How likely, how big? · ${i+1} of ${RISKS.length}</div>
        <div class="item">${r.t}<div class="sub">${r.hint}</div></div>
        ${board()}
        <div id="fb"></div><div id="cont"></div>`);
      let done=false;
      document.querySelectorAll(".grid2 button").forEach(b=>{
        b.onclick=()=>{
          if(done) return;
          const ok=b.dataset.q===r.q;
          document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'Right — '+r.why:'Not quite. Look at the hint: how often does it happen, and how much would it cost? Try again.')+'</div>';
          revealFB();
          if(ok){
            done=true; addXP(1);
            document.querySelectorAll(".grid2 button").forEach(x=>x.disabled=true);
            document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(i<RISKS.length-1?"Next":"Done")+'</button>';
            window._n=()=>{ i++; draw(); };
            revealFB();
          } else { b.disabled=true; }
        };
      });
    }
    draw();
  },
  ()=>renderMC("q352a", next),
  ()=>renderMC("q352b", next),
];

/* =====================================================================
   LESSON 3 — Four Ways to Handle a Risk
===================================================================== */
const L3=[
  ()=>show(`<div class="kicker">Lesson 3 · Four ways</div>
    <div class="recap"><strong>So far:</strong> likely and big risks need the most planning.</div>
    <div class="ways">
      <div><span>🚫</span><strong>Avoid it</strong>Don’t do the risky thing. Stay in port when a storm is coming.</div>
      <div><span>🪢</span><strong>Reduce it</strong>Make it less likely or less bad. Tie the sail down tight.</div>
      <div><span>👛</span><strong>Keep it</strong>Pay small losses yourself. A lost hook? Buy another.</div>
      <div><span>🤝</span><strong>Share it</strong>Many people chip in, so no one faces a huge loss alone. <em>(More on this soon.)</em></div>
    </div>
    <div class="card"><p>Tavo uses all four. He never sails in a storm. He ties everything down. He buys new hooks without a second thought.</p>
    <p>And for the really big ones — the ones that could sink him — he shares the risk with other fishers. Kai will learn how that works in Module 37.</p></div>
    <button onclick="next()">Practice</button>`),
  ()=>renderMC("q353a", next),
  ()=>renderMC("q353c", next),
];
const META=[
  {title:"The Storm", sub:"Risk is the chance; loss is the cost", emoji:"⛈️"},
  {title:"Two Questions", sub:"How likely? How big? Sort four", emoji:"🎯"},
  {title:"Four Ways", sub:"Avoid, reduce, keep, share", emoji:"🧭"},
];


function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'); /* shuffled so the right answer isn't always first */
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   LESSON 4 — Mastery (shared shape: 4 random from pool + 1 transfer)
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=CFG.pool.slice().sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,CFG.transfer].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module '+CFG.n+' quest:</strong> '+CFG.quest+'</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module '+CFG.n+' is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },

function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module '+CFG.n+' complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓'+(CFG.badge||'')+'</p></div>'+
      '<div class="card">'+CFG.passStory+'</div>'+
      (CFG.nextFile?'<button style="margin-bottom:10px" onclick="window.location.href=\''+CFG.nextFile+'\'">Continue to Module '+(CFG.n+1)+'</button>':'')+
      '<button class="btn-ghost" style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module '+CFG.n+'</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-34-earning-challenge.html\'">← Module 34</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
