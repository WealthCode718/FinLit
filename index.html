<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinLit — Your Financial Journey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436; --locked:#3d6166;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:var(--lagoon); overflow-x:clip}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}

  #app{max-width:560px; width:100%; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}

  /* hero header */
  .hero{
    background:linear-gradient(160deg,#0e1b2c 0%,#1b3a47 100%);
    padding:32px 20px 24px; color:#fff;
  }
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start}
  .logo{font-size:13px; letter-spacing:.18em; text-transform:uppercase; opacity:.7; margin-bottom:6px}
  .hero h1{font-size:32px; line-height:1.1; color:#fff}
  .hero p{font-size:15px; opacity:.75; margin-top:6px}
  .xp-badge{
    background:var(--gold); color:var(--night); font-weight:800; font-size:14px;
    border-radius:999px; padding:6px 14px; white-space:nowrap; flex-shrink:0;
  }

  /* overall progress bar */
  .prog-wrap{padding:16px 20px; background:var(--card); border-bottom:1px solid #e2ede9}
  .prog-label{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:6px}
  .prog-bar{height:8px; background:#dde9e5; border-radius:999px; overflow:hidden}
  .prog-fill{height:100%; background:var(--shell); border-radius:999px; transition:width .6s ease}

  main{flex:1; padding:16px 16px 40px}

  /* block headers */
  .block-label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
    font-weight:700; margin:20px 0 10px; padding-left:2px;
  }

  /* module card */
  .mod-card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    margin-bottom:10px; overflow:hidden; text-decoration:none; display:block; color:var(--ink);
    border:2px solid transparent; transition:border-color .2s;
  }
  .mod-card:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  .mod-card.done{border-color:#c8e6d8}
  .mod-card.locked{background:#f7faf9; box-shadow:none; cursor:default}
  .mod-card.active{border-color:var(--shell)}
  .mod-inner{display:flex; align-items:center; gap:14px; padding:14px 16px; min-height:72px}
  .mod-icon{
    width:46px; height:46px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:24px; flex-shrink:0; background:var(--lagoon);
  }
  .mod-icon.done{background:#eef7f2}
  .mod-icon.locked{background:#f0f0f0}
  .mod-icon.active{background:var(--shell-soft)}
  .mod-info{flex:1; min-width:0}
  .mod-title{font-weight:700; font-size:15px; margin-bottom:2px}
  .mod-sub{font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mod-status{flex-shrink:0; font-size:13px; font-weight:700}
  .mod-status.done{color:var(--good)}
  .mod-status.active{color:var(--shell)}
  .mod-status.locked{color:var(--locked)}

  /* mini progress dots on active card */
  .mod-dots{display:flex; gap:4px; margin-top:6px}
  .mod-dot{width:7px; height:7px; border-radius:50%; background:#dde9e5}
  .mod-dot.on{background:var(--shell)}

  /* coming soon banner */
  .coming{
    background:var(--sand); border-radius:var(--radius); padding:16px 18px;
    text-align:center; margin-top:8px; color:var(--ink-soft); font-size:14px;
  }
  .coming strong{color:var(--ink); display:block; margin-bottom:4px}

  /* words shelf */
  .words-wrap{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px}
  .words-label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px}
  .words-row{display:flex; flex-wrap:wrap; gap:8px}
  button.word-chip{
    font:inherit; font-size:13px; font-weight:600; background:var(--sand); color:var(--ink);
    border:1.5px solid var(--sand-deep); border-radius:8px; padding:8px 12px; cursor:pointer;
    width:auto; min-height:44px; display:inline-flex; align-items:center;
  }
  button.word-chip[aria-pressed="true"]{border-color:var(--shell); background:var(--shell-soft)}
  button.word-chip:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  .word-def{margin-top:10px; font-size:15px; color:var(--ink)}
  .no-words{font-size:14px; color:var(--ink-soft)}
  @media (max-width:380px){
    .hero h1{font-size:28px}
    .mod-status{font-size:12px}
  }
</style>
</head>
<body>

      <div>
        <div class="logo">FinLit</div>

        <p>Learn money, one island at a time.</p>

    </div>

    <div class="prog-label">

    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <main id="main"></main>
</div>

const JOURNEY_MODULES = FL.PLANNED_TOTAL; // full planned course; progress counts built modules only

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function setText(id, text){
  const el = document.getElementById(id);
  if(el) el.textContent = text;
}
/* =====================================================================
   LOAD PROGRESS FROM ALL MODULE STATES
   Reads modN-state (window.storage, then localStorage). Older saves that
   used mastered/passed still count. XP is a running total inside each
   module, so the hub shows the highest value.
===================================================================== */
/* progress loading lives in finlit-core.js (FL.courseProgress) */

/* =====================================================================
   RENDER
===================================================================== */
async function render(){
  const mainEl = document.getElementById("main");
  if(!mainEl) return;
  // XP is added up across modules by the shared engine (finlit-core.js),
  // including a one-time starting balance carried over from older saves.
  let totalXP = 0, progress = {};
  try{ ({ totalXP, progress } = await FL.courseProgress(MODULES)); }catch(e){ totalXP = 0; progress = {}; }

  let totalMastered = 0, allWords = [];
  MODULES.forEach(mod=>{
    const p = progress[mod.id];
    if(!p) return;
    if(p.mastered) totalMastered++;
    (p.shelf || []).forEach(w=>{ if(!allWords.includes(w)) allWords.push(w); });
  });

  setText("xpBadge", totalXP + " XP");
  // Progress is measured against the modules that exist; the rest of the roadmap is shown separately.
  const available = MODULES.length, planned = Math.max(0, JOURNEY_MODULES - available);
  setText("progText", totalMastered + " of " + available + " modules" + (planned ? " · " + planned + " more planned" : ""));
  const progFill = document.getElementById("progFill");
  if(progFill) progFill.style.width = (available ? totalMastered / available * 100 : 0).toFixed(1) + "%";

  const blocks = {};
  MODULES.forEach(mod=>{
    if(!blocks[mod.block]) blocks[mod.block]=[];
    blocks[mod.block].push(mod);
  });

  let html = "";

  html += '<div class="words-wrap"><div class="words-label">Words you own</div><div class="words-row">';
  if(allWords.length===0){
    html += '<span class="no-words">Complete a lesson to earn your first word.</span>';
  } else {
    allWords.forEach(w=>{
      const entry = VOCAB[w];
      const label = entry && entry.term ? entry.term : w;
      html += '<button type="button" class="word-chip" data-key="'+esc(w)+'" aria-pressed="false">'+esc(label)+'</button>';
    });
  }
  html += '</div><p class="word-def" id="wordDef" hidden></p></div>';

  Object.entries(blocks).forEach(([blockName, mods])=>{
    html += '<div class="block-label">'+esc(blockName)+'</div>';
    mods.forEach(mod=>{
      const p = progress[mod.id];
      const mastered = !!(p && p.mastered);
      const started = !!(p && (p.lessonsDown > 0 || p.started));
      const prev = progress[mod.id - 1];
      const prevMastered = mod.id === 1 || !!(prev && prev.mastered);
      const locked = !!(mod.comingSoon || (mod.id > 1 && !mastered && !prevMastered && !started));
      const isActive = !mastered && !locked;
      const statusIcon = mastered ? "✅ Done" : locked ? "🔒 Locked" : started ? "▶ Continue" : "▶ Start";
      const cardClass = mastered ? "done" : locked ? "locked" : isActive ? "active" : "";
      const title = "Module " + mod.id + " · " + mod.title;

      let inner = '<div class="mod-inner">'+
        '<div class="mod-icon '+cardClass+'">'+mod.emoji+'</div>'+
        '<div class="mod-info">'+
          '<div class="mod-title">'+esc(title)+'</div>'+
          '<div class="mod-sub">'+esc(mod.sub)+'</div>';

      if(isActive && p && Array.isArray(p.done)){
        inner += '<div class="mod-dots" aria-hidden="true">';
        for(let i=0;i<mod.lessons;i++){
          inner += '<div class="mod-dot'+(p.done[i] ? " on" : "")+'"></div>';
        }
        inner += '</div>';
      }
      inner += '</div><div class="mod-status '+cardClass+'">'+statusIcon+'</div></div>';

      if(locked || mod.comingSoon){
        html += '<div class="mod-card locked" aria-disabled="true">'+inner+'</div>';
        return;
      }
      html += '<a href="'+esc(mod.file)+'" class="mod-card '+cardClass+'">'+inner+'</a>';
    });
  });

  // Coming soon teaser
  html += '<div class="coming"><strong>More modules coming soon</strong>Module 40 is next — a new block begins. Check back soon!</div>';

  mainEl.innerHTML = html;
  const defEl = document.getElementById("wordDef");
  mainEl.querySelectorAll(".word-chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!defEl) return;
      const key = btn.getAttribute("data-key") || "";
      const entry = VOCAB[key];
      const open = btn.getAttribute("aria-pressed") === "true";
      mainEl.querySelectorAll(".word-chip").forEach(b=>b.setAttribute("aria-pressed","false"));
      if(open){
        defEl.hidden = true;
        defEl.textContent = "";
        return;
      }
      btn.setAttribute("aria-pressed","true");
      const label = entry && entry.term ? entry.term : key;
      const meaning = entry && entry.def ? entry.def : "You earned this word in a lesson.";
      defEl.hidden = false;
      defEl.textContent = label + " — " + meaning;
    });
  });
}

render();
</script>
</body>
</html>
