  html,body{overflow-x:clip}

</style>

<script>
const MODULE_N = 39;
/* =====================================================================
   CONTENT — Module 39: The Risk Challenge (Risk & Insurance finale)
   Vocab: policy, coverage.
   Two quick concept lessons (what a policy is; reading what is and is
   NOT covered), then a storm-season challenge that uses every tool
   from the block: reduce risk, an emergency fund big enough for the
   deductible, spotting a fake insurance seller, an honest claim, and
   knowing when something is simply not covered.
   Same challenge engine as M24/M29/M34: only the correct choice
   advances; first-try picks earn a star and fill a readiness bar.
===================================================================== */
const VOCAB = {
  policy:{term:"policy", def:"The written agreement with your insurance. It lists the premium, the deductible, and exactly what is covered — and what is not."},
  coverage:{term:"coverage", def:"What your insurance policy will pay for. Anything not in the coverage, you pay for yourself — so read it before you need it."}
};

const QUESTIONS = {
  "q391a":{type:"mc", prompt:"What is an insurance policy?", concept:"policy", opts:[
    {t:"The written agreement that lists the premium, deductible, and what is covered", ok:true, fb:"Right. It is the rulebook for your insurance. Everything is in writing."},
    {t:"A promise someone makes out loud", ok:false, fb:"A real policy is written down. If it is only spoken, you have nothing to show later."},
    {t:"The money you get after a loss", ok:false, fb:"That is what a claim pays. The policy is the written agreement behind it."}]},
  "q391b":{type:"mc", prompt:"What does coverage mean?", concept:"coverage", opts:[
    {t:"What the policy will pay for", ok:true, fb:"Right. If it is covered, a claim can be paid. If not, it is on you."},
    {t:"The cover on the front of the policy paper", ok:false, fb:"Ha — not quite! Coverage is what the policy will actually pay for."},
    {t:"Every possible loss, always", ok:false, fb:"No policy covers everything. That is why you read what is and is not covered."}]},
  "q391c":{type:"tf", prompt:"True or false: insurance only pays for losses that are in your coverage.", answer:true, concept:"coverage",
    good:"Right. Only what is in the coverage gets paid. Everything else is yours — read the policy before you need it.",
    bad:"It is true. Only losses in your coverage are paid. Things like a rope wearing out with age usually are not."},
  "q392a":{type:"mc", prompt:"Kai’s policy covers storm damage but NOT things wearing out with age. His five-year-old rope frays. Will a claim be paid?", concept:"coverage", opts:[
    {t:"No — wearing out with age is not in his coverage", ok:true, fb:"Right. Old things wearing out are expected. That belongs in the budget, not an insurance claim."},
    {t:"Yes — the policy is for his boat, so it pays for everything on it", ok:false, fb:"Only what the policy covers. Wear and tear is listed as NOT covered."},
    {t:"Yes, if he says a storm did it", ok:false, fb:"That would be a dishonest claim — against the rules, and unfair to everyone in the pot."}]},
  "q392b":{type:"mc", prompt:"A man at the dock says: “Buy my Super Storm Insurance now — cash only, today only, no paperwork!” What is the biggest warning sign?", concept:"policy", opts:[
    {t:"No written policy — plus he is rushing you", ok:true, fb:"Right. Real insurance comes with a written policy. No paper plus “today only” are scam signs from Module 23."},
    {t:"He is selling insurance at all", ok:false, fb:"Real insurance does get sold. The problem is no written policy and a rush."},
    {t:"Nothing — cash today is fine, since a good deal will not last long", ok:false, fb:"No written policy means nothing to show when you need to claim. And the rush is a classic scam sign."}]},
  "q393a":{type:"mc", prompt:"Which tool from this block should be big enough to pay your deductible?", concept:"policy", opts:[
    {t:"Your emergency fund", ok:true, fb:"Right. The fund pays your part; insurance pays the rest. They work as a team."},
    {t:"Your cushion — the few dollars you keep in checking", ok:false, fb:"The cushion is just a few dollars in checking to prevent overdrafts. The emergency fund is for surprises like this."},
    {t:"A credit card", ok:false, fb:"That turns a surprise into debt. The emergency fund is built for exactly this."}]},
  "q393b":{type:"mc", transfer:true, prompt:"Mika buys a phone that comes with a paper saying: “We repair it free for one year if it stops working. Dropping it is not included.” She drops it. Is the repair free?", concept:"coverage", opts:[
    {t:"No — drops are not in the coverage, even though she has the paper", ok:true, fb:"Exactly. Different paper, same shape as Kai’s policy: what is covered, and what is not. Reading it first saves surprises."},
    {t:"Yes — she has the paper, so everything is free", ok:false, fb:"The paper says drops are NOT included. Having coverage is not the same as covering everything."},
    {t:"Yes, if she says it just stopped working", ok:false, fb:"That would be dishonest. The truth matters — and the paper was clear."}]}
};

const CFG = {
  n:39, title:"The Risk Challenge", homeSub:"Four short lessons. Read the policy, then get ready for the big storm season.",
  pool:["q391a","q391b","q391c","q392a","q392b","q393a"], transfer:"q393b",
  quest:"You read a policy, sorted covered from not covered, and got ready for the big storm season using every tool in the block.",
  failKeys:"The keys: a policy is the written agreement, coverage is what it will pay for (not everything), your emergency fund covers the deductible, and real insurance always comes in writing.",

const M = document.getElementById("main");

/* Back: replay the previous step. Steps revisited this way give no extra XP. */
const _far = {}; let _replay = false, _inLesson = false;
function back(){ if(S.lesson!==3 && S.step>0){ S.step--; saveState(); render(); } }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); if(!d) return; d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  _inLesson = true;
  { const f=_far[S.lesson]||0; _replay = S.step < f; _far[S.lesson]=Math.max(f, S.step); }
  FL.checkpoint(S, LESSONS); saveState();
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  FL.lessonDone(S); saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  [...q.opts.keys()].sort(()=>Math.random()-.5).forEach(i=>{ html+='<button class="opt" data-i="'+i+'">'+q.opts[i].t+'</button>'; }); /* shuffled so the right answer isn't always first */
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. '+CFG.failKeys+'</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:META[0].title, sub:META[0].sub, steps:L1, emoji:META[0].emoji},
  {title:META[1].title, sub:META[1].sub, steps:L2, emoji:META[1].emoji},
  {title:META[2].title, sub:META[2].sub, steps:L3, emoji:META[2].emoji},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){ _inLesson = false;
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module '+CFG.n+'</div><h1 class="display">'+CFG.title+'</h1>'+
    '<p class="muted">'+CFG.homeSub+'</p>';
  html+=FL.resumeCard(S, LESSONS);
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module '+CFG.n+' mastered · '+S.xp+' XP earned here</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'module-38-claims-and-deductibles.html\'">← Module 38</button>';
  html+='<button class="btn-ghost" style="margin-top:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ FL.startLesson(S, i); saveState(); render(); }


/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a",TUTOR_HELLO);
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys=TUTOR_SYS;
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=FL.displayXP(S)+" XP";
  renderShelf();
  goHome();
})();
</script>
