<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings vs. Checking — Module 19</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
  :root{
    --ink:#123a3f; --ink-soft:#3d6166; --lagoon:#ecf5f2; --card:#ffffff;
    --sand:#f3ead8; --sand-deep:#e5d7bc; --shell:#c96f4a; --shell-soft:#f4e0d6;
    --night:#0e1b2c; --gold:#e8b84b; --good:#2e7d5b; --bad:#a94436;
    --radius:14px; --shadow:0 2px 10px rgba(18,58,63,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--lagoon); color:var(--ink); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .display{font-family:"Fraunces",Georgia,serif; font-weight:700; letter-spacing:-.01em}
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
  header{position:sticky; top:0; z-index:20; background:var(--lagoon); padding:12px 16px 8px; border-bottom:1px solid #d9e6e1}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .xp{font-weight:700; font-size:14px; background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; white-space:nowrap}
  .dots{display:flex; gap:6px}
  .dot{width:9px; height:9px; border-radius:50%; background:#cfe0da; transition:background .3s}
  .dot.on{background:var(--shell)}
  .shelf{display:flex; gap:8px; margin-top:8px; min-height:30px; flex-wrap:wrap}
  .shelf-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); align-self:center}
  .word-chip{font-size:13px; font-weight:600; background:var(--sand); border:1.5px solid var(--sand-deep); border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .word-chip:focus-visible{outline:3px solid var(--shell)}
  main{flex:1; padding:20px 16px 110px}
  .screen{display:none; animation:fade .35s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  h1{font-size:30px; line-height:1.15; margin-bottom:6px}
  h2{font-size:22px; line-height:1.2; margin-bottom:10px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--shell); font-weight:700; margin-bottom:8px}
  p{margin-bottom:12px}
  .muted{color:var(--ink-soft); font-size:15px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .recap{background:#f0ebe1; border-left:4px solid var(--shell); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:14px; font-size:14px}
  .scene{background:linear-gradient(180deg,#bfe0d6 0%, #e9dfc6 78%, #dcc9a2 100%); border-radius:var(--radius); padding:26px 20px; text-align:center; margin-bottom:16px; font-size:44px; line-height:1.2; box-shadow:var(--shadow)}
  .scene .cap{font-size:15px; color:var(--ink); margin-top:8px}
  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 18px; background:var(--ink); color:#fff; font-weight:700; width:100%}
  button:focus-visible{outline:3px solid var(--shell); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}
  .btn-ghost{background:transparent; color:var(--ink); border:2px solid var(--ink)}
  .btn-row{display:flex; gap:10px}
  .opt{display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:2px solid #d9e2de; font-weight:600; margin-bottom:10px; border-radius:12px; padding:14px 16px}
  .opt .em{font-size:26px; margin-right:10px; vertical-align:-3px}
  .opt.right{border-color:var(--good); background:#eef7f2}
  .opt.wrong{border-color:var(--bad); background:#faf0ee}
  .feedback{border-left:4px solid var(--ink); background:var(--sand); border-radius:0 10px 10px 0; padding:12px 14px; margin:10px 0 14px; font-size:15px}
  .feedback.good{border-color:var(--good)}
  .feedback.bad{border-color:var(--bad)}
  .cut-viz{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:16px; text-align:center; margin-bottom:12px; font-size:30px}
  .cut-viz .n{font-size:14px; color:var(--ink-soft); font-weight:600; margin-top:4px}
  .modal-bg{position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; z-index:40; align-items:center; justify-content:center; padding:24px}
  .modal-bg.on{display:flex}
  .word-card{background:var(--sand); border-radius:18px; padding:28px 24px; max-width:380px; width:100%; text-align:center; border:3px solid var(--sand-deep); animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(80deg); opacity:0} to{transform:none; opacity:1}}
  .word-card .w{font-size:34px; margin-bottom:8px}
  .word-card .d{font-size:17px; color:var(--ink)}
  #tutorBtn{position:fixed; right:16px; bottom:16px; width:auto; z-index:30; border-radius:999px; padding:13px 18px; background:var(--shell); box-shadow:0 4px 14px rgba(201,111,74,.4); font-size:15px}
  .modal-overlay{position:fixed; inset:0; background:rgba(14,27,44,.65); z-index:49; display:none}
  .modal-overlay.on{display:block}
  #tutorPanel{position:fixed; inset:auto 0 0 0; max-width:560px; margin:0 auto; height:78dvh; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -6px 30px rgba(14,27,44,.25); z-index:50; display:none; flex-direction:column}
  #tutorPanel.on{display:flex}
  .tp-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee}
  .tp-head button{width:auto; padding:10px 16px; font-size:15px; background:var(--shell); color:#fff; font-weight:700; border-radius:8px}
  #tlog{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:86%; padding:10px 14px; border-radius:14px; font-size:15px}
  .msg.u{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--sand); border-bottom-left-radius:4px}
  .tp-quick{display:flex; gap:8px; padding:0 16px 8px; flex-wrap:wrap}
  .tp-quick button{width:auto; font-size:13px; padding:7px 12px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px}
  .tp-in{display:flex; gap:8px; padding:10px 16px 18px; border-top:1px solid #eee}
  .tp-in input{flex:1; font:inherit; padding:12px 14px; border:2px solid #d9e2de; border-radius:12px}
  .tp-in button{width:auto; padding:12px 16px}
  .night{background:linear-gradient(180deg,#0e1b2c 0%, #1b3247 100%); color:#fff; border-radius:var(--radius); padding:34px 22px; text-align:center; margin-bottom:16px}
  .lantern{font-size:56px; animation:glow 2.2s ease infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 22px var(--gold))}}
  .acct{background:linear-gradient(135deg,#123a3f 0%,#1b3247 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,58,63,.25)}
  .acct .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .acct .bal{font-size:42px; font-weight:700; font-family:"Fraunces",Georgia,serif; margin:2px 0}
  .acct .who{font-size:14px; opacity:.8}
  .txn{background:#fff; border:2px solid #d9e2de; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:15px; animation:fade .3s ease}
  .txn .amt{font-weight:700; color:var(--good); white-space:nowrap}
  .txn .amt.out{color:var(--bad)}
  .txn-empty{color:var(--ink-soft); font-size:15px; font-style:italic; padding:10px 0}
  .tin{background:var(--sand); border:2px dashed var(--sand-deep); border-radius:14px; padding:16px; text-align:center; margin-bottom:12px}
  .tin .n{font-size:14px; color:var(--ink-soft); margin-top:4px}
  .ledger{background:#fff; border:2px solid #d9e2de; border-radius:14px; overflow:hidden; margin-bottom:12px}
  .lrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid #eef2f0; font-size:15px}
  .lrow:last-child{border-bottom:none}
  .lrow.head{background:var(--sand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .lrow .run{font-weight:700; font-family:"Fraunces",Georgia,serif; white-space:nowrap}
  .lrow .mv{font-weight:700; white-space:nowrap; color:var(--good)}
  .lrow .mv.out{color:var(--bad)}
  .lrow.pending{background:#fffdf5}
  .duo{display:flex; gap:10px; margin-bottom:14px}
  .duo .acct{flex:1; margin-bottom:0; padding:16px 13px}
  .duo .acct .bal{font-size:29px}
  .duo .acct .lbl{font-size:10px}
  .duo .acct .who{font-size:12px; opacity:.75}
  .acct.save{background:linear-gradient(135deg,#2e7d5b 0%,#1b5540 100%)}
  .sortbar{display:flex; gap:10px; margin-bottom:12px}
  .sortbar button{flex:1; font-size:15px; padding:14px 8px}
  .sortbar .chk{background:var(--ink)}
  .sortbar .sav{background:var(--good)}
  .item{background:#fff; border:2px solid #d9e2de; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:12px; font-size:18px; font-weight:600}
  .item .sub{font-size:14px; font-weight:400; color:var(--ink-soft); margin-top:4px}
  .spin{display:inline-block; width:16px; height:16px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="dots" id="dots"></div>
      <div class="xp" id="xpBox">0 XP</div>
    </div>
    <div class="shelf" id="shelf"><span class="shelf-label">Words you own:</span></div>
  </header>
  <main id="main"></main>
</div>

<button id="tutorBtn" aria-label="Ask the tutor">Ask the tutor 💬</button>
<div class="modal-overlay" id="tutorOverlay" onclick="if(event.target===this)toggleTutor(false)"></div>
<div id="tutorPanel" role="dialog" aria-label="Tutor chat">
  <div class="tp-head"><strong class="display">Tutor</strong><button onclick="toggleTutor(false)">✕ Close</button></div>
  <div id="tlog"></div>
  <div class="tp-quick">
    <button onclick="quickAsk('Explain it differently')">Explain differently</button>
    <button onclick="quickAsk('Make it easier')">Make it easier</button>
    <button onclick="quickAsk('Give me an example')">Give example</button>
    <button onclick="quickAsk('Quiz me')">Quiz me</button>
  </div>
  <div class="tp-in">
    <input id="tin" placeholder="Ask about the two accounts…" onkeydown="if(event.key==='Enter')sendTutor()">
    <button onclick="sendTutor()">Send</button>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="word-card" id="wordCard"></div>
</div>

<script>
/* =====================================================================
   CONTENT — Module 19: Savings vs. Checking
   Vocab: checking, savings (as account types).
   IMPORTANT: the distinction is taught WITHOUT interest (that is M21).
   The honest non-interest reasons are protection and clarity:
   goal money kept separate does not get spent by accident.
===================================================================== */
const VOCAB = {
  checking:{term:"checking", def:"The account for money you will spend soon — food, rope, everyday things. Easy to reach on purpose."},
  savings:{term:"savings", def:"The account for money you are keeping for a goal. Kept separate so you do not spend it by accident."}
};

const QUESTIONS = {
  "q191a":{type:"mc", prompt:"What is a checking account for?", concept:"checking", opts:[
    {t:"Money you will spend soon", ok:true, fb:"Right. Food, rope, this week's things. Checking is the account you actually reach into."},
    {t:"Money you are keeping for a big goal", ok:false, fb:"That is what savings is for. Checking holds the money you will spend soon."},
    {t:"Money you never touch again", ok:false, fb:"The opposite! Checking is the easy-to-reach account — it is meant to be used."}]},
  "q191b":{type:"mc", prompt:"What is a savings account for?", concept:"savings", opts:[
    {t:"Money you are keeping for a goal", ok:true, fb:"Right — Module 11's goal money, now with its own home so it stays safe from everyday spending."},
    {t:"Money for today's lunch", ok:false, fb:"Lunch money is spend-soon money — that belongs in checking. Savings is for goals."},
    {t:"Money that belongs to the bank", ok:false, fb:"Never! Both accounts hold YOUR money. Savings just keeps goal money separate."}]},
  "q192a":{type:"mc", prompt:"Kai is saving for a sail he will buy in a few months. Which account?", concept:"savings", opts:[
    {t:"Savings", ok:true, fb:"Right — it is goal money, and months away. Savings keeps it out of reach of everyday spending."},
    {t:"Checking", ok:false, fb:"Careful. Checking is easy to reach, which is exactly the danger for goal money — it gets spent bit by bit."},
    {t:"Neither — keep it in the tin", ok:false, fb:"Module 17 settled the tin! Goal money goes in savings, where it is safe and separate."}]},
  "q192b":{type:"tf", prompt:"True or false: you should keep ALL your money in savings so you never spend any of it.", answer:false, concept:"checking",
    good:"Right — you still need money for food and everyday things. The point is not to stop spending; it is to keep goal money separate from spending money.",
    bad:"Think about eating this week! You need spendable money in checking. Savings is only for the money you are holding toward a goal."},
  "q193a":{type:"mc", prompt:"Why keep goal money in a separate savings account?", concept:"savings", opts:[
    {t:"So it does not get spent by accident, a little at a time", ok:true, fb:"Right. Money that is easy to reach gets reached for. Separating it protects the goal — exactly what went wrong for Kai in Module 10."},
    {t:"Because the bank requires two accounts", ok:false, fb:"No rule forces it. You do it because separated money is far less likely to be spent by accident."},
    {t:"So the bank cannot see it", ok:false, fb:"The bank records both accounts. The separation is to protect the money from YOU on a weak moment — not to hide it."}]},
  "q193c":{type:"mc", prompt:"Kai has $25. He needs $10 for this week and is saving $15 toward a sail. How should he split it?", concept:"checking", opts:[
    {t:"$10 in checking, $15 in savings", ok:true, fb:"Right — spend-soon money goes where it is easy to reach; goal money goes where it is protected."},
    {t:"$25 all in checking", ok:false, fb:"Then the sail money sits right next to the snack money, and you can guess how that ends. Split it: $10 checking, $15 savings."},
    {t:"$25 all in savings", ok:false, fb:"Then he cannot buy food this week without raiding the goal. Keep $10 in checking for the week, $15 in savings."}]},
  "q193b":{type:"mc", transfer:true, prompt:"Rana keeps stall money in one jar and house-repair money in a different jar. Is that the same idea?", concept:"savings", opts:[
    {t:"Yes — money separated by the job it has to do", ok:true, fb:"Exactly. Two jars, two accounts, same thinking: money with different jobs is kept apart so neither gets eaten by the other. You do not need a bank to use the idea."},
    {t:"No — jars are nothing like accounts", ok:false, fb:"The container changed, not the idea. Rana is doing exactly what checking and savings do: keeping money separated by purpose."},
    {t:"No — money should always be in one place", ok:false, fb:"One pile is how goal money disappears. Rana keeps repair money apart on purpose, and that is the same reason savings exists."}]}
};

/* =====================================================================
   STATE + PERSISTENCE
===================================================================== */
let S = { xp:0, shelf:[], lesson:0, step:0, firstTry:{}, done:[false,false,false,false], masteryPassed:false,
          acct:{checking:0, savings:0} };

async function loadState(){
  try{
    const r = await window.storage.get("mod19-state");
    if(r && r.value){ S = Object.assign(S, JSON.parse(r.value)); return; }
  } catch(e){ }
  try{
    const saved = localStorage.getItem("mod19-state");
    if(saved){ S = Object.assign(S, JSON.parse(saved)); }
    for(let i=18;i>=1;i--){
      const prev = localStorage.getItem("mod"+i+"-state");
      if(prev){ const p = JSON.parse(prev); if(p.xp > S.xp) S.xp = p.xp; }
    }
  } catch(e){ }
}
async function saveState(){
  try{ await window.storage.set("mod19-state", JSON.stringify(S)); }catch(e){
    try{ localStorage.setItem("mod19-state", JSON.stringify(S)); }catch(e2){}
  }
}
function addXP(n){ S.xp+=n; document.getElementById("xpBox").textContent = S.xp+" XP"; saveState(); }
function earnWord(k){
  if(S.shelf.includes(k)) return;
  S.shelf.push(k); renderShelf(); saveState();
  showWordCard(k);
}
function renderShelf(){
  const el=document.getElementById("shelf");
  el.innerHTML='<span class="shelf-label">Words you own:</span>';
  S.shelf.forEach(k=>{
    if(!VOCAB[k]) return;
    const b=document.createElement("button"); b.className="word-chip"; b.textContent=VOCAB[k].term;
    b.onclick=()=>showWordCard(k); el.appendChild(b);
  });
}
function showWordCard(k){
  const v=VOCAB[k]; if(!v) return;
  document.getElementById("wordCard").innerHTML =
    '<div class="w display">'+v.term+'</div><div class="d">'+v.def+'</div>' +
    '<button style="margin-top:18px" onclick="closeModal()">Got it</button>';
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* =====================================================================
   SCREEN ENGINE
===================================================================== */
const M = document.getElementById("main");
function show(html){ M.innerHTML='<div class="screen on">'+html+'</div>'; window.scrollTo(0,0); }
function revealFB(){ setTimeout(function(){
  var ids=["cont","c2","fb","fb2"];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el && el.innerHTML && el.innerHTML.trim()){
      if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"nearest"});
      return;
    }
  }
},80); }
function dots(n,i){
  const d=document.getElementById("dots"); d.innerHTML="";
  for(let k=0;k<n;k++){const s=document.createElement("span");s.className="dot"+(k<=i?" on":"");d.appendChild(s);}
}
function next(){ S.step++; saveState(); render(); }
function render(){
  const les=LESSONS[S.lesson];
  dots(les.steps.length, S.step);
  if(S.step>=les.steps.length){ lessonComplete(); return; }
  les.steps[S.step]();
}
function lessonComplete(){
  if(!S.done[S.lesson]){ S.done[S.lesson]=true; addXP(10); }
  saveState();
  goHome();
}
function renderMC(qid, onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Question</div><h2 class="display">'+q.prompt+'</h2><div id="opts">';
  q.opts.forEach((o,i)=>{ html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'; });
  html+='</div><div id="fb"></div><div id="cont"></div>';
  show(html);
  let answered=false, firstShot=!(qid in S.firstTry);
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i, o=q.opts[i];
      if(answered && o.ok===false) return;
      btn.classList.add(o.ok?"right":"wrong");
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      revealFB();
      if(o.ok){
        if(firstShot && !answered){ S.firstTry[qid]=true; addXP(2); }
        answered=true;
        document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>';
        revealFB();
        window._c=()=>onDone;
      } else { answered=true; S.firstTry[qid]=false; }
      saveState();
    };
  });
}
function renderTF(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">True or false</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let firstShot=!(qid in S.firstTry), answered=false;
  function pick(val,el){
    const ok = (val===q.answer);
    el.classList.add(ok?"right":"wrong");
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    revealFB();
    if(ok){
      if(firstShot && !answered){S.firstTry[qid]=true; addXP(2);}
      document.getElementById("tT").disabled=true; document.getElementById("tF").disabled=true;
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    } else { S.firstTry[qid]=false; }
    answered=true; saveState();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}

/* =====================================================================
   SIMULATOR — M19 splits the single account into TWO.
   Checking (spend soon) and Savings (goal). No interest: the reason
   savings is different here is protection, not growth. M21 adds growth.
===================================================================== */
function money(n){ return "$" + n.toFixed(2); }
function duoCard(){
  return '<div class="duo">'+
    '<div class="acct"><div class="lbl">Checking</div><div class="bal" id="chkNum">'+money(S.acct.checking)+'</div><div class="who">spend soon</div></div>'+
    '<div class="acct save"><div class="lbl">Savings</div><div class="bal" id="savNum">'+money(S.acct.savings)+'</div><div class="who">for the goal</div></div>'+
    '</div>';
}
function paintDuo(){
  var c=document.getElementById("chkNum"), v=document.getElementById("savNum");
  if(c) c.textContent=money(S.acct.checking);
  if(v) v.textContent=money(S.acct.savings);
}
function putIn(which, amt){
  S.acct[which] = Math.round((S.acct[which]+amt)*100)/100;
  saveState(); paintDuo();
}
function resetAcct(){ S.acct={checking:0, savings:0}; saveState(); }

/* =====================================================================
   LESSON 1 — The Clerk's Question
===================================================================== */
const L1=[
  ()=>show('<div class="kicker">Lesson 1 · The clerk\'s question</div>'+
    '<div class="recap"><strong>Kai\'s story so far:</strong> The slip makes sense now. Then the clerk asks something Kai has no answer for.</div>'+
    '<div class="scene">🧑🏽‍💼❓<div class="cap">"Is this money for spending soon, or for keeping a while?"</div></div>'+
    '<button onclick="next()">Does it matter?</button>'),
  ()=>show('<div class="kicker">Lesson 1</div>'+
    '<div class="card"><p>It matters more than Kai expects.</p>'+
    '<p>Think about the $25. Some of it is for <strong>this week</strong> — food, rope, small things. Some of it is for the <strong>sail</strong> Kai wants in a few months.</p>'+
    '<p>Same money. Completely different jobs.</p>'+
    '<p>So the bank offers two accounts, one for each job. The everyday one is called <strong>checking</strong>.</p></div>'+
    '<button onclick="earnWord(\'checking\');next()">New word: checking</button>'),
  ()=>show('<div class="kicker">Lesson 1</div>'+
    '<div class="card"><p>The other one is <strong>savings</strong> — the account for money you are keeping toward a goal.</p>'+
    '<p>Here is the honest reason it helps, and it is not a trick: <strong>money that is easy to reach gets reached for.</strong></p>'+
    '<p>Remember Module 10, when Kai came up $1 short because the money had leaked away on small things? Savings is the fix. Goal money sits somewhere separate, so a weak moment on a Tuesday cannot quietly eat the sail.</p></div>'+
    '<button onclick="earnWord(\'savings\');next()">New word: savings</button>'),
  ()=>renderMC("q191a", next),
  ()=>renderMC("q191b", next),
];

/* =====================================================================
   LESSON 2 — Which Home? (sorting game)
===================================================================== */
const SORT_ITEMS=[
  {label:"Rope for tomorrow", sub:"Kai needs it in the morning", right:"checking",
   why:"Tomorrow is soon. Spend-soon money lives in checking."},
  {label:"$15 toward a sail", sub:"He wants it in a few months", right:"savings",
   why:"Months away, and it is a goal. Savings keeps it protected."},
  {label:"This week\'s food money", sub:"Fruit, fish, bread", right:"checking",
   why:"You will spend it within days — it needs to be easy to reach."},
  {label:"Money for a boat one day", sub:"A long way off, but he is serious", right:"savings",
   why:"A far-off goal is exactly what savings is built for."},
  {label:"Money he might need any day", sub:"Nets tear without warning", right:"checking",
   why:"If you might need it any day, it has to be reachable. That is checking."}
];
const L2=[
  ()=>show('<div class="kicker">Lesson 2 · Which home?</div>'+
    '<div class="recap"><strong>So far:</strong> checking for spend-soon, savings for goals.</div>'+
    '<div class="card"><p>Five pieces of money. One question each: <strong>will this be spent soon, or is it being kept?</strong></p>'+
    '<p>Answer that and the account picks itself.</p></div>'+
    '<button onclick="next()">Start sorting</button>'),
  ()=>{
    let i=0;
    function draw(){
      if(i>=SORT_ITEMS.length){ addXP(6); next(); return; }
      const it=SORT_ITEMS[i];
      show('<div class="kicker">Sorting · '+(i+1)+' of '+SORT_ITEMS.length+'</div>'+
        '<div class="item">'+it.label+'<div class="sub">'+it.sub+'</div></div>'+
        '<h2 class="display" style="text-align:center; font-size:19px">Which account?</h2>'+
        '<div class="sortbar"><button class="chk" data-v="checking">Checking</button>'+
        '<button class="sav" data-v="savings">Savings</button></div>'+
        '<div id="fb"></div><div id="cont"></div>');
      let answered=false;
      document.querySelectorAll(".sortbar button").forEach(function(btn){
        btn.onclick=function(){
          const ok = btn.dataset.v===it.right;
          if(answered && !ok) return;
          document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+
            (ok?'Right — '+it.why : 'Not quite. '+it.why+' Try again.')+'</div>';
          revealFB();
          if(ok){
            answered=true; addXP(2);
            document.querySelectorAll(".sortbar button").forEach(function(b){b.disabled=true;});
            document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(i<SORT_ITEMS.length-1?"Next":"Done")+'</button>';
            revealFB();
            window._n=function(){ i++; draw(); };
          } else { answered=true; }
        };
      });
    }
    draw();
  },
  ()=>renderMC("q192a", next),
  ()=>renderTF("q192b", next),
];

/* =====================================================================
   LESSON 3 — Splitting the $25 (simulator)
===================================================================== */
const SPLIT_STEPS=[
  {amt:10, which:"checking", say:"Kai works out he needs about $10 for food and rope this week.",
   after:"$10 into checking — reachable, because he will actually need it."},
  {amt:15, which:"savings", say:"The other $15 is sail money. It must survive until the sail is bought.",
   after:"$15 into savings — separate, protected, and not sitting next to the snack money."}
];
const L3=[
  ()=>{ resetAcct();
    show('<div class="kicker">Lesson 3 · Splitting the $25</div>'+
      '<div class="recap"><strong>So far:</strong> Kai can tell spend-soon money from goal money.</div>'+
      duoCard()+
      '<div class="card"><p>Both accounts start empty. Kai has <strong>$25</strong> to place.</p>'+
      '<p>He does not split it evenly, or by feel. He splits it by <strong>job</strong>.</p></div>'+
      '<button onclick="next()">Place the money</button>'); },
  ()=>{
    let i=0;
    function draw(){
      if(i>=SPLIT_STEPS.length){ addXP(4); next(); return; }
      const st=SPLIT_STEPS[i];
      show('<div class="kicker">Placing · '+(i+1)+' of '+SPLIT_STEPS.length+'</div>'+
        duoCard()+
        '<div class="card"><p>'+st.say+'</p></div>'+
        '<h2 class="display" style="text-align:center; font-size:19px">Where does '+money(st.amt)+' go?</h2>'+
        '<div class="sortbar"><button class="chk" data-v="checking">Checking</button>'+
        '<button class="sav" data-v="savings">Savings</button></div>'+
        '<div id="fb"></div><div id="cont"></div>');
      let answered=false;
      document.querySelectorAll(".sortbar button").forEach(function(btn){
        btn.onclick=function(){
          const ok = btn.dataset.v===st.which;
          if(answered && !ok) return;
          if(ok){
            putIn(st.which, st.amt);
            answered=true; addXP(2);
            document.querySelectorAll(".sortbar button").forEach(function(b){b.disabled=true;});
            document.getElementById("fb").innerHTML='<div class="feedback good">'+st.after+'</div>';
            document.getElementById("cont").innerHTML='<button onclick="window._n()">'+(i<SPLIT_STEPS.length-1?"Next":"Done")+'</button>';
            revealFB();
            window._n=function(){ i++; draw(); };
          } else {
            answered=true;
            document.getElementById("fb").innerHTML='<div class="feedback bad">Think about the job this money has to do. '+st.say+' Try again.</div>';
            revealFB();
          }
        };
      });
    }
    draw();
  },
  ()=>show('<div class="kicker">Lesson 3 · The result</div>'+
    duoCard()+
    '<div class="card"><p>Same $25. But now Kai can answer two different questions instantly:</p>'+
    '<p><strong>"Can I buy this?"</strong> — check the checking balance. That is what is actually spendable.</p>'+
    '<p><strong>"How is the sail coming?"</strong> — check savings. Nothing else is mixed in, so the number means something.</p>'+
    '<p>One pile could never answer both.</p></div>'+
    '<button onclick="next()">Practice</button>'),
  ()=>renderMC("q193a", next),
  ()=>renderMC("q193c", next),
];

/* =====================================================================
   LESSON 4 — Mastery
===================================================================== */
let mastery = {qs:[], idx:0, score:0};
const L4=[
  ()=>{
    const pool=["q191a","q191b","q192a","q192b","q193a","q193c"].sort(()=>Math.random()-.5).slice(0,4);
    mastery={qs:[...pool,"q193b"].sort(()=>Math.random()-.5), idx:0, score:0};
    show('<div class="kicker">Lesson 4 · Show what you know</div>'+
      '<div class="recap"><strong>Module 19 quest:</strong> You learned to give every piece of money the right home.</div>'+
      '<h1 class="display">Five questions.</h1>'+
      '<p>Get 4 of 5 right and Module 19 is yours.</p>'+
      '<button onclick="next()">Start</button>');
  },
  ()=>{ masteryQ(); },
  ()=>{ finishMastery(mastery.score>=4); },
];
function masteryQ(){
  if(mastery.idx>=mastery.qs.length){ next(); return; }
  const qid=mastery.qs[mastery.idx];
  const q=QUESTIONS[qid];
  const cont=()=>{ mastery.idx++; masteryQ(); };
  if(q.type==="tf"){ renderTFM(qid,cont); } else { renderMCM(qid,cont); }
}
function renderMCM(qid,onDone){
  const q=QUESTIONS[qid];
  let html='<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>';
  q.opts.forEach((o,i)=>html+='<button class="opt" data-i="'+i+'">'+o.t+'</button>');
  html+='<div id="fb"></div><div id="cont"></div>'; show(html);
  let answered=false;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const o=q.opts[+btn.dataset.i];
      btn.classList.add(o.ok?"right":"wrong");
      if(o.ok) mastery.score++;
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("fb").innerHTML='<div class="feedback '+(o.ok?'good':'bad')+'">'+o.fb+'</div>';
      document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
      revealFB();
    };
  });
}
function renderTFM(qid,onDone){
  const q=QUESTIONS[qid];
  show('<div class="kicker">Mastery · '+(mastery.idx+1)+' of '+mastery.qs.length+'</div><h2 class="display">'+q.prompt+'</h2>'+
    '<div class="btn-row"><button class="opt" id="tT">True</button><button class="opt" id="tF">False</button></div>'+
    '<div id="fb"></div><div id="cont"></div>');
  let answered=false;
  function pick(v,el){
    if(answered)return; answered=true;
    const ok=(v===q.answer); if(ok)mastery.score++;
    el.classList.add(ok?"right":"wrong");
    document.getElementById("tT").disabled=true;document.getElementById("tF").disabled=true;
    document.getElementById("fb").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?q.good:q.bad)+'</div>';
    document.getElementById("cont").innerHTML='<button onclick="(_c())()">Continue</button>'; window._c=()=>onDone;
    revealFB();
  }
  document.getElementById("tT").onclick=e=>pick(true,e.target);
  document.getElementById("tF").onclick=e=>pick(false,e.target);
}
function finishMastery(pass){
  if(pass && !S.masteryPassed){ S.masteryPassed=true; addXP(20); }
  saveState();
  if(pass){
    show('<div class="night"><div class="lantern">🏮</div>'+
      '<h1 class="display" style="color:#fff">Module 19 complete</h1>'+
      '<p style="color:#cfe0ee">Quiz: '+mastery.score+'/5 ✓</p></div>'+
      '<div class="card"><p><strong>You now own:</strong> checking and savings — every piece of money now has a home that fits its job.</p>'+
      '<p>Rowing back, Kai realises something uncomfortable. The bank is a half-day away, across open water. Rana laughs and holds up her phone.</p>'+
      '<p>"You know you can see all of this from here, right?"</p>'+
      '<p class="muted">Module 20: Digital Banking. (Coming soon.)</p></div>'+
      '<button style="margin-bottom:10px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>'+
      '<button class="btn-ghost" onclick="goHome()">Stay in Module 19</button>');
    S.done[3]=true; saveState();
  } else {
    show('<div class="kicker">Almost there</div>'+
      '<h1 class="display">One more try</h1>'+
      '<p>You got '+mastery.score+' of 5. The keys: checking is for money you will spend soon, savings is for goal money, and separating them protects the goal.</p>'+
      '<button onclick="S.step=0;render()">Try again</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="toggleTutor(true)">Talk with the tutor</button>'+
      '<button class="btn-ghost" style="margin-top:10px" onclick="goHome()">Back home</button>');
  }
}

const LESSONS=[
  {title:"The Clerk's Question", sub:"Two kinds of money, two homes", steps:L1, emoji:"🧑🏽‍💼"},
  {title:"Which Home?", sub:"Sort five pieces of money", steps:L2, emoji:"🗂️"},
  {title:"Splitting the $25", sub:"Place money by the job it has to do", steps:L3, emoji:"⚖️"},
  {title:"Show What You Know", sub:"Mastery check", steps:L4, emoji:"🏮"},
];

/* =====================================================================
   HOME
===================================================================== */
function goHome(){
  dots(4, S.done.filter(Boolean).length-1);
  let html='<div class="kicker">Module 19</div><h1 class="display">Savings vs. Checking</h1>'+
    '<p class="muted">Four short lessons. The right home for every dollar.</p>';
  LESSONS.forEach((l,i)=>{
    const locked = i>0 && !S.done[i-1];
    const done = S.done[i];
    html+='<button class="opt" '+(locked?'disabled':'')+' onclick="startLesson('+i+')">'+
      '<span class="em">'+(done?'✅':locked?'🔒':l.emoji)+'</span><strong>'+l.title+'</strong><br>'+
      '<span class="muted" style="font-weight:400">'+l.sub+'</span></button>';
  });
  if(S.masteryPassed) html+='<div class="night" style="margin-top:8px"><div class="lantern">🏮</div><p style="color:#cfe0ee">Module 19 mastered · '+S.xp+' XP</p></div>';
  html+='<button class="btn-ghost" style="margin-top:14px" onclick="window.location.href=\'index.html\'">🗺️ Back to all modules</button>';
  show(html);
}
function startLesson(i){ S.lesson=i; S.step=0; saveState(); render(); }

/* =====================================================================
   TUTOR
===================================================================== */
let tHist=[];
function toggleTutor(on){
  document.getElementById("tutorPanel").classList.toggle("on",on);
  document.getElementById("tutorOverlay").classList.toggle("on",on);
  saveState();
  if(on&&tHist.length===0) tMsg("a","Hi! Ask me anything about checking, savings, or which money goes where — or tap a button below.");
}
document.getElementById("tutorBtn").onclick=()=>toggleTutor(true);
function tMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; document.getElementById("tlog").appendChild(d); d.scrollIntoView({behavior:"smooth"}); }
function quickAsk(t){ document.getElementById("tin").value=t; sendTutor(); }
async function sendTutor(){
  const inp=document.getElementById("tin"); const txt=inp.value.trim(); if(!txt) return;
  inp.value=""; tMsg("u",txt); tHist.push({role:"user",content:txt});
  const think=document.createElement("div"); think.className="msg a"; think.innerHTML='<span class="spin" style="border-color:var(--ink);border-top-color:transparent"></span>';
  document.getElementById("tlog").appendChild(think);
  const sys="You are the tutor inside Module 19 (Savings vs. Checking) of a financial-literacy app, in the Banking block. The learner may be a child or an adult. "+
    "They know from earlier modules: money, dollar, cent, add, subtract, buy, sell, pay, earn, spend, need, save, goal, multiply, divide, fraction, half, quarter, decimal, hundredth, percent, discount, bank, deposit, withdraw, balance. From THIS module: checking (the account for money you will spend soon — easy to reach on purpose), savings (the account for goal money, kept separate), and the core reason to separate them — money that is easy to reach gets reached for, so goal money kept apart does not get spent by accident a little at a time. Also: you need BOTH; keeping everything in savings leaves you unable to buy food this week. "+
    "STRICT RULES: never use these words (later modules): interest, money growing or earning in a bank, rate, APY (all Module 21), fees, overdraft, being charged, minimum balance (Module 22), debit card, credit card, credit, loan, borrow, lend, invest, budget, tax, online banking, app, notifications (Module 20). If asked whether savings makes your money grow, say warmly that there IS another reason savings accounts are special and it is coming in a couple of modules — do NOT explain interest. "+
    "Story context: the bank clerk asked whether Kai\'s money was for spending soon or keeping a while; Kai learned checking and savings; he sorted five items by which account fits; then split $25 into $10 checking (food and rope this week) and $15 savings (toward a sail). Module 10 is the cautionary tale — money leaked away on small things and he came up $1 short. "+
    "Never repeat a failed explanation — switch analogies (a lunchbox versus a locked keepsake box, a jar on the counter versus one on a high shelf, a wallet versus a safe). Keep answers under 80 words, warm, honest, never mark wrong ideas right. If asked \'Quiz me\', name ONE piece of money and ask which account it belongs in, then wait.";
  try{
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,system:sys,messages:tHist.slice(-10)}),signal:controller.signal});
    clearTimeout(timeout);
    const data=await r.json();
    const out=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim() || "I lost my thread. Ask again?";
    think.remove(); tMsg("a",out); tHist.push({role:"assistant",content:out});
  }catch(e){
    think.remove(); tMsg("a","I can't think right now. Try again in a moment — or tap the word cards up top to review.");
  }
}

/* ---------- boot ---------- */
(async function(){
  await loadState();
  document.getElementById("xpBox").textContent=S.xp+" XP";
  renderShelf();
  goHome();
})();
